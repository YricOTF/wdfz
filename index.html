/* ---------- 第三乐章 · 升 c 小调 急板 ----------
   左手十六分音符的琶音不停，右手一条往上冲的旋律。
   这是全曲最凶的一段，弹它会把东西招过来。 */
(function(){
  var BAR=0.72, S16=BAR/8;                 // 每小节 8 个十六分
  var LH=[37,44,49,52];                    // C#2 G#2 C#3 E3
  var figures=[
    { lh:LH, rh:[[56,0],[61,S16],[64,S16*2],[63,S16*3],[61,S16*4],[60,S16*5],[61,S16*6],[64,S16*7]] },
    { lh:LH, rh:[[61,0],[64,S16],[68,S16*2],[66,S16*3],[64,S16*4],[63,S16*5],[64,S16*6],[68,S16*7]] },
    { lh:[44,51,56,59], rh:[[68,0],[71,S16],[75,S16*2],[73,S16*3],[71,S16*4],[68,S16*5],[71,S16*6],[68,S16*7]] },
    { lh:LH, rh:[[64,0],[61,S16],[56,S16*2],[61,S16*3],[64,S16*4],[68,S16*5],[71,S16*6],[73,S16*7]] }
  ];
  var bars=figures.map(function(f){
    var out=[];
    for (var i=0;i<8;i++) out.push([f.lh[i%4], i*S16, S16*1.7, i%4===0?0.095:0.062]);
    for (var j=0;j<f.rh.length;j++) out.push([f.rh[j][0], f.rh[j][1], S16*2.1, 0.108]);
    return out;
  });
  MOVE[3]={ bar:BAR, bars:bars, feel:'我：这个不一样。这个是急的。' };
})();
var PIANO={ on:false, bar:0, barT:null, notes:[], plan:[] };
function pianoStop(){
  PIANO.on=false;
  if (PIANO.barT){ clearTimeout(PIANO.barT); PIANO.barT=null; }
  for (var i=0;i<PIANO.notes.length;i++) clearTimeout(PIANO.notes[i]);
  PIANO.notes.length=0;
}
/* 钢琴音色：基音 + 八度 + 十二度 + 一个不谐和的七度，
   高次泛音衰减更快 —— 比单根正弦像钢琴得多。 */
function auPiano(freq, dur, gain){
  if (!AU.ok || !freq) return;
  try{
    var ctx=AU.ctx, t=ctx.currentTime;
    var parts=[[1,1.00,1.00],[2,0.42,0.72],[3,0.17,0.50],[4.7,0.075,0.34]];
    for (var i=0;i<parts.length;i++){
      var f=freq*parts[i][0];
      if (f>11000 || f<20) continue;
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(f,t);
      var g=ctx.createGain();
      var pk=Math.max(0.0002, gain*parts[i][1]);
      var dd=Math.max(0.12, dur*parts[i][2]);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(pk, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dd);
      o.connect(g); g.connect(AU.master);
      o.start(t); o.stop(t+dd+0.05);
    }
  }catch(e){}
}
function pianoNote(midi, delay, dur, vol){
  PIANO.plan.push([midi, delay, dur, vol]);          // 先记账，没音频也能验证排期
  /* 原来这里 AU.ok 为假就直接 return —— 音频还没初始化的话，整首曲子一个音都不排，
     而且永远不重试。现在照排，真正发声交给 auPiano 自己判断。 */
  PIANO.notes.push(setTimeout(function(){
    if (!PIANO.on) return;
    try{ auInit(); auResume(); }catch(e){}
    auPiano(mtof(midi), dur, vol);
  }, delay*1000));
}
function pianoBar(){
  if (!PIANO.on) return;
  if (!ACT.on || ACT.kind!=='piano'){ pianoStop(); return; }   // 活动一停，曲子也停
  var MOV=MOVE[PIANO.mv]||MOVE[1];
  var bar=MOV.bars[PIANO.bar % MOV.bars.length];
  for (var i=0;i<bar.length;i++){
    var e=bar[i];
    pianoNote(e[0], e[1], e[2], e[3]);
  }
  PIANO.bar++;
  PIANO.barT=setTimeout(pianoBar, MOV.bar*1000);
}
function pianoStart(){
  pianoStop();
  PIANO.on=true; PIANO.bar=0; PIANO.plan.length=0;
  /* 三个乐章轮着来：第一次弹是第一乐章，第二次第二，第三次之后都是第三。
     第三乐章是 Presto agitato —— 急板，会招来更多东西。 */
  PIANO.mv = S.pianoMv || 1;
  S.pianoMv = (S.pianoMv||1) >= 3 ? 3 : (S.pianoMv||1)+1;
  pianoBar();
}

  if (S.screen!=='play'||S.dead||S.death||RT.end||PAUSE.on||MAPV.on||DLG.open) return;

function throwItem(preferredSlot){
  if(S.screen!=='play'||S.dead||S.death||RT.end||PAUSE.on||MAPV.on||DLG.open) return;
  var i, k=(typeof preferredSlot==='number' && preferredSlot>=0 && preferredSlot<BAG_MAX && S.bag[preferredSlot])?preferredSlot:-1;
  if(k<0) for(i=0;i<BAG_MAX;i++) if(S.bag[i]) k=i;
  if(k<0){ os('我：手里什么都没有。',3.0); return; }
  var it=S.bag[k]; S.bag[k]=null; renderBag(); SFX.ui();
  var dx=S.x,dy=S.y;
  if(S.talent==='hand' && /^teach[1-5]$/.test(S.room||'')){
    var R=INTERIORS[S.room];
    var tx=R.ox+2.5*R.tw, ty=R.oy+12.5*R.th;
    if(Math.abs(S.x-tx)<R.tw*2.5 && Math.abs(S.y-ty)<R.th*3.5){ dx=tx; dy=ty; }
  }
  RT.dropped={ item:it, room:S.room, x:dx, y:dy };       // 保留：第三个隔间那个彩蛋要用
  DROP.push({ item:it, room:S.room, x:dx, y:dy });
  os('我：我把'+(ITEMS[it]?ITEMS[it].n:'东西')+'放在地上了。',3.8);
  setTimeout(function(){ os('我：……待会儿还能捡回来。',3.4); },2600);
}
/* ============================ 地上的东西 ============================
   扔出去的物品会留在地上（DROP 列表），走过去按 E 就能捡回来。
   原来只有 RT.dropped 一个字段、而且没人读 —— 扔了就永久消失。 */
var DROP=[];
function dropNear(){
  if (S.dead||S.death||RT.end) return -1;
  var best=-1, bd=1e9;
  for (var i=0;i<DROP.length;i++){
    var d=DROP[i];
    if (d.room!==S.room) continue;
    var dx=S.x-d.x, dy=S.y-d.y, dd=dx*dx+dy*dy;
    if (dd<28*28 && dd<bd){ bd=dd; best=i; }
  }
  return best;
}
function pickupDrop(){
  var i=dropNear(); if (i<0) return false;
  var d=DROP[i];
  /* 背包满了就先腾地方 */
  var slot=-1, j;
  for (j=0;j<BAG_MAX;j++) if (!S.bag[j]){ slot=j; break; }
  if (slot<0){ os('我：背包满了。',3.0); return true; }
  S.bag[slot]=d.item; DROP.splice(i,1);
  if (RT.dropped && RT.dropped.item===d.item && RT.dropped.x===d.x && RT.dropped.y===d.y) RT.dropped=null;
  renderBag(); SFX.ui();
  os('我：我把'+(ITEMS[d.item]?ITEMS[d.item].n:'东西')+'捡起来了。',3.6);
  return true;
}

function triUp(ctx,x,y,s,alpha){
  ctx.beginPath();
  ctx.moveTo(x-s, y-s*0.85);
  ctx.lineTo(x+s, y-s*0.85);
  ctx.lineTo(x,   y+s*0.55);
  ctx.closePath();
  ctx.fillStyle='rgba(236,220,168,'+alpha+')';
  ctx.fill();
  ctx.strokeStyle='rgba(24,22,20,'+(alpha*0.55)+')'; ctx.lineWidth=1;
  ctx.stroke();
}

function drawInteractMarks(){

var NIGHT={ on:false, litT:0, flick:0, k:0, warn1:0, warn2:0 };
/* 校园里的路灯。原来有两盏在墙外（600,1400 在校区南墙之外、340,860 在西边界之外），
   玩家永远走不到，等于废的。现在全挪进校区。 */
var NIGHT_LIGHTS=[
  {x:514,y:170,r:22},{x:514,y:260,r:22},{x:416,y:520,r:22},{x:660,y:520,r:22},
  {x:420,y:780,r:22},{x:660,y:1060,r:22},{x:480,y:1180,r:22},{x:600,y:1150,r:22},
  {x:376,y:900,r:22},{x:690,y:880,r:22}
];
function isNight(){ return S.tsec>=22.5*3600 || S.tsec<7*3600+20*60; }
function nightUpdate(dt){
  NIGHT.on = isNight() && !RT.end;
  if (!NIGHT.on){ NIGHT.litT=0; NIGHT.warn1=0; NIGHT.warn2=0; NIGHT.k=Math.max(0,NIGHT.k-dt); return; }
  NIGHT.k=Math.min(1,NIGHT.k+dt*0.85);
  NIGHT.flick += dt;
  var inLight=false, i;
  if (S.mode==='out'){
    for(i=0;i<NIGHT_LIGHTS.length;i++){
      var L=NIGHT_LIGHTS[i];
      if (NIGHT.flick%3.1 < 0.5 && i%3===1) continue;
      var dx=S.x-L.x*SC, dy=S.y-L.y*SC;
      if (dx*dx+dy*dy < (L.r*SC)*(L.r*SC)){ inLight=true; break; }
    }
  } else {
    var R=INTERIORS[S.room];
    if (R && R.lamps) for(i=0;i<R.lamps.length;i++){
      var lm=R.lamps[i];
      if (NIGHT.flick%2.7 < 0.4 && i%2===0) continue;
      var ddx=S.x-lm.x, ddy=S.y-lm.y;
      if (ddx*ddx+ddy*ddy < (lm.w*1.35)*(lm.w*1.35)){ inLight=true; break; }
    }
  }
  /* 站在灯下会死。数值是配着灯的大小算的（灯的半径 r=22 → 直径 88 世界单位）：
       走路 21 单位/秒 → 穿过 4.2 秒
       跑步 36.4 单位/秒 → 穿过 2.4 秒
       死线 5.2 秒 → 走路穿过去有惊无险，跑步从容，站着不动才死。
     原来死线 1.6 秒、灯直径 136 单位，等于夜里根本出不了门。 */
  if (inLight){
    NIGHT.litT+=dt;
    S.san -= dt*0.50;                       // 灯下 SAN 掉得更快
    if (!NIGHT.warn1 && NIGHT.litT>3.0){ NIGHT.warn1=1; os('我：……灯下面那个影子不动。',4.0); }
    if (!NIGHT.warn2 && NIGHT.litT>4.2){ NIGHT.warn2=1; os('我：它在等我看过去。',3.6); }
    if (NIGHT.litT>5.2) kill('路灯下的东西把你收了。','lamps');
  } else {
    NIGHT.litT=Math.max(0, NIGHT.litT-dt*1.5);
    if (NIGHT.litT<=0){ NIGHT.warn1=0; NIGHT.warn2=0; }
  }
  S.san -= dt*0.055;
}
/* 环境音的音量：场景越糟，底噪越沉。
   室内比室外闷，夜里更沉，SAN 越低越压。 */
function ambUpdate(dt){
  if (!AU.ok) return;
  if (!OPT.amb){ if (AU.amb) SFX.ambOff(); return; }
  if (!AU.amb) SFX.ambOn();
  if (!AU.amb) return;
  var lvl = 0.030;
  lvl += (S.mode==='in') ? 0.012 : 0.0;                    // 室内更闷
  lvl += (1 - clamp(S.san,0,100)/100) * 0.045;             // SAN 越低越沉
  if (typeof NIGHT!=='undefined' && NIGHT.on) lvl += 0.020;
  if (dangerAt()) lvl += 0.022;
  if (ACT.on) lvl *= 0.45;                                  // 做活动的时候让一让
  if (RT.end || S.dead || S.death) lvl = 0;
  try{
    var g=AU.amb.gain, c=AU.ctx, now=c.currentTime;
    var cur=g.value;
    var want=Math.max(0.0002, lvl);
    g.setTargetAtTime(want, now, 1.4);                      // 慢慢滑过去，不要突然变
  }catch(e){}
}
function drawNightOverlay(){
  if (!NIGHT.on) return;

  if (!VIEW.fp){

    var dx=L.x*SC-S.x, dy=L.y*SC-S.y, dist=Math.sqrt(dx*dx+dy*dy);

    g2.addColorStop(1,'rgba(255,226,160,0)');
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(scr,MH*0.46,r2,0,TAU); ctx.fill(); }

function update(dt){
  if (S.screen!=='play'){ flashForceEnd(); return; }
  if (PAUSE.on||RT.end||MAPV.on){ flashForceEnd(); return; }
  if (S.death){ deathUpdate(dt); return; }
  if (S.dead){ S.deadT+=dt; return; }
  var ax=0, ay=0;
  if (K['w']||K['arrowup']) ay-=1;
  if (K['s']||K['arrowdown']) ay+=1;
  if (K['a']||(!VIEW.fp&&K['arrowleft'])) ax-=1;
  if (K['d']||(!VIEW.fp&&K['arrowright'])) ax+=1;
  if (TOUCH.active){
    ax=TOUCH.dx; ay=TOUCH.dy;
    if (Math.abs(ax)<0.16) ax=0; if (Math.abs(ay)<0.16) ay=0;
    if (VIEW.fp && Math.abs(ax)<0.3) ax=0;
    K['shift'] = !!TOUCH.sprint;
  }
  if (AN.cur==='loop' && AN.loopInv && !(K[' ']||K['shift'])){ ax=-ax; ay=-ay; }
  if (S.unwell>0){ ax*=0.55; ay*=0.55; }
  if (USE.phone===2){ ax*=0.55; ay*=0.55; }
  if (S.seated){ ax=0; ay=0; K['shift']=false; }
  if (ACT.on){
    if (Math.abs(ax)>0.16 || Math.abs(ay)>0.16){ actStop(false); S.vx=0; S.vy=0; }
    ax=0; ay=0;
  }
  var wantRun=!!(K['shift']&&(ax||ay));

  if (!elSub) return;

    var op=(1-age*0.55).toFixed(2);

    h+='<div class="subline" style="opacity:'+op+';font-size:'+sz+'em">'+SUBS[i].t+'</div>';
  }

  elSub.classList.toggle('on', SUBS.length>0);

/* ============================ 主循环 ============================ */
var last=0, acc=0, frames=0;
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last=now;
  var dt=(now-last)/1000; last=now;
  if (dt>DTMAX) dt=DTMAX;
  trUpdate(dt);
  acc+=dt;
  var guard=0;
  while (acc>=STEP && guard<6){ update(STEP); acc-=STEP; guard++; }
  if (guard>=6) acc=0;
  frames++;
  if (FLASHBLOOM.t>0) FLASHBLOOM.t-=dt;
  tutTick(dt);               // 必须放在 update 之外 —— update/anUpdate 在死亡时会提前 return
  flashUpdate(dt);            // 必须放在 update 之外 —— update 在开地图/暂停/死亡时会提前 return，
                              // 放在里面会让闪回卡住，BW 停在 false，再也切不回里世界
  if (S.dead) deadSeqTick(dt);
  TITLELOCK=0; ENDLOCK=0;
  fadeUpdate(dt);
  qSample(dt);
  if (OPT.boil && (frames%BOIL)===0) boil=(boil+1)&3;
  /* 死亡演出：按死因播不同的动画，画在冻结的最后一帧上面 */
  if (S.dead && !DEADSEQ.done){
    var da  = clamp(DEADSEQ.t/DEADSEQ.dur, 0, 1);
    var dk  = DFX[DEADSEQ.kind] || DFX.vignette;
    var ctx = C;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.save();
    ctx.globalCompositeOperation='source-over';
    try{ dk(ctx, MW, MH, da, DEADSEQ.t); }catch(e){ DFX.vignette(ctx,MW,MH,da,DEADSEQ.t); }
    ctx.restore();
    /* 最后 0.6 秒补一层纯黑，保证 UI 出来时背景是黑的 */
    if (DEADSEQ.t > DEADSEQ.dur-0.6){
      var kb=(DEADSEQ.t-(DEADSEQ.dur-0.6))/0.6;
      ctx.fillStyle='rgba(0,0,0,'+clamp(kb,0,1)+')'; ctx.fillRect(0,0,MW,MH);
    }
  }
  devUpdate(dt);
  dlgUpdate(dt);
  fallUpdate(dt);
  if (S.screen==='play' && !S.started){ S.screen='title'; elTitle.classList.add('on'); elHud.classList.remove('on'); }
  render(); hud();
}
