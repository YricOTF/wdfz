<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>武大附中 · 里世界</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0b09;
    font-family:"Kaiti SC","STKaiti","KaiTi","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
  #wrap{position:fixed;inset:0}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none;font-size:13px;letter-spacing:.5px;opacity:0;transition:opacity .6s;
    padding:var(--sat) var(--sar) var(--sab) var(--sal)}
  #hud.on{opacity:1}
  #top{position:absolute;top:0;left:0;right:0;padding:calc(8px + var(--sat)) calc(14px + var(--sar)) 8px calc(14px + var(--sal));display:flex;align-items:center;gap:12px}
  #sanbox{flex:0 0 132px;height:9px;border:1.5px solid #4a4038;border-radius:5px;position:relative;background:#1a1712;overflow:hidden}
  #sanbar{position:absolute;inset:0;width:100%;background:#b4483c;transform-origin:left center;transition:transform .25s linear}
  #clock{font-size:19px;color:#e8ddc8;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;letter-spacing:1px}
  #sched{margin-left:auto;color:#a1937f;font-size:12.5px;transition:color .3s}
  #sched.warn{color:#e0705a}
  #locname{position:absolute;top:44px;left:14px;color:#8e8272;font-size:12px}
  .btn{pointer-events:auto;cursor:pointer;background:#1c1815;color:#e8ddc8;
    border:1.5px solid #524639;border-radius:3px;padding:9px 16px;font-family:inherit;font-size:14px;
    letter-spacing:1px;transition:background .12s}
  .btn:hover{background:#2a241d}
  #bagbtn{position:absolute;left:calc(14px + var(--sal));bottom:calc(14px + var(--sab))}
  #actbtn{position:absolute;right:calc(14px + var(--sar));bottom:calc(96px + var(--sab));display:none;
    width:76px;height:76px;border-radius:50%;font-size:15px;letter-spacing:2px;padding:0}
  body.touch #actbtn{display:block}
  body.touch .btn{padding:12px 18px;font-size:15px}
  body.touch #bagbtn{bottom:calc(14px + var(--sab))}
  @media (max-width:820px){
    #devp{width:100%;border-right:none}
    #title .btn{width:74vw;max-width:320px}
    #sub{font-size:15px;bottom:calc(118px + var(--sab));max-width:88vw}
    #dlg{max-width:80vw}
    #dlgb{font-size:14px}
    #choices{right:calc(14px + var(--sar));bottom:calc(126px + var(--sab))}
    #choices .btn{min-width:130px}
  }
  #choices{position:absolute;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #choices .btn{min-width:150px;text-align:left}
  #choices .btn .k{color:#8e8272;margin-right:7px;font-size:12px}
  #prompt{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);

    padding:6px 14px;font-size:13.5px;display:none}
  #inv{position:fixed;inset:0;background:rgba(8,7,5,.9);display:flex;align-items:center;justify-content:center;

  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .slot{height:78px;border:1.5px dashed #3d352c;border-radius:3px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;color:#6d6355;font-size:11.5px;text-align:center;padding:4px;line-height:1.2}
  .slot.has{border-style:solid;border-color:#8a7a52;color:#e0d3b4;background:#221d16}
  .slot svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .slot.has svg{color:#d8c48e}
  #invbox .foot{margin-top:14px;color:#6d6355;font-size:12px;text-align:right}
  #toast{position:absolute;left:50%;top:84px;transform:translateX(-50%) translateY(-6px);color:#e8ddc8;
    background:rgba(20,17,13,.85);border-left:3px solid #8a7a52;padding:7px 14px;font-size:13.5px;
    opacity:0;transition:opacity .32s,transform .32s;max-width:70%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #vign{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(90,10,10,.6) 100%)}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  'b':'bed','t':'table','k':'counter','f':'cabinet','l':'lab','w':'basin','v':'rack' };
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;opacity:0;pointer-events:none;transition:opacity .7s ease}
  #title{display:none !important;visibility:hidden !important}
  #title.on{opacity:1;pointer-events:auto}
  #title .btn{width:260px;text-align:center;padding:13px 0;font-size:17px;letter-spacing:7px;
    background:none;border:none;color:#9d9179;transition:color .2s ease,letter-spacing .25s ease}
  #title .btn:hover{background:none;border:none;color:#f6ead0;letter-spacing:11px;text-shadow:0 0 18px rgba(220,200,150,.35)}
  #title .thint{position:absolute;bottom:26px;font-size:12px;color:#5f5748;letter-spacing:2px}

  #pset{display:none;flex-direction:column;gap:12px;margin-top:12px;width:300px}

  #pset .row{display:flex;align-items:center;gap:10px;font-size:13px;color:#a99b80}
  #pset .row label{flex:0 0 84px}
  #pset input[type=range]{flex:1;accent-color:#3fd0c9}
  #pset input[type=checkbox]{width:16px;height:16px;accent-color:#3fd0c9}
  #pset .row span{flex:0 0 40px;text-align:right;color:#ded2b6;font-variant-numeric:tabular-nums}
  #pmsg{font-size:12px;color:#8fbf8f;height:16px;letter-spacing:2px}
  #dead{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:38px;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
  #dead.on{opacity:1;pointer-events:auto}
  #dead .t{font-size:34px;letter-spacing:10px;color:#ded6c4;font-family:"Kaiti SC","STKaiti","KaiTi",serif;
    text-indent:10px}
  #dead .btn{width:200px;text-align:center;padding:12px 0;font-size:15px;letter-spacing:4px;
  opacity:0;transition:opacity .8s ease .9s}
#dead.on .btn{opacity:1}
#dead .cause{margin-top:18px;font-size:15px;letter-spacing:2px;color:#8d8574;
  max-width:62vw;text-align:center;line-height:1.7;opacity:0;transition:opacity 1s ease .5s}
#dead.on .cause{opacity:1}
#dead .t{opacity:0;transition:opacity 1.1s ease .15s}
#dead.on .t{opacity:1}
  /* ---------- 主角对话框 ---------- */
  #proskip{position:absolute;right:26px;bottom:26px;z-index:5;background:none;border:1px solid #4a4132;
  border-radius:3px;color:#8d8574;font-family:inherit;font-size:13px;letter-spacing:3px;
  padding:9px 20px;cursor:pointer;pointer-events:auto;transition:color .2s,border-color .2s}
#proskip:hover{color:#f0e4c8;border-color:#8d8574}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:80;transition:opacity .7s ease}
#fade.on{opacity:1;pointer-events:auto}
#dlg{position:fixed;left:0;top:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .16s;
    max-width:min(46vw,520px)}
  #dlg.on{opacity:1}
  #dlgb{position:relative;background:rgba(236,230,214,.96);color:#241f18;border:2px solid #3a332a;
    border-radius:4px;padding:10px 14px;font-size:14.5px;line-height:1.62;letter-spacing:.6px;
    box-shadow:1.5px 2px 0 rgba(0,0,0,.45);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  #dlgb:after{content:'';position:absolute;left:26px;top:-11px;width:0;height:0;
    border:9px solid transparent;border-bottom-color:#3a332a}
  #dlgb:before{content:'';position:absolute;left:27.5px;top:-7.5px;width:0;height:0;
    border:7.5px solid transparent;border-bottom-color:rgba(236,230,214,.96);z-index:1}
  #dlg.who{color:#8a2b22}
  #dlgc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(168px + var(--sab));z-index:41;
    display:flex;flex-direction:column;gap:6px;align-items:stretch;pointer-events:auto;
    opacity:0;transition:opacity .18s}
  #dlgc:not(:empty){opacity:1}
  #dlgc button{min-width:280px}
  #dlgc button{font-family:"Kaiti SC",serif;font-size:15px;text-align:center;cursor:pointer;letter-spacing:1px;
    background:rgba(14,12,10,.86);color:#ded2b6;border:1px solid rgba(140,126,96,.55);border-radius:2px;padding:9px 16px;
    text-shadow:0 1px 6px #000;transition:color .15s,border-color .15s,background .15s}
  #dlgc button:hover{color:#fff3d6;border-color:#c9b489;background:rgba(40,34,26,.92)}
  #dlgc button:hover{background:rgba(58,48,36,.96);border-color:#c9b489}
  #dlgc button i{color:#8e8272;font-style:normal;margin-right:7px;font-size:12px}
  /* ---------- 底部内心字幕 ---------- */
  #sub{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(7px);z-index:39;
    pointer-events:none;opacity:0;transition:opacity .5s ease,transform .5s ease;max-width:74vw;
    text-align:center;font-size:16.5px;line-height:1.7;letter-spacing:1.2px;color:#e2d8c0;
    text-shadow:0 2px 8px #000,0 0 22px rgba(0,0,0,.95);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  #sub.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #sub .em{color:#e0705a}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div id="vign"></div>
  <div id="top">
    <div id="sanbox"><div id="sanbar"></div></div>
    <div id="clock">7:20</div>
    <div id="sched">早读 · 教室</div>
  </div>
  <div id="locname">武大附中</div>
  <div id="toast"></div>
  <div id="dev">v1.0</div>
  <button class="btn" id="bagbtn">背包</button>
  <div id="prompt"></div>
  <div id="choices"></div>
</div>

<!-- 手机端互动 / 疾跑按钮：body.touch 时才显示，用绝对定位钉在右下 -->
<div id="actbtn">互 动</div>

<div id="inv"><div id="invbox">
  <h2>背 包</h2>
  <div id="grid"></div>
  <div class="foot" id="bagfoot">按 1–8 或点格子使用 · B / Esc 关闭</div>
</div></div>

<div id="title">
  <div class="ver">正式版 v1.0</div>
  <button class="btn" id="btnNew">新 的 梦</button>
  <button class="btn" id="btnLoad">继 续</button>
  <button class="btn" id="btnSet">选 项</button>
  <div class="thint">W A S D 移动 · Shift 疾跑 · E 交互 · B 背包</div>
</div>

<div id="pro"><div id="protext"></div><div id="prohint">点击 / 空格 继续</div><button id="proskip">跳 过</button></div>

<div id="devp"></div>
<div id="devtag"></div>
<div id="devpv"></div>
<div id="dlg"><div id="dlgb"></div><div id="dlgc"></div></div>
<div id="sub"></div>
<div id="fade"></div>
<div id="dead"><div class="t">你死了。</div><div class="cause" id="deadcause"></div><button class="btn" id="deadbtn">返回主菜单</button></div>
<div id="end"><h1 id="endt"></h1><ul id="endl"></ul><button class="btn" id="endbtn">返回主菜单</button></div>
<div id="pause">
  <div class="ph">暂 停</div>
  <button class="btn" id="pbResume">继 续 游 戏</button>
  <button class="btn" id="pbSave">保 存 进 度</button>
  <button class="btn" id="pbLoad">读 取 进 度</button>
  <button class="btn" id="pbSet">设 置</button>

  <div id="pset">
    <div class="row"><label>主音量</label><input type="range" id="stVol" min="0" max="100" value="50"><span id="stVolv">50</span></div>

    <div class="row"><label>字幕停留</label><input type="range" id="stSub" min="1" max="8" value="4"><span id="stSubv">4s</span></div>
  </div>
  <div id="pmsg"></div>
</div>

<script>
(function(){
"use strict";

/* ============================ 常量 ============================ */
var STEP=1/60, DTMAX=1/15, TAU=Math.PI*2, DEG=Math.PI/180, BAG_MAX=8;
var SC=2.0;
var SPD_WALK=21, SPD_RUN=36.4, STAM_MAX=100, STAM_DRAIN=17, STAM_REGEN=11;
var FOV=90*DEG, FOV_FEATHER=6*DEG;      // 视野 ±90°，再各羽化 6°
var TCOLS=60, TROWS=26, TTILE=9;   // 走廊加宽到 9 行（81 单位），不再挤
var RATE_CLASS=80;    // 上课
var RATE_BREAK=12;    // 课间   —— 三次课间合计 ≈ 5 真实分钟
var RATE_MEAL =14;    // 午饭 / 午休 / 晚饭 —— 合计 ≈ 15 真实分钟
var RATE_NIGHT=17;    // 晚自习 / 熄灯后 —— 合计 ≈ 20 真实分钟
var RATE_FREE =37;    // 课外活动
var RATE_ASSEM=30;    // 课间操
var DIM_T='rgba(44,41,38,0.17)', DIM_B='rgba(26,26,26,0.20)';

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hash2(x,y,s){ var h=(x*374761393+y*668265263+s*2147483647)|0; h=(h^(h>>13))*1274126177|0; return ((h^(h>>16))>>>0)/4294967296; }
function aabb(cx,cy,r,b){ var nx=cx<b.x?b.x:(cx>b.x+b.w?b.x+b.w:cx), ny=cy<b.y?b.y:(cy>b.y+b.h?b.y+b.h:cy); var dx=cx-nx,dy=cy-ny; return dx*dx+dy*dy<r*r; }
function pointInPoly(x,y,P){ var c=false; for(var i=0,j=P.length-1;i<P.length;j=i++){ var xi=P[i][0],yi=P[i][1],xj=P[j][0],yj=P[j][1]; if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function angLerp(a,b,t){ var d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t; }
function smooth(t){ return t*t*(3-2*t); }

/* ============================ 手绘线条 ============================ */
var VARS=4, BOIL=7, EMPTY=[];
function rectPts(x,y,w,h,step){ var p=[],i; for(i=x;i<x+w;i+=step)p.push([i,y]); p.push([x+w,y]); for(i=y;i<y+h;i+=step)p.push([x+w,i]); p.push([x+w,y+h]); for(i=x+w;i>x;i-=step)p.push([i,y+h]); p.push([x,y+h]); for(i=y+h;i>y;i-=step)p.push([x,i]); p.push([x,y]); return p; }
function ellPts(cx,cy,rx,ry,n){ n=n||30; var p=[],i,a; for(i=0;i<n;i++){a=i/n*TAU;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);} p.push([cx+rx,cy]); return p; }
function bake(pts,amp,seed){ var out=[],k,i,n=pts.length; for(k=0;k<VARS;k++){ var a=new Float32Array(n*2); for(i=0;i<n;i++){ var t=(i===0||i===n-1)?0.3:1; a[i*2]=pts[i][0]+(hash2(i,0,seed+k*131)-0.5)*2*amp*t; a[i*2+1]=pts[i][1]+(hash2(i,1,seed+k*131)-0.5)*2*amp*t; } out.push(a); } return out; }
var boil=0;
function pathOf(ctx,v,bi){ var a=v[bi===undefined?boil:bi], n=a.length;
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); for(var i=2;i<n;i+=2) ctx.lineTo(a[i],a[i+1]); }
function strokeV(ctx,v,st,bi){ pathOf(ctx,v,bi); if(st.f){ctx.fillStyle=st.f;ctx.fill();}
  if(st.c){ ctx.strokeStyle=st.c; ctx.lineWidth=st.w||1.6; if(st.dash)ctx.setLineDash(st.dash); ctx.stroke(); ctx.setLineDash(EMPTY); } }

/* ============================ 音效 ============================ */
var AU={ ok:false, ctx:null, master:null, noise:null, rainSrc:null, rainGain:null, tried:false };
function auInit(){
  if (AU.ctx||AU.tried) return; AU.tried=true;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ AU.ctx=new AC(); var ctx=AU.ctx;
    var master=ctx.createGain(); if(!master||!master.gain||!master.connect) throw new Error('x');
    master.gain.value=0.5; master.connect(ctx.destination); AU.master=master;
    var n=Math.floor(ctx.sampleRate*2), buf=ctx.createBuffer(1,n,ctx.sampleRate);
    if(!buf||!buf.getChannelData) throw new Error('x');
    var d=buf.getChannelData(0); for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    AU.noise=buf;
    var s=ctx.createBufferSource(); s.buffer=buf; s.loop=true;
    var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=260; f.Q.value=0.6;
    var g=ctx.createGain(); g.gain.value=0.05;
    s.connect(f); f.connect(g); g.connect(master); s.start();
    AU.ok=true;
  }catch(e){ AU.ok=false; AU.ctx=null; }
}
function auResume(){ if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume(); }
function auN(dur,f0,f1,q,gain,type){ if(!AU.ok) return;
  try{ var ctx=AU.ctx,t=ctx.currentTime;
    var s=ctx.createBufferSource(); s.buffer=AU.noise; s.loop=true;
    var flt=ctx.createBiquadFilter(); flt.type=type||'bandpass';
    flt.frequency.setValueAtTime(f0,t); flt.frequency.exponentialRampToValueAtTime(Math.max(28,f1),t+dur); flt.Q.value=q||1;
    var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(flt); flt.connect(g); g.connect(AU.master); s.start(t); s.stop(t+dur+0.05);
  }catch(e){} }
function auT(f0,f1,dur,gain,type){ if(!AU.ok) return;
  try{ var ctx=AU.ctx,t=ctx.currentTime;
    var o=ctx.createOscillator(); o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(18,f1),t+dur);
    var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+dur+0.05);
  }catch(e){} }

  stair:function(){ auN(0.06,900,300,1.5,0.07); setTimeout(function(){ auN(0.06,760,240,1.5,0.06); },110); },

  bell:function(){ auT(524,520,1.5,0.085); auT(1048,1040,1.0,0.032); },

  sleep:function(){ auT(180,28,2.6,0.10); auN(2.6,420,60,0.5,0.05,'lowpass'); },
  rainOn:function(){ if(!AU.ok||AU.rainSrc) return;
    try{ var ctx=AU.ctx; var s=ctx.createBufferSource(); s.buffer=AU.noise; s.loop=true;
      var f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.35;
      var g=ctx.createGain(); g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(0.16,ctx.currentTime+1.2);
      s.connect(f); f.connect(g); g.connect(AU.master); s.start(); AU.rainSrc=s; AU.rainGain=g; }catch(e){} },
  rainOff:function(){ if(!AU.rainSrc) return;
    try{ var g=AU.rainGain,s=AU.rainSrc,c=AU.ctx;
      g.gain.cancelScheduledValues(c.currentTime); g.gain.setValueAtTime(g.gain.value,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+1.6); s.stop(c.currentTime+1.8); }catch(e){}
    AU.rainSrc=null; AU.rainGain=null; }

var TR={ on:false, p:0, dur:0.4, kind:'fade', fired:false, cb:null };
function go(kind,dur,cb,quiet){ if(TR.on) return; TR.on=true; TR.p=0; TR.dur=dur; TR.kind=kind; TR.cb=cb; TR.fired=false; if(!quiet) SFX.trans(); }
function trUpdate(dt){ if(!TR.on) return; TR.p+=dt/TR.dur; if(!TR.fired&&TR.p>=0.5){ TR.fired=true; if(TR.cb) TR.cb(); } if(TR.p>=1){ TR.on=false; TR.p=0; } }
function trDraw(){
  if (!TR.on) return;
  var a=smooth(clamp(TR.p<0.5?TR.p*2:(1-TR.p)*2,0,1));
  var ctx=C; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000';
  if (TR.kind==='blink'){ var hh=MH*a/2; ctx.fillRect(0,0,MW,hh); ctx.fillRect(0,MH-hh,MW,hh+1); }
  else if (TR.kind==='stair'){ ctx.fillRect(0,0,MW,MH*a); }
  else { ctx.globalAlpha=a; ctx.fillRect(0,0,MW,MH); ctx.globalAlpha=1; }
}

/* ---------- 闪回：表世界只能被"想起来"，不能走过去 ---------- */
var FLASH={ t:0, dur:0, cool:0 };
var FLASHBLOOM={ t:0 };
function flashBack(dur){
  FLASHBLOOM.t=0.45;
  if (FLASH.t>0) { FLASH.t=Math.max(FLASH.t,dur); return; }
  if (FLASH.cool>0) return;
  FLASH.t=dur; FLASH.dur=dur; FLASH.cool=2.2;
  BW=false; buildOutdoor(); for(var q in INTERIORS) INTERIORS[q].baked=false;
  if (S.room && INTERIORS[S.room]) buildInterior(S.room);
  dropCache(); SFX.blink();
}
/* 任何"离开游戏画面"的动作都要把闪回收干净 */
function flashForceEnd(){ if (FLASH.t>0) flashEnd(); }
function flashEnd(){
  FLASH.t=0; BW=true;
  buildOutdoor(); for(var q in INTERIORS) INTERIORS[q].baked=false;
  if (S.room && INTERIORS[S.room]) buildInterior(S.room);
  dropCache();
}
function flashUpdate(dt){
  if (FLASH.cool>0) FLASH.cool-=dt;
  if (FLASH.t>0){ FLASH.t-=dt; if (FLASH.t<=0) flashEnd(); return; }
  /* SAN 低的时候偶尔"看见"表世界。原来 30%/秒 太密，像在闪屏；
     现在 6%/秒（平均十几秒一次），而且每次都配一声轻响 + 一层白光，看得出是有意为之。 */
  if (S.san<20 && S.screen==='play' && !S.dead && !S.death && !PAUSE.on && !MAPV.on
      && Math.random()<dt*0.06){
    flashBack(0.42);
    FLASH.bloom=1;
    try{ SFX.blink(); }catch(e){}
  }
}

/* ---------- 场地线稿 ----------
   球场的白线、田径场的跑道分道线。全部烘进 G.polys，逐帧零开销。
   坐标一律用 V5 图纸坐标，函数内部乘 SC。 */
function arcPts(cx,cy,rx,ry,a0,a1,n){
  var out=[], i;
  for(i=0;i<=n;i++){ var a=a0+(a1-a0)*(i/n); out.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
  return out;
}
var CLL='rgba(242,238,226,0.78)';      // 球场白线
var CLL2='rgba(242,238,226,0.50)';     // 次要线
function lineS(x1,y1,x2,y2,seed,w){
  addShape('stroke', [[x1*SC,y1*SC],[x2*SC,y2*SC]], 0.8, seed, { c:CLL, w:w||2.6 });
}
/* 注意：rectPts(x,y,w,h,step) 的第 5 个参数是步长，不是圆角半径。传 0 会死循环。 */
function rectS(x,y,ww,hh,seed,w){
  addShape('stroke', rectPts(x*SC,y*SC,ww*SC,hh*SC,11*SC), 0.8, seed, { c:CLL, w:w||2.6 });
}
function roundS(cx,cy,rx,ry,seed,w){
  addShape('stroke', ellPts(cx*SC,cy*SC,rx*SC,ry*SC,30), 0.8, seed, { c:CLL, w:w||2.6 });
}
function arcS(cx,cy,rx,ry,a0,a1,seed,w){
  addShape('stroke', arcPts(cx*SC,cy*SC,rx*SC,ry*SC,a0,a1,22), 0.8, seed, { c:CLL, w:w||2.6 });
}
/* ---------- 篮球场 ---------- */
function basketballArt(x,y,w,h,seed){
  var cx=x+w*0.5, cy=y+h*0.5;
  var inX=x+5, inY=y+5, inW=w-10, inH=h-10;
  rectS(inX,inY,inW,inH,seed,3.0);
  lineS(cx,inY,cx,inY+inH,seed+1,3.0);                       // 中线
  roundS(cx,cy,15,15,seed+2,2.8);                            // 中圈
  var laneW=34, laneH=44;
  for(var e=0;e<2;e++){
    var top = (e===0);
    var ly = top ? inY : inY+inH-laneH;
    rectS(cx-laneW*0.5, ly, laneW, laneH, seed+3+e*10, 2.8);   // 罚球区
    roundS(cx, top ? ly+laneH : ly, 12, 12, seed+5+e*10, 2.4); // 罚球圈
    /* 三分弧：以篮筐为圆心 */
    var hoopY = top ? inY+3 : inY+inH-3;
    var a0 = top ? 0 : Math.PI;
    arcS(cx, hoopY, 42, 34, top?0:Math.PI, top?Math.PI:TAU, seed+7+e*10, 2.6);
    /* 篮筐 + 篮板 */
    addShape('stroke', [[(cx-7)*SC,hoopY*SC],[(cx+7)*SC,hoopY*SC]], 0.6, seed+9+e*10, { c:'rgba(230,120,90,0.9)', w:4.0 });
    roundS(cx, top ? hoopY+6 : hoopY-6, 4.5, 4.5, seed+11+e*10, 2.2);
  }
}
/* ---------- 羽毛球场（并排 n 块） ---------- */
function badmintonArt(x,y,w,h,n,seed){
  var cw=w/n;
  for(var c=0;c<n;c++){
    var x0=x+c*cw+3, y0=y+3, w0=cw-6, h0=h-6;
    var mx=x0+w0*0.5;
    rectS(x0,y0,w0,h0,seed+c*20,2.6);
    lineS(mx,y0,mx,y0+h0,seed+c*20+1,2.2);                    // 中线
    var netY=y0+h0*0.5;
    lineS(x0,netY,x0+w0,netY,seed+c*20+2,3.0);                // 球网
    lineS(x0,y0+h0*0.16,x0+w0,y0+h0*0.16,seed+c*20+3,1.8);    // 前发球线
    lineS(x0,y0+h0*0.84,x0+w0,y0+h0*0.84,seed+c*20+4,1.8);
    /* 双打边线（内收一点） */
    addShape('stroke', rectPts((x0+3)*SC,(y0+2)*SC,(w0-6)*SC,(h0-4)*SC,11*SC), 0.8, seed+c*20+5, { c:CLL2, w:1.6 });
  }
}
/* ---------- 田径场：内场 + 分道线 ---------- */
function fieldArt(x,y,w,h,seed){
  var cx=x+w*0.5, cy=y+h*0.5;
  /* 六条跑道，从内场往外扩，每条 7 个单位 */
  for(var L=0;L<6;L++){
    var k=(L+1)*7;
    addShape('stroke', rectPts((x-k)*SC,(y-k)*SC,(w+2*k)*SC,(h+2*k)*SC,13*SC), 0.8, seed+L,
             { c: L%2 ? CLL2 : CLL, w:2.2 });
  }
  addShape('stroke', rectPts((x-46)*SC,(y-46)*SC,(w+92)*SC,(h+92)*SC,13*SC), 0.8, seed+8,
           { c:'rgba(242,238,226,0.85)', w:3.2 });                    // 跑道外沿
  /* 内场：足球场 */
  rectS(x+8, y+18, w-16, h-36, seed+10, 2.6);
  lineS(x+8, cy, x+w-8, cy, seed+11, 2.4);                            // 中场线
  roundS(cx, cy, 20, 20, seed+12, 2.4);                               // 中圈
  /* 两端球门区 + 罚球区 */
  var gw=36, gh=14, pw=62, ph=26;
  rectS(cx-gw*0.5, y+18, gw, gh, seed+13, 2.4);
  rectS(cx-pw*0.5, y+18, pw, ph, seed+14, 2.4);
  rectS(cx-gw*0.5, y+h-18-gh, gw, gh, seed+15, 2.4);
  rectS(cx-pw*0.5, y+h-18-ph, pw, ph, seed+16, 2.4);
  roundS(cx, y+18+ph-9, 3, 3, seed+17, 2.0);
  roundS(cx, y+h-18-ph+9, 3, 3, seed+18, 2.0);
  /* 球门 */
  addShape('stroke', [[(cx-gw*0.5)*SC,(y+18)*SC],[(cx+gw*0.5)*SC,(y+18)*SC]], 0.6, seed+19, { c:'rgba(230,120,90,0.9)', w:4.4 });
  addShape('stroke', [[(cx-gw*0.5)*SC,(y+h-18)*SC],[(cx+gw*0.5)*SC,(y+h-18)*SC]], 0.6, seed+20, { c:'rgba(230,120,90,0.9)', w:4.4 });
}

}

function isSolidPt(wx,wy){

}
function buildLevel(){
  var b=levelBounds(), minX=b[0], minY=b[1], maxX=b[2], maxY=b[3];
  var lk=S.mode+'|'+(S.room||'')+'|'+(BW?1:0);
  if (OCC.key!==lk){
    var cell=OCC.cell;
    OCC.x0=minX; OCC.y0=minY;
    OCC.gw=Math.max(1,Math.ceil((maxX-minX)/cell));
    OCC.gh=Math.max(1,Math.ceil((maxY-minY)/cell));
    OCC.data=new Uint8Array(OCC.gw*OCC.gh);
    for(var gy=0;gy<OCC.gh;gy++) for(var gx=0;gx<OCC.gw;gx++){
      OCC.data[gy*OCC.gw+gx] = isSolidPt(minX+(gx+0.5)*cell, minY+(gy+0.5)*cell) ? 1 : 0;
    }
    OCC.key=lk;
  }

    try{ BASE.cv.width=w; BASE.cv.height=h; }catch(e){ BASE.key=lk; return; }
    BASE.x=minX; BASE.y=minY; BASE.w=w; BASE.h=h;
    var cx=BASE.cx, ob=boil; boil=0;
    cx.setTransform(1,0,0,1,-minX,-minY);
    cx.lineCap='round'; cx.lineJoin='round';
    cx.clearRect(minX,minY,w,h);

function occIdx(gx,gy){ if(gx<0||gy<0||gx>=OCC.gw||gy>=OCC.gh) return 1; return OCC.data[gy*OCC.gw+gx]; }
function castRay(x,y,ang,maxD){
  var dx=Math.cos(ang), dy=Math.sin(ang), cell=OCC.cell;
  var gx=Math.floor((x-OCC.x0)/cell), gy=Math.floor((y-OCC.y0)/cell);
  var sx=dx>0?1:-1, sy=dy>0?1:-1;
  var tmx = dx!==0 ? ((OCC.x0+(gx+(dx>0?1:0))*cell)-x)/dx : 1e9;
  var tmy = dy!==0 ? ((OCC.y0+(gy+(dy>0?1:0))*cell)-y)/dy : 1e9;
  var tdx = dx!==0 ? Math.abs(cell/dx) : 1e9;
  var tdy = dy!==0 ? Math.abs(cell/dy) : 1e9;
  var t=0, guard=0;
  while (guard++ < 512){
    if (tmx < tmy){ t=tmx; gx+=sx; tmx+=tdx; } else { t=tmy; gy+=sy; tmy+=tdy; }
    if (t > maxD) return maxD;
    if (t >= 0 && occIdx(gx,gy)) return t;
  }
  return maxD;
}
/* 自适应画质：低端机自动降射线数 / 羽化 / 粒子 / 分辨率。不插帧、不堆后处理。 */
var Q={ level:2, ft:16.7, slow:0, fast:0, rays:200, feather:true, parts:1, dprCap:2, fpCols:240 };
function qApply(){
  if (Q.level>=2){ Q.rays=200; Q.feather=true;  Q.parts=1;    Q.dprCap=2;   Q.fpCols=240; }
  else if (Q.level===1){ Q.rays=112; Q.feather=true;  Q.parts=0.6;  Q.dprCap=1.5; Q.fpCols=150; }
  else { Q.rays=64; Q.feather=false; Q.parts=0.35; Q.dprCap=1.25; Q.fpCols=96; }
  VIS.n=Q.rays;
}
function qSample(dt){

  if (Q.ft>23){ Q.slow++; Q.fast=0; } else if (Q.ft<15){ Q.fast++; Q.slow=0; } else { Q.slow=0; Q.fast=0; }
  if (Q.slow>90 && Q.level>0){ Q.level--; qApply(); resize(); Q.slow=0; toast('画质自动降到 '+Q.level); }
  else if (Q.fast>600 && Q.level<2){ Q.level++; qApply(); resize(); Q.fast=0; }
}

function bridgeTarget(room,ch){
  /* 楼层从房间 id 里取，1–4 层都有连廊，对应关系一样 */
  var mt=/^(teach|lab|admin)(\d+)$/.exec(room);
  if (!mt) return null;
  var host=mt[1], f2=mt[2];
  var tgt=null, arr=null;
  if (host==='admin' && ch==='M'){ tgt='lab'+f2;   arr='M'; }   // 行政楼南 → 实验楼北
  else if (host==='lab' && ch==='M'){ tgt='admin'+f2; arr='M'; } // 实验楼北 → 行政楼南
  else if (host==='lab' && ch==='L'){ tgt='teach'+f2; arr='L'; } // 实验楼南 → 教学楼北
  else if (host==='teach' && ch==='L'){ tgt='lab'+f2;   arr='L'; } // 教学楼北 → 实验楼南
  if (!tgt) return null;
  if (!INTERIORS[tgt]) return null;                              // 目标层不存在就别放行
  return { room:tgt, arrive:arr };
  return null;
}
/* 找连廊口那一段的中间一格：3 格宽的走廊要从正中间过去，贴边会撞墙 */
function findTileRun(room,ch){
  var R=INTERIORS[room]; if(!R) return null;
  for(var y=0;y<R.rows;y++){
    var row=R.grid[y]||''; var x=row.indexOf(ch);
    if (x<0) continue;
    var x2=x; while(x2+1<R.cols && row.charAt(x2+1)===ch) x2++;
    return [Math.floor((x+x2)/2), y];
  }
  return null;
}
function findTileIn(room,ch){
  var R=INTERIORS[room];
  for(var y=0;y<R.rows;y++){ var x=R.grid[y].indexOf(ch); if(x>=0) return [x,y]; }
  return null;
}
function crossBridge(ch){
  var t=bridgeTarget(S.room,ch);
  if (!t){ toast('这条连廊走不通。'); return; }
  SFX.door(); go('fade',0.5,function(){
    buildInterior(t.room);
    var R=INTERIORS[t.room], p=findTileRun(t.room,t.arrive) || findTileIn(t.room,t.arrive);
    S.room=t.room;
    var c=p?tileCenter(R,R.ox+(p[0]+0.5)*R.tw,R.oy+(p[1]+0.5)*R.th):[R.ox+R.w/2,R.oy+R.h/2];
    S.x=c[0]; S.y=c[1]; S.enterCool=1.4; dropCache(); describe(t.room);
    toast('你走过连廊，进了 '+R.name);

}

function dayNo(){ return S.day||1; }
/* 第一天不致命：改成重掉 SAN + 一句台词 */
function anKill(msg){
  if (isDay1()){ S.san=Math.max(0,S.san-26); anEnd();
    os('我：刚才那一下……我差点没喘上来。',4.4); return; }
  kill(msg);
}
var AN={ cur:null, t:0, next:12, rainT:0, eye:0, freeze:0, moth:0, rained:0,
         bell:0, bellTick:0, ex:0, bells:0, chalk:0, chalkT:0, hand:0, asked:0, spot:[], spotT:0,
         eat:0, ne:0, loop:0, loopT:0, loopInv:0, leak:0, spots:[], leakT:0, roster:0, shadow:0,
         rite:0, riteX:0, riteY:0, riteT:0, cold:0, shift:0 };
var AN_ID=['rain','moth','turn','broad','bell13','exercise','bells','hand','repeat','chalk',
           'feast','necker','loop','leak','roster','shadow','rite','cold','raindots','shifting'];
var AN_SMALL={ turn:1, broad:1, bell13:1, hand:1, repeat:1, chalk:1, loop:1, roster:1, leak:1, rite:1, cold:1, shifting:1 };
var AN_BIG={ rain:1, moth:1, exercise:1, bells:1, feast:1, necker:1, shadow:1, raindots:1 };
var AN_DAY1={ rain:1, moth:1, shifting:1, raindots:1, cold:1, chalk:1, repeat:1 };
/* 几个常用的位置判断：异象必须发生在说得通的地方 */
function nearXY(vx,vy,rad){ var dx=S.x-vx*SC, dy=S.y-vy*SC; return dx*dx+dy*dy < (rad*SC)*(rad*SC); }
function onField(){ return nearXY(515,530,175); }        // 大操场 + 边上
function onCourt(){ return nearXY(500,300,120) || nearXY(500,700,130); }
function onTrack(){ return nearXY(500,827,120); }
function inCorridor(){                                  // 教学楼的走廊（不是教室）
  if (S.mode!=='in'||!S.room||S.room.indexOf('teach')!==0) return false;
  var R=INTERIORS[S.room]; if(!R) return false;
  var ty=Math.floor((S.y-R.oy)/R.th);
  return ty>=16 && ty<=20;
}
/* "人在教室里"：不光要落在某个班的横向范围里，还要真的在教室那一排，
   不能是走廊（走廊的横向坐标也会落进某个班的列）。 */
function inClassroomHere(){
  if (S.mode!=='in' || inClassroom()<0) return false;
  var R=INTERIORS[S.room]; if(!R) return false;
  var ty=Math.floor((S.y-R.oy)/R.th);
  return ty>=1 && ty<=15;
}
function pickAnomaly(){
  if (DEV.on && DEV.noAnomaly) return null;
  if (isDay1() && !DEV.allAn){
    if (S.mode==='out') return Math.random()<0.5 ? 'rain' : 'shifting';
    return Math.random()<0.5 ? 'chalk' : 'repeat';
  }
  var inClass=(needWhere(S.tsec)==='教室');
  var pool=[], i, id;
  for(i=0;i<AN_ID.length;i++){
    id=AN_ID[i];
    /* ---- 地点判定：每一条都要在"会发生这件事"的地方才允许出现 ---- */
    if (id==='turn'){                                      // 被拍肩膀：得有人在你后面
      if (!inClassroomHere()) continue;
    }
    if (id==='broad'){                                     // 广播点名：室内听得清
      if (S.mode!=='in') continue;
    }
    if (id==='bell13'){                                    // 钟声：得赶得回座位，教学楼里
      if (S.mode!=='in') continue;
      if (!(S.room.indexOf('teach')===0 || S.room.indexOf('dorm')===0)) continue;
    }
    if (id==='hand'){                                      // 隔间递物：必须在隔间里
      if (!(S.mode==='in'&&tileAt(INTERIORS[S.room],S.x,S.y)==='B')) continue;
    }
    if (id==='chalk'||id==='roster'){                      // 黑板 / 点名册：教室里
      if (!inClassroomHere()) continue;
    }
    if (id==='repeat'){                                    // 后桌问话：你得在座位上或课桌旁
      if (!inClassroomHere()) continue;
    }
    if (id==='moth' && !AN.rained) continue;               // 蛾群要等雨
    if (id==='exercise'){                                  // 操场做操：你就在操场附近
      if (S.mode!=='out' || !(onField()||onTrack()||onCourt())) continue;
    }
    if (id==='bells'){                                     // 车棚齐鸣：你在车棚附近
      if (S.mode!=='out' || !nearXY(880,440,180)) continue;
    }
    if (id==='rain' && S.mode==='in' && inClass) continue;
    if (id==='feast'){ if (!(S.mode==='in'&&S.room==='canteen1')) continue; }
    if (id==='necker'){                                    // 围墙外的行人：你得看得到围墙
      if (S.mode!=='out' || S.x < 640*SC) continue;
    }
    if (id==='loop'){                                      // 无尽走廊：走廊里
      if (!inCorridor()) continue;
    }
    if (id==='shadow'){                                    // 影子不同步：开阔的室外
      if (S.mode!=='out') continue;
    }
    if (id==='leak'){ if (S.mode!=='in') continue; }
    if (id==='rite'){ if (!(S.mode==='in'&&S.room&&S.room.indexOf('lab')===0)) continue; }
    if (id==='cold'){ if (!(S.mode==='in'&&S.room==='canteen1')) continue; }
    if (id==='shifting'){                                  // 窗外的楼在动：得站在有窗的教室里
      if (!inClassroomHere()) continue;
    }
    if (id==='raindots'){ if (!AN.rained) continue; }
    pool.push(id);
  }
  var want = inClass ? AN_SMALL : (needWhere(S.tsec)==='自由' ? AN_BIG : null);
  if (want){
    var pref=[];
    for(i=0;i<pool.length;i++) if (want[pool[i]]) pref.push(pool[i]);
    if (pref.length && Math.random()<0.8) pool=pref;
  }
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}
function anStart(){
  var id=pickAnomaly(); if(!id) return;
  AN.cur=id; AN.t=0; AN.asked=0;
  if (id==='rain'){ AN.rainT=900; SFX.rainOn(); AN.rained=1; os('我：天怎么一下就黑了……这雨不对劲。',4.6); }
  else if (id==='moth'){ AN.moth=12; AN.rained=0; os('我：墙上在掉粉。是蛾子。',4.6); }
  else if (id==='turn'){ AN.eye=0; AN.stage=0; AN.stageT=0; AN.look=0;
    os('我：有人拍我肩膀。',3.0); }
  else if (id==='broad'){ AN.freeze=4; os('我：广播在念名单……念到我们班了。',4.6);
    setTimeout(function(){ if(AN.cur==='broad') os('我：念到谁，谁就得应一声。我可不想应。',4.6); },2600); }
  else if (id==='bell13'){ AN.bell=13; AN.bellTick=0.7; SFX.bell(); os('我：钟楼在敲。有人在数。',4.4); }
  else if (id==='exercise'){ AN.ex=22; os('我：操场上站着人。他们在做操——背对着我。',5.2);
    setTimeout(function(){ if(AN.cur==='exercise') os('我：他们做的是同一个动作。一个都不差。',4.6); },2600); }
  else if (id==='bells'){ AN.bells=18; os('我：车棚里所有的铃一起响了。',4.6);
    setTimeout(function(){ if(AN.cur==='bells') os('我：那些车都锁着。没人碰它们。',4.2); },3000); }
  else if (id==='chalk'){ AN.chalk=16; AN.chalkT=Math.floor(S.tsec+180); os('我：黑板上有字。刚才还没有。',4.6); }
  else if (id==='hand'){ AN.hand=12; os('我：隔间底下伸过来一只手。',4.2); }
  else if (id==='repeat'){ os('我：后排那个同学又在说同一句话。',4.2); }
  else if (id==='feast'){ AN.eat=0; os('我：食堂灯全亮了……还有一股香味。好香啊……',5.0); }
  else if (id==='necker'){ AN.ne=18; os('我：围墙外面站着一个人。他背对着我。',5.0); }
  else if (id==='loop'){ AN.loop=14; AN.loopT=1.6; AN.loopInv=0; os('我：这条走廊……我好像走过一遍了。',4.6); }
  else if (id==='leak'){ AN.leak=16; AN.leakT=0; AN.spots=[];
    for (var si2=0;si2<5;si2++) AN.spots.push([S.x+(Math.random()-0.5)*150, S.y+(Math.random()-0.5)*150]);
    os('我：天花板开始滴水了。',4.2); }
  else if (id==='roster'){ AN.roster=20; os('我：墙上那张点名册……我的名字被红笔划掉了。',5.4);
    setTimeout(function(){ if(AN.cur==='roster') os('我：讲台上有一支红笔。它在看我。',4.2); },3000); }
  else if (id==='shadow'){ AN.shadow=0; os('我：我的影子慢了一拍。',4.4); }
  else if (id==='rite'){ AN.rite=22; AN.riteT=0;
    setTimeout(function(){ if(AN.cur==='rite') os('我：蜡烛是自己点着的。',3.8); },3200);
    var LR=INTERIORS[S.room]; AN.riteX=LR.ox+LR.w*0.34; AN.riteY=LR.oy+LR.h*0.40;
    os('我：这间教室的桌子被摆成了一个圈。中间有蜡烛。',5.6); }
  else if (id==='cold'){ AN.cold=26; AN.coldT=0; AN.stage=0; AN.stageT=0; AN.peer=0;
    os('我：冷库的门开着。里面挂着东西。',4.4);
    setTimeout(function(){ if(AN.cur==='cold'){ S.san-=9; os('我：一排一排的，从天花板垂下来。白气从它们中间往外冒。',5.4); } },3000);
    setTimeout(function(){ if(AN.cur==='cold'){ S.san-=9; os('我：我的手在抖。我不太想走进去。',4.6); } },6200); }
  else if (id==='shifting'){ AN.shift=18; os('我：窗户外面……楼在动。',4.6);
    setTimeout(function(){ if(AN.cur==='shifting') os('我：钟楼没动。只有钟楼没动。',4.4); },3400); }
  else if (id==='raindots'){ os('我：雨点落在地上，排成字了。',4.6); }
}
function anEnd(){
  if (AN.cur==='rain') SFX.rainOff();
  AN.cur=null; AN.t=0; AN.asked=0;
  /* 间隔从 14–28 秒压到 7–15 秒：原来的节奏太稀，一节课可能什么都碰不到 */
  AN.next=(7+Math.random()*8)*(1+S.viol/110)*(1+(100-S.san)/200)*dif().iv;
}
function anUpdate(dt){
  if (S.dead||S.death) return;
  var SD=dif().san;
  AN.t+=dt;
  if (!AN.cur){ AN.next -= dt*rateAt(S.tsec)/60; if (AN.next<=0) anStart(); return; }   // 首次等待
  var a=AN.cur, i;
  if (a==='rain'){ AN.rainT-=dt*rateAt(S.tsec);
    if (!sheltered()) S.wetAcc+=dt; else S.wetAcc=Math.max(0,S.wetAcc-dt*0.6);
    S.san-=dt*SD*0.9;
    if (S.wetAcc>6) anKill('你在雨里窒息了。');
    if (AN.rainT<=0){ anEnd(); os('我：雨小了。',3.0); } }
  else if (a==='moth'){ AN.moth-=dt*rateAt(S.tsec)/8;
    if (!sheltered()){ S.san-=dt*SD*2.2; if (AN.t>7) anKill('蛾子把你裹住了。'); } else S.san-=dt*SD*0.35;
    if (AN.moth<=0) anEnd(); }
  else if (a==='turn'){
    AN.stageT+=dt;
    if (AN.stage===0){
      if (AN.stageT>1.5){ AN.stage=1; AN.stageT=0;
        ask('有人在我背后拍了一下。', ['回头看','不回头'], function(k){
          if (k===0){ AN.look=1; AN.stage=2; AN.stageT=0;
            os('我：没有人。',2.6); S.san-=12;
            setTimeout(function(){ if(AN.cur==='turn') os('我：……可是刚才那一下，是真的。',3.6); },2200);
          } else { AN.look=0; AN.stage=4; AN.stageT=0;
            os('我：不看。',2.4);
            setTimeout(function(){ if(AN.cur==='turn') os('我：拍得更急了。',3.0); },2400);
          }
        });
      }
    }
    /* 回头了：什么也没有，但越看越冷，最后被"看"死 */
    else if (AN.stage===2){
      S.san-=dt*SD*2.6;
      if (AN.stageT>3.4){ AN.stage=3; AN.stageT=0;
        os('我：后面还是空的。可是我能感觉到有什么在往前挪。',4.6); }
    } else if (AN.stage===3){
      S.san-=dt*SD*4.5;
      if (AN.stageT>4.5) anKill('你一直回头看着那个方向，直到有什么终于对上了你的视线。');
    }
    /* 不回头：硬扛，越拍越急，扛过去就赢了 */
    else if (AN.stage===4){
      S.san-=dt*SD*1.1;
      if (AN.stageT>3.2){ AN.stage=5; AN.stageT=0;
        os('我：肩膀被拍得往前一沉。有一口气吹在后颈上。',4.4); }
    } else if (AN.stage===5){
      S.san-=dt*SD*2.0;
      AN.shake=(AN.shake||0)+dt;
      if (AN.stageT>2.6){ AN.stage=6; AN.stageT=0;
        os('我：不看。不看。不看。',3.0); }
    } else if (AN.stage===6){
      S.san-=dt*SD*1.4;
      if (AN.stageT>2.0){ anEnd(); S.san=Math.min(100,S.san+6);
        os('我：拍打停了。教室里很安静，安静得不像话。',4.6);
        RT.clue=(RT.clue||0)+1; }
    }
  }
  else if (a==='broad'){ AN.freeze-=dt;
    if (S.moving) S.frzAcc+=dt; else S.frzAcc=Math.max(0,S.frzAcc-dt);
    if (S.frzAcc>1.6) anKill('广播念到了你的名字。');
    if (AN.freeze<=0){ anEnd(); os('我：广播停了。',2.8); } }
  else if (a==='bell13'){
    AN.bellTick-=dt;
    if (AN.bellTick<=0){ AN.bellTick=1.15; AN.bell--; SFX.bell();
      if (AN.bell<=0){
        var seated = S.seated && S.mode==='in' && tileAt(INTERIORS[S.room],S.x,S.y)==='P';
        var inDorm = S.mode==='in' && S.room && S.room.indexOf('dorm')===0;
        if (seated||inDorm){ anEnd(); os('我：第十三下。我在座位上。',4.0); }
        else anKill('钟敲到第十三下时，你不在位子上。');
      } }
    S.san-=dt*SD*0.22; }
  else if (a==='exercise'){ AN.ex-=dt; S.san-=dt*SD*0.35;
    if (S.mode==='out'){
      var dx=S.x-515*SC, dy=S.y-530*SC;
      if (dx*dx+dy*dy < (170*SC)*(170*SC)){ S.exAcc=(S.exAcc||0)+dt; S.san-=dt*SD*1.6;
        if (S.exAcc>2.2) anKill('你做操的动作跟上了他们。'); }
      else S.exAcc=Math.max(0,(S.exAcc||0)-dt*0.8); }
    if (AN.ex<=0){ anEnd(); S.exAcc=0; } }
  else if (a==='bells'){ AN.bells-=dt; S.san-=dt*SD*0.3;
    if (S.mode==='out'){
      var bx=S.x-880*SC, by=S.y-440*SC;
      if (bx*bx+by*by < (110*SC)*(110*SC)){ S.blAcc=(S.blAcc||0)+dt; S.san-=dt*SD*1.9;
        if (S.blAcc>2.0) anKill('车棚的铃声把你震散了。'); }
      else S.blAcc=Math.max(0,(S.blAcc||0)-dt*0.8); }
    if (AN.bells<=0){ anEnd(); S.blAcc=0; } }
  else if (a==='chalk'){ AN.chalk-=dt; S.san-=dt*SD*0.25;
    if (AN.chalk<=0) anEnd(); }
  else if (a==='hand'){ AN.hand-=dt;
    if (!AN.asked && AN.t>1.2){ AN.asked=1;
      ask('隔间底下伸过来一只手。手心里有东西。',['接过来','不动'],function(k){
        if (k===0){ anKill('你接了隔间里递过来的东西。'); }
        else { anEnd(); os('我：手缩回去了。我听见隔壁有人叹了口气。',4.6); RT.clue=(RT.clue||0)+1; }
      }); }
    if (AN.hand<=0 && AN.cur==='hand') anEnd(); }
  else if (a==='repeat'){
    if (!AN.asked && AN.t>1.0){ AN.asked=1;
      ask('后排的人一直问你：「你作业交了吗」',['回答他','不出声'],function(k){
        if (k===1){ anEnd(); os('我：他停下来了。他看了我一眼，像在确认什么。',5.0); RT.clue=(RT.clue||0)+1; }
        else { S.san-=18; anEnd(); os('我：他笑了。整排人都跟着笑了。',4.6); }
      }); }
    if (AN.t>18 && AN.cur==='repeat') anEnd(); }
  else if (a==='feast'){
    if (S.mode==='in'&&S.room==='canteen1'){ AN.eat+=dt; S.san-=dt*SD*0.9;
      if (AN.eat>9) anKill('你把那盘饭吃了。'); }
    else AN.eat=Math.max(0,AN.eat-dt*0.5);
    if (AN.t>26) anEnd(); }
  else if (a==='necker'){ AN.ne-=dt; S.san-=dt*SD*0.25;
    var nx2=706*SC+40, ny2=900*SC;
    var ndx=S.x-nx2, ndy=S.y-ny2, nd2=ndx*ndx+ndy*ndy;
    if (nd2 < (150*SC)*(150*SC)){ S.san-=dt*SD*1.4;
      if (nd2 < (90*SC)*(90*SC)){ AN.neAcc=(AN.neAcc||0)+dt; if (AN.neAcc>1.6) anKill('围墙外那张脸转了过来。'); } }
    if (AN.ne<=0){ anEnd(); os('我：他走了。没留下脚印。',4.0); } }
  else if (a==='loop'){ AN.loop-=dt;
    if (K[' ']||K['shift']){ AN.loopInv=0; }
    else { AN.loopT-=dt; if (AN.loopT<=0){ AN.loopInv=1-AN.loopInv; AN.loopT=AN.loopInv?1.6:2.6; } }
    S.san-=dt*SD*0.3;
    if (AN.loop<=0){ AN.loopInv=0; anEnd(); os('我：走廊到头了。',3.0); } }
  else if (a==='leak'){ AN.leak-=dt; S.san-=dt*SD*0.35;
    var onWet=false;
    for (var li2=0;li2<AN.spots.length;li2++){ var sp=AN.spots[li2];
      var ldx=S.x-sp[0], ldy=S.y-sp[1];
      if (ldx*ldx+ldy*ldy < 22*22){ onWet=true; break; } }
    if (onWet){ AN.leakT+=dt; if (AN.leakT>1.5) anKill('水从天花板渗下来，浇在你身上。'); } else AN.leakT=Math.max(0,AN.leakT-dt);
    if (AN.leak<=0){ anEnd(); AN.spots=[]; } }
  else if (a==='roster'){ AN.roster-=dt; S.san-=dt*SD*0.3;
    if (tileAt(INTERIORS[S.room],S.x,S.y)==='T'){ anEnd(); S.viol=Math.max(0,S.viol-20);
      os('我：我在讲台上找到一支红笔。我把自己补回去了。',5.4); RT.clue=(RT.clue||0)+1; }
    else if (AN.roster<=0){ anEnd(); S.viol=Math.min(100,S.viol+30); os('我：名字没了。',3.4); } }
  else if (a==='shadow'){
    if (S.mode==='out'){ AN.shadow+=dt; S.san-=dt*SD*1.1; if (AN.shadow>10) anKill('你的影子终于追上了你。'); }
    else AN.shadow=Math.max(0,AN.shadow-dt*0.6);
    if (AN.t>18) anEnd(); }
  else if (a==='rite'){ AN.rite-=dt; S.san-=dt*SD*0.45;
    var rdx=S.x-AN.riteX, rdy=S.y-AN.riteY, rd2=rdx*rdx+rdy*rdy;
    if (rd2 < 30*30){ AN.riteT+=dt; S.san-=dt*SD*2.0; if (AN.riteT>2.0) anKill('你踩进了那个圈里。'); }

  else if (a==='cold'){
    AN.cold-=dt; AN.stageT+=dt;

    /* 玩家自己走过去才推进剧情 —— 不走近就一直是"不知道那是什么"的恐惧 */
    var cR=INTERIORS[S.room];
    var inStore = (S.mode==='in' && S.room==='canteen1' && cR &&
                   tileAt(cR,S.x,S.y)!==undefined && S.x > cR.ox + cR.w*0.80);
    if (AN.stage===0 && inStore){ AN.stage=1; AN.stageT=0;
      os('我：我进来了。冷气钻进袖子里。',4.0); }
    if (AN.stage===1 && AN.stageT>2.0){
      AN.stage=2;
      ask('它们离我只有两步远。', ['再走近一点','转身就走'], function(k){
        if (k===0){
          AN.peer=1; AN.stage=3; AN.stageT=0;
          os('我：……是校服。',3.0);
          setTimeout(function(){ if(AN.cur==='cold'){
            S.san=Math.min(100,S.san+16);
            os('我：冻硬的校服。谁把它们一件件挂成这个样子的。',5.4);
            os('我：我笑出声了。我说不清是松了一口气，还是别的什么。',5.0);
          } },2400);

/* 死亡分两段：
   ① DEADSEQ 阶段 —— 画面慢慢沉进黑里，还能看见最后一眼
   ② 黑透了才 showDead()，这时才出死亡界面 */
var DEADSEQ={ t:0, dur:2.6, done:false, msg:'' };
function kill(msg){
  flashForceEnd();
  if (S.dead||S.death) return;
  if (DEV.on&&DEV.inv) return;
  S.dead=msg; S.deadT=0;
  DEADSEQ.t=0; DEADSEQ.done=false; DEADSEQ.msg=msg;
  SFX.blink();
}
function deadSeqTick(dt){
  if (!S.dead || S.death) return;
  if (DEADSEQ.done) return;
  DEADSEQ.t += dt;
  S.deadT = DEADSEQ.t;
  if (DEADSEQ.t >= DEADSEQ.dur){ DEADSEQ.done=true; showDead(); }
}
function killViol(){
  if (S.dead||S.death) return;
  if (DEV.on&&DEV.inv) return;
  if (Math.random()<0.5){ kill('违规太多，有人在暗处把你按住了。'); return; }   // 暴毙：无动画
  S.death={ kind:'floor', t:0 };
  SHAKE.t=0; SHAKE.mag=0;
  SFX.crack();
}
function deathUpdate(dt){
  if (!S.death) return;
  var d=S.death; d.t+=dt;
  if (d.kind==='floor'){
    if (d.t>0.30 && d.t<1.35){ SHAKE.mag=Math.min(6, (d.t-0.30)*5); SHAKE.t+=dt; }
    if (d.t>1.9){ S.dead='地板合上了。'; S.death=null; SFX.blink();
      DEADSEQ.t=1.2; DEADSEQ.done=false; DEADSEQ.msg=S.dead; S.deadT=1.2; }   // 动画已经播过一半，接上后半段
  } else {
    if (Math.abs(d.t-0.72)<0.06){ SHAKE.mag=16; }
    if (d.t>1.5){ S.dead='墙把你压在了下面。'; S.death=null; SFX.blink();
      DEADSEQ.t=1.2; DEADSEQ.done=false; DEADSEQ.msg=S.dead; S.deadT=1.2; }
  }
  SHAKE.mag*=0.90; SHAKE.t+=dt;
}
function drawDeath(){
  if (!S.death) return;
  var d=S.death, t=d.t, ctx=C;
  ctx.setTransform(1,0,0,1,0,0);
  if (d.kind==='floor'){
    var open = t<0.30 ? smooth(t/0.30) : (t<1.35?1:(t<1.9?smooth(1-(t-1.35)/0.55):0));
    var px=(S.x-cam.x)*cam.z*DPR+MW/2, py=(S.y-cam.y)*cam.z*DPR+MH/2;
    var rr=6*DPR+open*96*DPR;
    var g=ctx.createRadialGradient(px,py,0,px,py,rr);
    g.addColorStop(0,'rgba(0,0,0,'+(0.9*open)+')');
    g.addColorStop(0.72,'rgba(10,6,4,'+(0.92*open)+')');
    g.addColorStop(1,'rgba(10,6,4,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(px,py,rr,rr*0.62,0,0,TAU); ctx.fill();
    // 裂口边缘
    ctx.strokeStyle='rgba(0,0,0,'+(0.85*open)+')'; ctx.lineWidth=3*DPR;
    for(var i=0;i<12;i++){
      var a=i/12*TAU+hash2(i,1,9)*0.4, L=rr*(0.9+hash2(i,2,9)*0.5);
      ctx.beginPath(); ctx.moveTo(px+Math.cos(a)*rr*0.7, py+Math.sin(a)*rr*0.45);
      ctx.lineTo(px+Math.cos(a)*L, py+Math.sin(a)*L*0.66); ctx.stroke();
    }
  } else {
    var px2=(S.x-cam.x)*cam.z*DPR+MW/2, py2=(S.y-cam.y)*cam.z*DPR+MH/2;
    var p = t<0.35 ? 0 : (t<0.72 ? smooth((t-0.35)/0.37) : 1);
    var sx = px2 + (1-p)*260*DPR - (t>0.72?0:0);
    if (t<0.72){
      ctx.save(); ctx.translate(sx, py2-40*DPR); ctx.rotate(-0.22+p*0.22);
      ctx.fillStyle='rgba(28,26,24,0.96)';
      ctx.fillRect(-150*DPR,-70*DPR,300*DPR,140*DPR);
      ctx.strokeStyle='rgba(120,110,96,0.7)'; ctx.lineWidth=2*DPR;
      ctx.strokeRect(-150*DPR,-70*DPR,300*DPR,140*DPR);
      ctx.restore();
    }
    if (t>=0.72){
      var k=clamp((t-0.72)/0.5,0,1);
      ctx.fillStyle='rgba(0,0,0,'+(0.45*k)+')'; ctx.fillRect(0,0,MW,MH);
      ctx.fillStyle='rgba(150,20,16,'+(0.72*k)+')';
      ctx.beginPath(); ctx.ellipse(px2,py2, 20*DPR+k*70*DPR, 14*DPR+k*50*DPR, 0.4, 0, TAU); ctx.fill();
      ctx.strokeStyle='rgba(220,40,30,'+(0.5*k)+')'; ctx.lineWidth=3*DPR;
      for(var j=0;j<10;j++){ var a2=hash2(j,4,3)*TAU, L2=(30+hash2(j,5,3)*90)*DPR*k;
        ctx.beginPath(); ctx.moveTo(px2,py2); ctx.lineTo(px2+Math.cos(a2)*L2, py2+Math.sin(a2)*L2); ctx.stroke(); }
    }
  }
}

/* ============================ DOM 按钮绑定 ============================ */
/* 坑：canvas 的 pointerdown 里调了 preventDefault()，某些浏览器会连 click 一起吞掉，
   所以 DOM 按钮统一走 pointerdown，并阻止冒泡。 */
function bindBtn(el, fn){
  if (!el) return;
  var fired=0;
  var run=function(e){
    if (e && e.stopPropagation) e.stopPropagation();
    if (e && e.preventDefault) e.preventDefault();
    var now = (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
    if (now-fired < 260) return;      // 防 pointerdown + click 各触发一次
    fired=now;
    try{ fn(e); }catch(err){}
  };
  el.addEventListener('pointerdown', run, {passive:false});
  el.addEventListener('click', run);
  el.style.pointerEvents='auto';
}

    if (e && e.stopPropagation) e.stopPropagation();
    var now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
    if (now-last>900) taps=0;
    last=now; taps++;

})();

try {

    document.body.classList.add('touch'); TOUCH.on=true;
  }

function bindTouch(){
  var cv=document.getElementById('cv'); if (!cv || !cv.addEventListener) return;
  cv.addEventListener('pointerdown', function(e){
    if (RT.end){ endClick(); return; }
    /* 主页面 / 前情提要：先处理交互，再谈别的事，避免任何一个环节出错把点击吃掉 */
    if (S.screen==='title'){ titlePick(titleHit(e.clientX*DPR, e.clientY*DPR)); return; }
    if (S.screen==='pro'){ anyKey(); proNext(); return; }
    try{ anyKey(); }catch(err){}
    if (e.pointerType==='mouse' && !TOUCH.on) return;
    if (e.clientX > W*0.55) return;
    TOUCH.id=e.pointerId; TOUCH.ox=e.clientX; TOUCH.oy=e.clientY;
    TOUCH.x=e.clientX; TOUCH.y=e.clientY; TOUCH.dx=0; TOUCH.dy=0; TOUCH.active=true;
    if (e.preventDefault) e.preventDefault();
  }, {passive:false});
  cv.addEventListener('pointermove', function(e){
    if (!TOUCH.active || e.pointerId!==TOUCH.id) return;
    TOUCH.x=e.clientX; TOUCH.y=e.clientY;
    var R=Math.min(W,H)*0.16;
    TOUCH.dx=clamp((e.clientX-TOUCH.ox)/R,-1,1);
    TOUCH.dy=clamp((e.clientY-TOUCH.oy)/R,-1,1);
    if (e.preventDefault) e.preventDefault();
  }, {passive:false});
  function end(e){ if (e.pointerId===TOUCH.id){ TOUCH.active=false; TOUCH.id=-1; TOUCH.dx=0; TOUCH.dy=0; } }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  /* 第一人称视角控制：鼠标左右移动转身；触屏用虚拟摇杆的横向分量 */
  cv.addEventListener('pointermove', function(e){
    if (S.screen==='title'){ TITLE.sel=titleHit(e.clientX*DPR, e.clientY*DPR); return; }   /* canvas 兜底，DOM 按钮自己也有 enter 事件 */
    if (VIEW.mx===undefined){ VIEW.mx=e.clientX; return; }
    if (VIEW.fp && S.screen==='play' && !S.dead && !PAUSE.on && !TOUCH.active){
      var dx=e.clientX-VIEW.mx;
      if (Math.abs(dx)>0.5){ S.ang += dx*0.0045; VIEW.lookT=0.5; }
    }
    VIEW.mx=e.clientX;
  });
  cv.addEventListener('pointermove', function(e){
    if (RT.end){ var r=ENDSC.btn;
      ENDSC.hover = (e.clientX*DPR>=r[0]&&e.clientX*DPR<=r[0]+r[2]&&e.clientY*DPR>=r[1]&&e.clientY*DPR<=r[1]+r[3])?1:0; }
  });
  /* 兜底：万一 canvas 没收到指针事件（层级 / 触摸合成），document 这一层再兜一次。
     只在主页面和结局页生效，不会跟游戏内操作打架。 */
  function docPointer(e){
    if (RT.end){ endClick(); return; }
    if (S.screen==='title'){
      if (e.target && e.target.tagName==='CANVAS') return;   // canvas 已经处理过了
      titlePick(titleHit(e.clientX*DPR, e.clientY*DPR));
    }
  }
  document.addEventListener('pointerdown', docPointer);
  bindBtn(document.getElementById('actbtn'), function(){
    anyKey();
    if (TOUCH.active){ TOUCH.sprint=!TOUCH.sprint; return; }
    tryInteract(false);
  });
}

  if (!TOUCH.active) return;
  var ctx=C; ctx.setTransform(1,0,0,1,0,0);
  var R=Math.min(W,H)*0.16*DPR;
  ctx.strokeStyle='rgba(230,224,208,0.35)'; ctx.lineWidth=2*DPR;
  ctx.beginPath(); ctx.arc(TOUCH.ox*DPR, TOUCH.oy*DPR, R, 0, TAU); ctx.stroke();

/* 开放走法：走到门口就进去，不用按键 */
function tryAutoEnter(){
  if (TR.on || S.enterCool>0 || S.dead || S.death || S.screen!=='play') return;
  if (S.mode==='out'){
    var n=nearestEnterable();
    if (!n) return;
    if (n.gate){ S.enterCool=3.0; checkGate(n.gate); return; }

    /* 不在门口：操场上按 E 就是投篮 / 跑步（器材室在操场里，别把进门抢了） */
    if (n.d!==undefined && n.d > 22*22){
      if (!ACT.on && S.mode==='out'){
        if (onCourt()){ S.enterCool=1.6; actStart('hoop'); return; }
        if (onField() || onTrack()){ S.enterCool=1.6; actStart('jog'); return; }
      }
      return;
    }
    var o=n.obj, d=doorOf(o);
    SFX.door(); go('fade',0.36,function(){ enterRoom(o.enter,d); });
  } else {
    var R=INTERIORS[S.room]; if(!R) return;
    var t=tileAt(R,S.x,S.y);
    if (t==='O'){ SFX.door(); go('fade',0.36,exitRoom); }
    else if (t==='L'||t==='M') crossBridge(t);
    else if (t==='c'){ var cx=Math.floor((S.x-R.ox)/R.tw), cy=Math.floor((S.y-R.oy)/R.th); S.enterCool=1.2; useCar(carAt(cx,cy)); }
    else if (t==='D'){ S.enterCool=2.0; if (S.room==='lab3') useTerminal(); else useData(); }
    else if (t==='p'){ S.enterCool=1.8; actStart('piano'); }
    else if (t==='n'){ S.enterCool=1.4; actStart('computer'); }
    else if (t==='b'){ S.enterCool=1.4; actStart('sleep'); }
    else if (t==='w'){ S.enterCool=1.2; actStart('wash'); }
    else if (t==='t' && S.room==='canteen1'){ S.enterCool=1.2; actStart('eat'); }
    else if (t==='X'){ S.enterCool=2.0; useTrash(); }
    else if (t==='R'){ S.enterCool=1.4; searchShelf(); }
  }
}

var USE={ torch:0, brolly:0, coat:0, map:0, phone:0 };
var MARKS=[], MARKN=0;
function itemHint(id){
  switch(id){
    case 'pill':  return '恢复 32 点 SAN，用完就没有了';
    case 'torch': return USE.torch ? '手电筒开着（视野变远）' : '手电筒：照亮前方，视野变远';
    case 'brolly':return USE.brolly? '伞撑着（雨中不湿身）' : '撑伞：下雨时不会淋死';
    case 'coat':  return USE.coat  ? '外套穿着（SAN 慢慢回）' : '披上外套：SAN 缓慢回复';
    case 'map':   return '带在身上，按 M 看地图时能显示每栋楼的名字';
    case 'watch': return '抬腕看时间（精确到秒）';
    case 'coin':  return '丢出去（也可以按 G）';
    case 'chalk': return '在地上画个记号，当路标用';
    case 'usb':   return '里面有「门禁」——三楼数据中心能用';
    case 'memo':  return '重读一遍';
    case 'card':  return '带在身上，夜里在校内走动不容易被记违规';
    case 'phone':
      if (S.batt<=0) return '没电了';
      if (USE.phone===2) return '在打游戏：SAN 慢慢回，但会招来东西（电量 ' + Math.round(S.batt) + '%）';
      if (USE.phone===1) return '屏幕亮着（视野略微变远）· 再按一次打游戏';
      return '点亮屏幕：一点点光，或者打局游戏回点精神（电量 ' + Math.round(S.batt) + '%）';
    case 'key':   return '车钥匙。去地下车库找牌号对得上的车';
    default:      return '';
  }
}
function useItem(slot){
  if (S.screen!=='play'||S.dead||S.death||RT.end) return false;
  var id=S.bag[slot]; if(!id) return false;
  if (id==='pill'){ S.san=Math.min(100,S.san+32); S.bag[slot]=null; renderBag(); SFX.ui(); os('我：吞了一片药。嘴里全是苦的。',3.2); return true; }
  if (id==='torch'){ USE.torch=USE.torch?0:1; SFX.ui(); dropCache(); os(USE.torch?'我：打开手电筒。':'我：关掉手电筒。',2.4); return true; }
  if (id==='brolly'){ USE.brolly=USE.brolly?0:1; SFX.ui(); os(USE.brolly?'我：撑开伞。':'我：收起伞。',2.4); return true; }
  if (id==='coat'){ USE.coat=USE.coat?0:1; SFX.ui(); os(USE.coat?'我：把外套披上。':'我：把外套脱了。',2.4); return true; }
  if (id==='phone'){
    if (S.batt<=0){ os('我：手机没电了，怎么按都不亮。',3.4); return true; }
    USE.phone = (USE.phone+1)%3;
    if (USE.phone) USE.torch=0;
    SFX.ui(); dropCache();
    if (USE.phone===0) os('我：锁屏。',2.4);
    else if (USE.phone===1) os('我：点开手机屏幕。光很弱，但够看脚下。',3.0);
    else { S.gameT=0; os('我：……反正也出不去。打一局。',3.6); }
    return true;
  }
  if (id==='map'){ os('我：平面图我记住了 —— 按 M 就能看详细版。',3.6); return true; }
  if (id==='watch'){ checkTime(); return true; }
  if (id==='coin'){ throwItem(); return true; }
  if (id==='chalk'){ MARKS.push([S.x,S.y,MARKN++]); if(MARKS.length>14) MARKS.shift();
    dropCache(); SFX.ui(); os('我：在地上画了个叉。回头好认。',2.8); return true; }
  if (id==='memo'){ os('我：纸条上写着——「数据中心在三楼，门禁要白名单」。',5.0); return true; }
  if (id==='card'){ os('我：我的学生证。高二（二）班。照片上的人在笑。',4.2); return true; }
  if (id==='phone'){ os('我：没信号。时间还在走。',3.4); return true; }
  if (id==='key'){ os('我：一把车钥匙。牌号 '+RT.plate+'。',4.0); return true; }
  if (id==='usb'){ os('我：U 盘上写着「门禁」。得插在三楼数据中心。',4.6); return true; }
  return false;
}
function useCurrent(){ for(var i=0;i<8;i++) if(S.bag[i]) return useItem(i); return false; }
function renderBag(){
  elGrid.innerHTML='';
  for(var i=0;i<BAG_MAX;i++){
    var id=S.bag[i], it=id?ITEMS[id]:null;
    var d=document.createElement('div');
    d.className='slot'+(it?' has':'');
    d.innerHTML = it ? ('<b class="k">'+(i+1)+'</b>'+it.svg+'<span>'+it.n+'</span>') : ('<b class="k">'+(i+1)+'</b><span>空</span>');
    if (it){ d.style.cursor='pointer';
      (function(sl){ d.onclick=function(){ if(useItem(sl)) renderBag(); }; })(i); }
    elGrid.appendChild(d);
  }
}

var PAUSE={ on:false };
var OPT={ vol:0.5, shake:true, boil:true, quality:2, sub:4 };
var SAVE_KEY='wdfz_save_v1';
var elPause=document.getElementById('pause'), elPset=document.getElementById('pset'), elPmsg=document.getElementById('pmsg');
function pmsg(t,ok){ if(elPmsg){ elPmsg.textContent=t; elPmsg.style.color = ok===false?'#c86a5a':'#8fbf8f'; } }
function pauseOpen(){
  flashForceEnd(); if(S.screen!=='play'||S.dead||RT.end) return; PAUSE.on=true; if(elPause) elPause.classList.add('on'); elInv.classList.remove('open'); dlgClose(); SFX.ui(); }
function pauseClose(){ PAUSE.on=false; if(elPause) elPause.classList.remove('on'); if(elPset) elPset.classList.remove('on'); SFX.ui(); }
function toggleBag(){ if (S.screen!=='play'||S.dead||S.death||PAUSE.on) return; SFX.ui(); elInv.classList.toggle('open'); }
function applyOpt(){
  if (AU.master) AU.master.gain.value = OPT.vol;
  Q.level = OPT.quality; qApply(); resize();
  if (window.__SUBEXTRA===undefined) window.__SUBEXTRA = 0;
}
function saveGame(){
  try{
    var d={ v:1, tsec:S.tsec, mode:S.mode, room:S.room, x:S.x, y:S.y, san:S.san, viol:S.viol,
      stam:S.stam, seated:S.seated, talent:S.talent, bag:S.bag.slice(),
      rt:{ key:RT.key, plate:RT.plate, carPlates:RT.carPlates, carFuel:RT.carFuel, carUsed:RT.carUsed,
           data:RT.data, trash:RT.trash, beast:RT.beast, dropped:RT.dropped,
           clue:RT.clue||0, dblSeen:RT.dblSeen||0, rained:AN.rained||0, hacked:RT.hacked||0 },
      notes:NOTES.map(function(n){ return n.seen?1:0; }),
      spots:SPOTS.map(function(p){ return HINT.found[p.id]?1:0; }),
      actUsed:S.actUsed||{},
      opt:OPT };
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
    pmsg('已保存 —— ' + fmtTime(S.tsec), true);
  }catch(e){ pmsg('保存失败：'+e.message, false); }
}
function loadGame(){
  var raw=null; try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw){ pmsg('没有存档。', false); return; }
  try{
    var d=JSON.parse(raw);
    S.tsec=d.tsec; S.san=d.san; S.viol=d.viol; S.stam=d.stam; S.seated=d.seated;
    S.talent=d.talent; if(d.bag) S.bag=d.bag.slice();
    S.dead=null; S.death=null; RT.end=null; RT.endT=0;
    if(d.rt){ RT.key=d.rt.key; RT.plate=d.rt.plate; RT.carPlates=d.rt.carPlates;
      RT.carFuel=d.rt.carFuel; RT.carUsed=d.rt.carUsed; RT.data=d.rt.data;
      RT.trash=d.rt.trash; RT.beast=d.rt.beast; RT.dropped=d.rt.dropped;
      RT.clue=d.rt.clue||0; RT.dblSeen=d.rt.dblSeen||0; AN.rained=d.rt.rained||0; RT.hacked=d.rt.hacked||0; }
    if (d.notes) for (var ni=0; ni<NOTES.length && ni<d.notes.length; ni++) NOTES[ni].seen=d.notes[ni];
    if (d.actUsed) S.actUsed=d.actUsed;
    if (d.spots){ HINT.found={}; HINT.n=0; HINT.ideaSeen={}; HINT.ideaN=0;
      for (var si2=0; si2<SPOTS.length && si2<d.spots.length; si2++) if (d.spots[si2]){
        HINT.found[SPOTS[si2].id]=1; HINT.n++;
        if (SPOTS[si2].idea){ HINT.ideaSeen[SPOTS[si2].idea]=1; HINT.ideaN++; } } }
    if(d.opt){ OPT.vol=d.opt.vol; OPT.shake=d.opt.shake; OPT.boil=d.opt.boil;
      OPT.quality=d.opt.quality||Q.level; OPT.sub=d.opt.sub||4; applyOpt(); }
    if (d.mode==='in' && d.room && INTERIORS[d.room]){
      buildInterior(d.room); S.mode='in'; S.room=d.room;
    } else { S.mode='out'; S.room=null; }
    S.x=d.x; S.y=d.y; S.vx=0; S.vy=0; dropCache(); camS.init=false;
    S.started=true; S.screen='play'; elHud.classList.add('on'); renderBag();
    elTitle.classList.remove('on'); hidePro(); FALL.on=false;
    if(elPause) elPause.classList.remove('on'); PAUSE.on=false; elInv.classList.remove('open');
    dlgClose(); os('我：……刚才发生什么了。',3.4);
    pmsg('已读取。', true);
  }catch(e){ pmsg('存档损坏：'+e.message, false); }
}

/* ============================ 交互 ============================ */
/* 表里世界不能手动切：正常流程 BW 恒为真，只有 flashBack() 会短暂回到表世界 */
function doFlip(){ if(!DEV.on) return;
  if (BW){ go('blink',0.75,function(){ BW=false; buildOutdoor(); dropCache(); }); }
  else { SFX.blink(); go('blink',0.9,function(){ BW=true; buildOutdoor(); dropCache(); }); } }
function tryInteract(down){
  if (S.dead||S.death||S.screen!=='play') return;
  if (S.mode==='out'){
    var n=nearestEnterable(); if(!n) return;
    if (n.gate){ toast('校门（P6 开放）'); return; }
    var o=n.obj, d=doorOf(o);
    SFX.door(); go('fade',0.42,function(){ enterRoom(o.enter,d); });
    return;
  }
  var R=INTERIORS[S.room], t=tileAt(R,S.x,S.y);
  if (t==='S'){
    var f=down?R.floor-1:R.floor+1;
    if (f>=1 && INTERIORS[R.host+f]){ SFX.stair(); go('stair',0.34,function(){ gotoFloor(R.host,f); }); }
    else toast(down?'到底了。':'上面还没做。');
    return;
  }
  if (t==='L'||t==='M'){ return; }
  if (t==='O'){ return; }
  if (t==='P'){ S.seated=!S.seated; SFX.ui(); toast(S.seated?'你坐下了。':'你站了起来。'); return; }
  if (t==='B'){ toast('男厕。第三个隔间的门从里面锁着。'); return; }
  if (t==='G'){ toast('女厕。（那个彩蛋不在这里）'); return; }
  if (t==='R'){ searchShelf(); return; }
}
function gotoFloor(host,f){
  var id=host+f, R=INTERIORS[id]; if(!R) return;
  buildInterior(id); S.room=id; S.seated=false;
  var p=findTileIn(id,'S');
  var c = p ? tileCenter(R, R.ox+(p[0]+0.5)*R.tw, R.oy+(p[1]+0.5)*R.th)
            : tileCenter(R, R.ox+R.w/2, R.oy+R.h/2);
  S.x=c[0]; S.y=c[1]; S.enterCool=1.2; dropCache();
  describe(id);
}
function enterRoom(id){
  if (!INTERIORS[id]){ toast('（这栋楼还没做）'); return; }
  buildInterior(id);
  var R=INTERIORS[id], o=objById(R.host), door=doorOf(o);
  S.mode='in'; S.room=id;
  var c=tileCenter(R, door?door[0]:R.ox+R.w/2, R.oy+16.5*R.th);
  S.x=c[0]; S.y=c[1]; S.enterCool=1.4; dropCache();
  describe(id);
}
function exitRoom(){
  var R=INTERIORS[S.room], o=objById(R.host), door=doorOf(o); if(!door) return;
  S.mode='out'; S.room=null; S.seated=false;
  S.x = door[0] + door[2]*32;
  S.y = door[1] + door[3]*32;
  S.enterCool = 1.6;
  dropCache(); describe('OUT');
}

/* ============================ 绘制 ============================ */
function drawInteriorTo(ctx,R){
  if (!R || !R.baked) return;
  strokeV(ctx,R.floorPoly,{ f:P('floor') });
  /* 每个房间门口的地面刷一层淡淡的底色 —— 走到不同教室脚下颜色不一样，
     一眼能分出"这是第几间"。 */
  if (R.rooms && R.rooms.length){
    var RTINT=['rgba(190,170,120,0.16)','rgba(140,180,170,0.16)','rgba(180,150,180,0.16)',
               'rgba(170,180,140,0.16)','rgba(190,150,140,0.16)','rgba(150,165,195,0.16)',
               'rgba(200,180,150,0.16)'];
    for(i=0;i<R.rooms.length;i++){
      var rr=R.rooms[i];
      ctx.fillStyle = RTINT[i % RTINT.length];
      ctx.fillRect(R.ox+(rr[0]-0.5)*R.tw, R.oy+R.th*0.5, (rr[1]-rr[0]+1)*R.tw, R.th*(R.rows-2));
    }
  }
  ctx.strokeStyle=P('bldgInk'); ctx.lineWidth=3.4;
  pathOf(ctx,R.floorPoly); ctx.stroke();
  var i;
  // 厕所地面
  for(i=0;i<R.misc.length;i++){ var mi=R.misc[i];
    if (mi.k==='toilet') strokeV(ctx,mi.v,{ f:P('toilet'), c:P('toiletInk'), w:1.3 }); }
  // 墙
  for(i=0;i<R.walls.length;i++) strokeV(ctx,R.walls[i].v,{ f:P('bldg'), c:P('bldgInk'), w:2.8 });
  // 窗
  ctx.strokeStyle=P('glass'); ctx.lineWidth=2.0;
  for(i=0;i<R.windows.length;i++){ var wd=R.windows[i];
    ctx.beginPath();
    if (wd.vert){ ctx.moveTo(wd.x+2.6, wd.y); ctx.lineTo(wd.x+2.6, wd.y+wd.h); }
    else { ctx.moveTo(wd.x, wd.y+2.6); ctx.lineTo(wd.x+wd.w, wd.y+2.6); }
    ctx.stroke(); }
  // 黑板
  for(i=0;i<R.boards.length;i++){ var bd=R.boards[i];
    ctx.fillStyle=P('board'); ctx.fillRect(bd.x+3, bd.y, bd.w-6, bd.h);
    ctx.strokeStyle=P('bldgInk'); ctx.lineWidth=1.2; ctx.strokeRect(bd.x+3, bd.y, bd.w-6, bd.h); }
  // 其它
  for(i=0;i<R.misc.length;i++){ var m=R.misc[i];
    if (m.k==='toilet') continue;
    if (m.k==='stair') strokeV(ctx,m.v,{ f:P('aux'), c:P('auxInk'), w:2.0 });
    else if (m.k==='shelf') strokeV(ctx,m.v,{ f:P('aux'), c:P('auxInk'), w:1.6 });
    else if (m.k==='bed') strokeV(ctx,m.v,{ f:BW?'#2e2e2e':'#c9d4e2', c:P('bldgInk'), w:1.8 });
    else if (m.k==='table') strokeV(ctx,m.v,{ f:BW?'#333333':'#d8bf94', c:P('deskInk'), w:1.8 });
    else if (m.k==='counter') strokeV(ctx,m.v,{ f:BW?'#2a2a2a':'#b9c2c6', c:P('bldgInk'), w:1.8 });
    else if (m.k==='cabinet') strokeV(ctx,m.v,{ f:BW?'#2c2c2c':'#c6b9a0', c:P('bldgInk'), w:1.8 });
    else if (m.k==='lab') strokeV(ctx,m.v,{ f:BW?'#2b2b2b':'#bcd2d8', c:P('bldgInk'), w:1.8 });
    else if (m.k==='basin') strokeV(ctx,m.v,{ f:BW?'#343434':'#dfeaf0', c:P('toiletInk'), w:1.5 });
    else if (m.k==='rack') strokeV(ctx,m.v,{ f:BW?'#282828':'#c2b9a4', c:P('bldgInk'), w:1.8 });
    else if (m.k==='car') strokeV(ctx,m.v,{ f:BW?'#3a3a3a':'#a9b6c4', c:P('bldgInk'), w:2.4 });
    else if (m.k==='computer'){ strokeV(ctx,m.v,{ f:BW?'#26282e':'#9aa6b8', c:P('bldgInk'), w:1.8 }); }
    else if (m.k==='piano'){ strokeV(ctx,m.v,{ f:BW?'#1c1c1e':'#2a2a30', c:BW?'#c8c8c8':'#e8e2d2', w:2.6 }); }
    else if (m.k==='globe'){ strokeV(ctx,m.v,{ f:BW?'#2c3038':'#7fa8c4', c:P('bldgInk'), w:2.0 }); }
    else if (m.k==='gear'){ strokeV(ctx,m.v,{ f:BW?'#2a2a2c':'#b8a98c', c:P('bldgInk'), w:1.9 }); }
    else if (m.k==='pillar'){ strokeV(ctx,m.v,{ f:BW?'#4a4a4e':'#8a8a92', c:P('bldgInk'), w:2.6 }); }
    else if (m.k==='bay'){ ctx.fillStyle = BW?'rgba(190,190,190,0.55)':'rgba(232,228,214,0.62)';
      ctx.fillRect(m.x+0.5, m.y+0.5, Math.max(1,m.w-1), Math.max(1,m.h-1)); }
    else if (m.k==='data') strokeV(ctx,m.v,{ f:BW?'#1e2a2a':'#9fd8d0', c:ACC, w:2.2 });
    else if (m.k==='trash') strokeV(ctx,m.v,{ f:BW?'#2a2a2a':'#8f9a7e', c:P('bldgInk'), w:2.2 });
    else if (m.k==='out') strokeV(ctx,m.v,{ f:P('garden'), c:P('bldgInk'), w:2.6 });
    else if (m.k==='link'){
      strokeV(ctx,m.v,{ f:BW?'#33383a':'#cfe0d0', c:ACC, w:2.4 });
      /* 中线上拉一条引导线，告诉玩家"从这儿过去" */
      ctx.save(); ctx.setLineDash([5,5]);
      ctx.strokeStyle = BW?'rgba(255,255,255,0.5)':'rgba(40,90,80,0.55)'; ctx.lineWidth=1.6;
      ctx.beginPath();
      if (m.h > m.w){ ctx.moveTo(m.x+m.w*0.5, m.y+2); ctx.lineTo(m.x+m.w*0.5, m.y+m.h-2); }
      else { ctx.moveTo(m.x+2, m.y+m.h*0.5); ctx.lineTo(m.x+m.w-2, m.y+m.h*0.5); }
      ctx.stroke(); ctx.restore();
    }
    else if (m.k==='podium'){ ctx.fillStyle=P('desk'); ctx.fillRect(m.x+3,m.y+2,m.w-6,m.h-4);
      ctx.strokeStyle=P('deskInk'); ctx.lineWidth=1.4; ctx.strokeRect(m.x+3,m.y+2,m.w-6,m.h-4); }
  }
  // 课桌 + 椅子
  ctx.lineWidth=1.5;
  for(i=0;i<R.desks.length;i++){ var dk=R.desks[i];
    ctx.fillStyle = dk.seat ? ACC : P('desk');
    ctx.fillRect(dk.x, dk.y, dk.w, dk.h);
    ctx.strokeStyle=P('deskInk'); ctx.strokeRect(dk.x, dk.y, dk.w, dk.h);
    ctx.beginPath(); ctx.moveTo(dk.x+dk.w*0.28, dk.chair); ctx.lineTo(dk.x+dk.w*0.72, dk.chair); ctx.stroke(); }
  // 门弧
  ctx.strokeStyle=P('bldgInk'); ctx.lineWidth=1.4;
  /* 门牌号：门上方挂一块小牌子。房间号按门在走廊上的顺序编号。 */
  for(i=0;i<R.doors.length;i++){ var dr2=R.doors[i];
    var dw2=dr2.w||R.tw, dh2=dr2.h||R.th;
    var dx2=(dr2.x0!==undefined)?dr2.x0:dr2.x-dw2*0.5;
    var dy2=(dr2.y0!==undefined)?dr2.y0:dr2.y-th*0.5;
    var vert=(dh2>dw2);
    var num = R.floor*100 + (i+1);
    var lx = vert ? dx2 + dw2 + 6 : dx2 + dw2*0.5;
    var ly = vert ? dy2 + dh2*0.5 : dy2 - 7;
    /* 尺寸单位是「世界单位」，一格 = R.tw（9）。门缝差不多 1 格宽，
       牌子就做成 0.9 格宽 × 0.5 格高，贴在门框正上方。 */
    var tw3 = R.tw;
    var pw2 = vert ? tw3*0.34 : tw3*0.9;
    var ph2 = vert ? tw3*0.9  : tw3*0.5;
    var px2 = vert ? lx + tw3*0.06 : lx - pw2*0.5;
    var py2 = vert ? ly - ph2*0.5 : ly - tw3*0.42;
    ctx.fillStyle = BW ? 'rgba(48,48,48,0.94)' : 'rgba(38,50,38,0.94)';
    ctx.fillRect(px2, py2, pw2, ph2);
    ctx.strokeStyle = BW ? 'rgba(220,220,220,0.9)' : 'rgba(216,200,154,0.9)';
    ctx.lineWidth = 0.9;
    ctx.strokeRect(px2, py2, pw2, ph2);
    ctx.fillStyle = BW ? '#f0f0f0' : '#f2e8c6';
    ctx.font = Math.max(3.5, tw3*0.42)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(num), px2+pw2*0.5, py2+ph2*0.5);
  }
  /* 门：暖褐门板 + 深色门框 + 门缝。和墙、地面明确区分，一眼看出哪儿能出去 */
  for(i=0;i<R.doors.length;i++){ var dr=R.doors[i];
    var dw = dr.w || R.tw, dh = dr.h || R.th;
    var dx0 = (dr.x0!==undefined) ? dr.x0 : dr.x-(dw-1)*0.5-0.5;
    var dy0 = (dr.y0!==undefined) ? dr.y0 : dr.y-th*0.5;
    ctx.fillStyle = BW ? '#4c4c4c' : '#8a5a34';
    ctx.fillRect(dx0, dy0, dw, dh);
    ctx.strokeStyle = BW ? '#dcdcdc' : '#3a2416'; ctx.lineWidth = 1.8;
    ctx.strokeRect(dx0+0.9, dy0+0.9, dw-1.8, dh-1.8);
    ctx.beginPath();
    if (dh > dw){ ctx.moveTo(dx0+dw*0.5, dy0+2.5); ctx.lineTo(dx0+dw*0.5, dy0+dh-2.5); }
    else { ctx.moveTo(dx0+2.5, dy0+dh*0.5); ctx.lineTo(dx0+dw-2.5, dy0+dh*0.5); }
    ctx.strokeStyle = BW ? 'rgba(0,0,0,0.65)' : 'rgba(28,16,8,0.8)'; ctx.lineWidth = 1.3; ctx.stroke(); }
  /* ---- 楼梯间的楼层号 ---- */
  for(i=0;i<R.misc.length;i++){
    var st=R.misc[i]; if (st.k!=='stair') continue;
    ctx.fillStyle = BW?'rgba(48,48,48,0.9)':'rgba(40,52,44,0.9)';
    var sw2=R.tw*1.6, sh2=R.th*1.1;
    var sx0 = st.x - sw2 - 2, sy0 = st.y + R.th*0.2;
    ctx.fillRect(sx0, sy0, sw2, sh2);
    ctx.strokeStyle = BW?'rgba(220,220,220,0.85)':'rgba(216,200,154,0.85)';
    ctx.lineWidth=1.5; ctx.strokeRect(sx0, sy0, sw2, sh2);
    ctx.fillStyle = BW?'#f0f0f0':'#f2e8c6';
    ctx.font='bold '+Math.round(R.th*0.8)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(R.floor)+'F', sx0+sw2*0.5, sy0+sh2*0.5);
    break;
  }
  /* ---- 天台上的第二个你 ---- */
  if (S.room==='teach6'){
    var fx=R.ox+R.w*0.76, fy=R.oy+R.h*0.40;
    ctx.fillStyle='rgba(196,194,188,0.55)';
    ctx.beginPath(); ctx.ellipse(fx, fy, 11, 20, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(fx, fy-27, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(fx, fy, 44+Math.sin(S.tsec*0.02)*3, 0, TAU); ctx.stroke();
  }
  /* ---- 课桌上的刻字：少数几张桌子有一点痕迹 ---- */
  if (R.desks && R.desks.length){
    for(i=0;i<R.desks.length;i+=9){
      var dk3=R.desks[i]; if (dk3.seat) continue;
      ctx.strokeStyle = BW?'rgba(40,40,40,0.5)':'rgba(70,55,35,0.45)';
      ctx.lineWidth=1.0;
      ctx.beginPath();
      ctx.moveTo(dk3.x+dk3.w*0.25, dk3.y+dk3.h*0.42);
      ctx.lineTo(dk3.x+dk3.w*0.46, dk3.y+dk3.h*0.58);
      ctx.moveTo(dk3.x+dk3.w*0.62, dk3.y+dk3.h*0.40);
      ctx.lineTo(dk3.x+dk3.w*0.80, dk3.y+dk3.h*0.60);
      ctx.stroke();
    }
  }
  /* ---- 上课时教室里的同学剪影 ---- */
  if (R.host==='teach' && R.floor>=1 && R.floor<=5 && needWhere(S.tsec)==='教室' && R.desks){
    for(i=0;i<R.desks.length;i+=2){
      var dk2=R.desks[i];
      if (dk2.seat) continue;
      var sway=Math.sin(S.tsec*0.03+i)*0.7;
      ctx.fillStyle='rgba(150,150,146,0.42)';
      ctx.beginPath(); ctx.ellipse(dk2.x+dk2.w*0.5+sway, dk2.y+dk2.h*0.9, dk2.w*0.30, dk2.h*0.28, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(dk2.x+dk2.w*0.5+sway, dk2.y+dk2.h*0.42, dk2.w*0.20, 0, TAU); ctx.fill();
    }
  }
  /* ---- 后墙黑板报：主题色 + 边框 + 几张贴纸 ---- */
  if (R.host==='teach' && R.floor>=1 && R.floor<=5 && R.name.indexOf('班')>=0){
    var bbY=R.oy+R.th*15.6, bbH=R.th*1.1;
    for(i=0;i<R.rooms.length;i++){
      var rm=R.rooms[i];
      var bx0=R.ox+(rm[0]+0.6)*R.tw, bw0=(rm[1]-rm[0]-0.2)*R.tw;
      ctx.fillStyle = BW?'rgba(60,60,60,0.85)':'rgba(46,58,44,0.9)';
      ctx.fillRect(bx0, bbY, bw0, bbH);
      ctx.strokeStyle = BW?'rgba(200,200,200,0.7)':'rgba(216,200,154,0.8)';
      ctx.lineWidth=1.6; ctx.strokeRect(bx0, bbY, bw0, bbH);
      /* 板上贴的纸 */
      for(var pi=0;pi<4;pi++){
        var pw0=bw0*0.16, px0=bx0+bw0*(0.08+pi*0.23);
        ctx.fillStyle = BW?'rgba(190,190,190,0.55)':'rgba(235,225,190,0.75)';
        ctx.fillRect(px0, bbY+bbH*0.18, pw0, bbH*0.62);
        if (!BW){
          ctx.fillStyle = ['rgba(200,80,70,0.5)','rgba(90,140,180,0.5)','rgba(230,190,90,0.5)','rgba(120,170,120,0.5)'][pi];
          ctx.fillRect(px0, bbY+bbH*0.18, pw0, bbH*0.16);
        }
      }
    }
  }
  /* ---- 教室陈设 ---- */
  var tt=S.tsec;
  if (R.lamps){  // 日光灯：地上一滩冷白，偶尔闪一下
    for(i=0;i<R.lamps.length;i++){ var lp=R.lamps[i];
      var flick=(hash2(i,2,Math.floor(tt*7))>0.94)?0.35:1;
      if (i%4===0 && R.floor===4 && !BW) flick*=0.9;
      ctx.fillStyle='rgba(226,232,224,'+(0.10*flick)+')';
      ctx.fillRect(lp.x-lp.w*0.5, lp.y-lp.h*2.4, lp.w, lp.h*5.2);
      ctx.strokeStyle='rgba(236,240,232,'+(0.34*flick)+')'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(lp.x-lp.w*0.5, lp.y); ctx.lineTo(lp.x+lp.w*0.5, lp.y); ctx.stroke(); }
  }
  if (R.fans){   // 吊扇：淡影 + 转动的叶片
    for(i=0;i<R.fans.length;i++){ var fn2=R.fans[i];
      ctx.save(); ctx.translate(fn2.x, fn2.y);
      ctx.strokeStyle='rgba(120,112,96,0.30)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(0,0,fn2.r,0,TAU); ctx.stroke();
      ctx.rotate(tt*(1.4+i*0.25)%TAU);
      ctx.strokeStyle='rgba(120,112,96,0.38)'; ctx.lineWidth=2.2;
      for(var b2=0;b2<3;b2++){ ctx.rotate(TAU/3);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(fn2.r*0.86,0); ctx.stroke(); }
      ctx.restore(); }
  }
  if (R.clocks){  // 后墙挂钟：秒针真的在走
    for(i=0;i<R.clocks.length;i++){ var ck=R.clocks[i];
      ctx.fillStyle=P('aux'); ctx.beginPath(); ctx.arc(ck.x,ck.y,ck.r,0,TAU); ctx.fill();
      ctx.strokeStyle=P('bldgInk'); ctx.lineWidth=1.3; ctx.stroke();
      var sec=(tt%60)/60*TAU, min=(tt%3600)/3600*TAU;
      ctx.strokeStyle='rgba(180,40,32,0.9)'; ctx.lineWidth=1.0;
      ctx.beginPath(); ctx.moveTo(ck.x,ck.y); ctx.lineTo(ck.x+Math.sin(sec)*ck.r*0.9, ck.y-Math.cos(sec)*ck.r*0.9); ctx.stroke();
      ctx.strokeStyle=P('bldgInk'); ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(ck.x,ck.y); ctx.lineTo(ck.x+Math.sin(min)*ck.r*0.62, ck.y-Math.cos(min)*ck.r*0.62); ctx.stroke(); }
  }
  if (R.corner){ // 黑板报
    for(i=0;i<R.corner.length;i++){ var cn=R.corner[i];
      ctx.fillStyle=BW?'#1e1e1e':'#cfe0cf'; ctx.fillRect(cn.x, cn.y, cn.w, cn.h);
      ctx.strokeStyle=P('bldgInk'); ctx.lineWidth=1.2; ctx.strokeRect(cn.x, cn.y, cn.w, cn.h);
      ctx.strokeStyle='rgba(150,60,50,0.55)'; ctx.lineWidth=0.9;
      for(var q2=0;q2<3;q2++){ ctx.beginPath();
        ctx.moveTo(cn.x+4, cn.y+cn.h*0.30+q2*cn.h*0.24);
        ctx.lineTo(cn.x+cn.w*(0.35+hash2(i,q2,9)*0.5), cn.y+cn.h*0.30+q2*cn.h*0.24); ctx.stroke(); } }
  }
}
function drawAccentParts(ctx,a,alpha){
  ctx.globalAlpha = alpha===undefined?1:alpha;
  for(var i=0;i<a.baked.length;i++){
    var pt=a.parts[i], st={ w:pt.w };
    if (pt.fill) st.f=a.col; else st.c=a.col;
    strokeV(ctx,a.baked[i],st);
  }
  ctx.globalAlpha=1;
}
function drawPlayer(){
  var ctx=C, a=S.ang, spd=S.sprinting?1.5:1.0;
  var sw=S.moving?Math.sin(S.walkPhase)*2.6*spd:0;
  var bob=S.moving?Math.abs(Math.sin(S.walkPhase))*1.1*spd:Math.sin(S.walkPhase)*0.7;
  var sinkK=0;
  if (S.death && S.death.kind==='floor'){
    var dtt=S.death.t;
    sinkK = dtt<0.30 ? 0 : (dtt<1.35 ? smooth((dtt-0.30)/1.05) : 1);
  }
  ctx.save(); ctx.translate(S.x, S.y + sinkK*22);
  if (sinkK>0){ ctx.scale(1-0.62*sinkK, 1-0.62*sinkK); ctx.rotate(2.4*sinkK); }
  ctx.beginPath(); ctx.ellipse(0,2.4,6.6,3.6,0,0,TAU);
  ctx.fillStyle=BW?'rgba(0,0,0,.45)':'rgba(40,30,20,.22)'; ctx.fill();
  ctx.rotate(a+Math.PI/2); ctx.translate(0,-bob);
  // 鞋
  ctx.fillStyle=P('hair');
  ctx.beginPath(); ctx.ellipse(-2.0+sw*0.45, 5.4+sw, 2.1, 1.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 2.0-sw*0.45, 5.4-sw, 2.1, 1.5, 0, 0, TAU); ctx.fill();
  // 腿
  ctx.strokeStyle=P('cloth'); ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-1.9,0.8); ctx.lineTo(-1.9+sw*0.5,4.9+sw*0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1.9,0.8);  ctx.lineTo(1.9-sw*0.5,4.9-sw*0.9); ctx.stroke();
  // 书包
  ctx.beginPath(); ctx.ellipse(0,2.4,3.9,3.2,0,0,TAU); ctx.fillStyle=P('pack'); ctx.fill();
  ctx.strokeStyle=P('hair'); ctx.lineWidth=1.1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.6,0.4); ctx.lineTo(2.6,0.4); ctx.stroke();
  // 肩 + 校服（白衬衫领）
  ctx.beginPath(); ctx.ellipse(0,-0.2,4.9,5.8,0,0,TAU); ctx.fillStyle=P('cloth'); ctx.fill();
  ctx.strokeStyle=P('hair'); ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.4,-3.4); ctx.lineTo(0,0.4); ctx.lineTo(2.4,-3.4);
  ctx.strokeStyle=BW?'rgba(200,200,200,.55)':'rgba(245,242,232,.75)'; ctx.lineWidth=1.8; ctx.stroke();
  // 手臂
  ctx.strokeStyle=P('cloth'); ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(-4.2,-0.8); ctx.lineTo(-5.0+sw*0.35, 2.0-sw*0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 4.2,-0.8); ctx.lineTo( 5.0-sw*0.35, 2.0+sw*0.7); ctx.stroke();
  ctx.fillStyle=P('skin');
  ctx.beginPath(); ctx.arc(-5.0+sw*0.35, 2.0-sw*0.7, 1.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 5.0-sw*0.35, 2.0+sw*0.7, 1.3, 0, TAU); ctx.fill();
  // 脖子 + 头
  ctx.fillStyle=P('skin');
  ctx.beginPath(); ctx.ellipse(0,-3.0,1.7,1.4,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-5.4,3.5,3.8,0,0,TAU); ctx.fill();
  ctx.strokeStyle=P('hair'); ctx.lineWidth=1.5; ctx.stroke();
  // 头发（朝向的一侧厚重一点）
  ctx.beginPath(); ctx.ellipse(0,-6.0,3.5,2.9,0,Math.PI*1.02,Math.PI*1.98);
  ctx.strokeStyle=P('hair'); ctx.lineWidth=2.6; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,-4.6,3.3,3.4,0,Math.PI*0.15,Math.PI*0.85);
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.restore();
}
/* ============================ SAN 引导 ============================
   SAN 低了主角会自己想起"该去哪儿缓一缓"，并且报出最近的那个地方。
   越难受说得越急；同一个地方不会连着念。 */
var SANSPOTS=[
  { k:'piano',    x:560, y:700,  n:'实验楼五楼的音乐教室', d:'去弹会儿琴' },
  { k:'computer', x:560, y:700,  n:'实验楼三楼的计算机教室', d:'去机房坐一会儿' },
  { k:'sleep',    x:552, y:1115, n:'宿舍',                 d:'回宿舍躺一会儿' },
  { k:'eat',      x:600, y:1160, n:'食堂',                 d:'去食堂吃点东西' },
  { k:'jog',      x:515, y:530,  n:'大操场',               d:'去操场跑两圈' },
  { k:'hoop',     x:500, y:300,  n:'篮球场',               d:'去打会儿球' },
  { k:'wash',     x:500, y:900,  n:'洗手间',               d:'去洗把脸' }
];
var GUIDE={ t:18, last:'', lvl:0 };
/* 什么时候"适合"想起这件事：
   —— 站定不动一会儿（不是在赶路）
   —— 没有异象在发生（心不慌的时候才想得起别的）
   —— 不在高危区（那种地方只想赶紧出去）
   —— 不是在教室里上课（上课说这个太出戏）
   —— 天还亮着/或者已经在室内躲好了 */
function guideMoment(){
  if (AN.cur) return false;
  if (S.moving) return false;
  if ((S.idle||0) < 2.2) return false;
  if (dangerAt()) return false;
  if (ACT.on) return false;
  if (S.mode==='in' && inClassroom()>=0 && needWhere(S.tsec)==='教室') return false;
  return true;
}
function guideTick(dt){
  if (S.screen!=='play' || S.dead || S.death || RT.end) return;
  GUIDE.t -= dt;
  if (GUIDE.t>0) return;
  if (!guideMoment()) return;                          // 时机不对就再等等
  if (ACT.on) return;                                  // 已经在放松了，别催
  var san=S.san, want = san<18 ? 3 : (san<30 ? 2 : (san<42 ? 1 : 0));
  if (want===0){ GUIDE.lvl=0; return; }
  /* 找最近的那个地方 */
  var best=null, bd=1e18;
  for(var i=0;i<SANSPOTS.length;i++){
    var sp=SANSPOTS[i];
    var dx=S.x-sp.x*SC, dy=S.y-sp.y*SC, d2=dx*dx+dy*dy;
    if (d2<bd){ bd=d2; best=sp; }
  }
  if (!best) return;
  if (best.k===GUIDE.last && want<=GUIDE.lvl){ GUIDE.t=8; return; }   // 同一个地方别连念
  if ((GUIDE.n||0) >= 6 && want<3){ GUIDE.t=30; return; }   // 说够了就闭嘴，除非真的撑不住
  GUIDE.last=best.k; GUIDE.lvl=want;
  GUIDE.n=(GUIDE.n||0)+1;
  if (want>=3) GUIDE.t=26;
  GUIDE.t = want>=3 ? 14 : (want===2 ? 22 : 34);
  if (want>=3)      os('我：不行了。我得找个地方缓一缓 —— '+best.d+'。', 6.0);
  else if (want===2) os('我：头很沉。……'+best.n+'。'+best.d+'吧。', 5.6);
  else              os('我：有点撑不住了。要不要'+best.d+'？', 5.0);
}
/* ============================ 高危区 ============================
   有些地方本来就不该去：地下车库、垃圾房、熄灯后的室外。
   在里面 SAN 掉得快、异象来得勤，车库还有一个会动的东西。 */
var DANGER={
  garage: { n:'地下车库', san:0.55, an:2.2, roam:true },
  trash:  { n:'垃圾房',   san:0.40, an:1.8, roam:false },
  night:  { n:'熄灯后的校园', san:0.30, an:1.6, roam:false }
};
function dangerAt(){
  if (S.mode==='in'){
    if (S.room==='garage1') return 'garage';
    if (S.room==='trash1')  return 'trash';
    return null;
  }
  if (isNight()) return 'night';
  return null;
}
/* 车库里游荡的东西：只在你视线之外移动，靠近就出事 */
var ROAM={ on:false, x:0, y:0, vx:0, vy:0, cd:0, seen:0 };
function roamReset(){
  var R=INTERIORS['garage1']; if(!R) return;
  ROAM.x=R.ox+R.w*0.86; ROAM.y=R.oy+R.h*0.5;
  ROAM.vx=ROAM.vy=0; ROAM.cd=3.5; ROAM.on=true; ROAM.seen=0;
}
function roamTick(dt){
  var dg=dangerAt();
  if (dg!=='garage' || !INTERIORS['garage1']){ ROAM.on=false; return; }
  if (!ROAM.on) roamReset();
  var R=INTERIORS['garage1'];
  ROAM.cd-=dt;
  if (ROAM.cd<=0){
    ROAM.cd = 1.1+Math.random()*1.4;
    /* 朝玩家逼近，但绕开柱子 */
    var dx=S.x-ROAM.x, dy=S.y-ROAM.y, dl=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=ROAM.x+dx/dl*34, ny=ROAM.y+dy/dl*34;
    if (!solidIndoor(R,nx,ROAM.y,5)) ROAM.x=nx;
    if (!solidIndoor(R,ROAM.x,ny,5)) ROAM.y=ny;
  }
  var ddx=S.x-ROAM.x, ddy=S.y-ROAM.y;
  var dist=Math.sqrt(ddx*ddx+ddy*ddy);
  /* 靠近就掉 SAN；贴脸就死 */
  if (dist<150){ S.san-=dt*1.1; if (!ROAM.seen){ ROAM.seen=1; os('我：车道那头有东西。它不是走路的姿势。',5.2); } }
  if (dist<26) kill('你在地下车库撞上了那个东西。它一直在等你走过去。');
}
/* 高危区的持续效果 */
function dangerTick(dt){
  var dg=dangerAt();
  if (!dg) return;
  var D2=DANGER[dg];
  S.san -= dt*D2.san;
  AN.next -= dt*D2.an;
  if (!S.dangerSeen) S.dangerSeen={};
  if (!S.dangerSeen[dg]){
    S.dangerSeen[dg]=1;
    if (dg==='garage') os('我：车库里没有灯。只有最里面那盏在闪。',5.0);
    else if (dg==='trash') os('我：垃圾房的味道不对。太干净了。',4.6);
    else os('我：熄灯了。这种时候还在外面走，是要被记的。',5.0);
  }
}

/* ============================ 恢复 SAN 的活动 ============================
   站到对应的位置按 E 就能「做点什么」：弹琴、玩电脑、打球、跑步、睡觉、吃饭、洗脸。
   做的过程中 SAN 慢慢回来，但人会放松警惕 —— 异象进度显著加快。
   同一个活动重复做，收益递减，不能靠它无限续航。 */
var ACT={ on:false, kind:null, t:0, dur:0, spent:0, label:'' };
var ACTS={
  piano:   { n:'弹钢琴',   dur:26, rate:1.7, key:'p',  where:['lab5'] },

  sleep:   { n:'睡一会儿', dur:42, rate:2.3, key:'b',  where:'dorm' },
  eat:     { n:'吃点东西', dur:20, rate:1.15, key:'t', where:['canteen1'] },
  wash:    { n:'洗把脸',   dur:12, rate:1.5, key:'w',  where:'any' },
  hoop:    { n:'投篮',     dur:20, rate:1.6, key:null, out:'court' },
  jog:     { n:'绕着操场跑', dur:26, rate:1.9, key:null, out:'field' }
};
function actDim(kind){
  var used=(S.actUsed && S.actUsed[kind]) || 0;
  return Math.max(0.22, 1 - used*0.28);        // 做过的次数越多，回得越少
}
function actStart(kind){
  var A=ACTS[kind]; if(!A) return false;
  if (ACT.on){ actStop(true); }
  ACT.on=true; ACT.kind=kind; ACT.t=0; ACT.dur=A.dur; ACT.spent=0;
  ACT.label=A.n;
  S.seated=false;

    piano:'我：坐下来了。指尖有点凉。',
    computer:'我：开机。风扇的声音很吵，但至少是活的。',
    sleep:'我：躺下。眼睛一闭上，走廊的声音就远了。',
    eat:'我：打了两个菜。饭是热的。',
    wash:'我：水是凉的。',
    hoop:'我：球弹回来的时候，我听见它撞地的声音。',
    jog:'我：跑起来。风从耳朵边上过去。'
  };
  if (lines[kind]) os(lines[kind], 3.6);
