<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>武大附中 · 里世界 v1.2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0b09;
    font-family:"Kaiti SC","STKaiti","KaiTi","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
  #wrap{position:fixed;inset:0}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none;font-size:13px;letter-spacing:.5px;opacity:0;transition:opacity .6s;
    padding:var(--sat) var(--sar) var(--sab) var(--sal)}
  #hud.on{opacity:1}
  #top{position:absolute;top:0;left:0;right:0;padding:calc(8px + var(--sat)) calc(14px + var(--sar)) 8px calc(14px + var(--sal));display:flex;align-items:center;gap:12px}
  #sanbox{flex:0 0 132px;height:9px;border:1.5px solid #4a4038;border-radius:5px;position:relative;background:#1a1712;overflow:hidden}
  #sanbar{position:absolute;inset:0;width:100%;background:#b4483c;transform-origin:left center;transition:transform .25s linear}
  #clock{font-size:19px;color:#e8ddc8;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;letter-spacing:1px}
  #sched{margin-left:auto;color:#a1937f;font-size:12.5px;transition:color .3s}
  #sched.warn{color:#e0705a}
  #locname{position:absolute;top:44px;left:14px;color:#8e8272;font-size:12px}
  .btn{pointer-events:auto;cursor:pointer;background:#1c1815;color:#e8ddc8;
    border:1.5px solid #524639;border-radius:3px;padding:9px 16px;font-family:inherit;font-size:14px;
    letter-spacing:1px;transition:background .12s}
  .btn:hover{background:#2a241d}
  #bagbtn{position:absolute;left:calc(14px + var(--sal));bottom:calc(14px + var(--sab))}
  #actbtn{position:absolute;right:calc(14px + var(--sar));bottom:calc(96px + var(--sab));display:none;
    width:76px;height:76px;border-radius:50%;font-size:15px;letter-spacing:2px;padding:0}
  body.touch #actbtn{display:block}
  body.touch .btn{padding:12px 18px;font-size:15px}
  body.touch #bagbtn{bottom:calc(14px + var(--sab))}
  @media (max-width:820px){
    #devp{width:100%;border-right:none}
    #title .btn{width:74vw;max-width:320px}
    #sub{font-size:15px;bottom:calc(118px + var(--sab));max-width:88vw}
    #dlg{max-width:80vw}
    #dlgb{font-size:14px}
    #choices{right:calc(14px + var(--sar));bottom:calc(126px + var(--sab))}
    #choices .btn{min-width:130px}
  }
  #choices{position:absolute;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #choices .btn{min-width:150px;text-align:left}
  #choices .btn .k{color:#8e8272;margin-right:7px;font-size:12px}
  #prompt{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);
    color:#f0e4c8;background:rgba(20,17,13,.82);border:1.5px solid #524639;border-radius:3px;
    padding:6px 14px;font-size:13.5px;display:none}
  #inv{position:fixed;inset:0;background:rgba(8,7,5,.9);display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .24s ease}
  #inv.open{opacity:1;pointer-events:auto}
  #invbox{background:#171410;border:2px solid #524639;border-radius:4px;padding:18px 20px;max-width:540px;width:90%}
  #invbox h2{font-size:16px;color:#c9b489;font-weight:400;letter-spacing:3px;margin-bottom:14px}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .slot{height:78px;border:1.5px dashed #3d352c;border-radius:3px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;color:#6d6355;font-size:11.5px;text-align:center;padding:4px;line-height:1.2}
  .slot.has{border-style:solid;border-color:#8a7a52;color:#e0d3b4;background:#221d16}
  .slot svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .slot.has svg{color:#d8c48e}
  #invbox .foot{margin-top:14px;color:#6d6355;font-size:12px;text-align:right}
  #toast{position:absolute;left:50%;top:84px;transform:translateX(-50%) translateY(-6px);color:#e8ddc8;
    background:rgba(20,17,13,.85);border-left:3px solid #8a7a52;padding:7px 14px;font-size:13.5px;
    opacity:0;transition:opacity .32s,transform .32s;max-width:70%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #vign{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(90,10,10,.6) 100%)}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;opacity:0;pointer-events:none;transition:opacity .7s ease}
  #title{display:none !important;visibility:hidden !important}
  #title.on{opacity:1;pointer-events:auto}
  #title .btn{width:260px;text-align:center;padding:13px 0;font-size:17px;letter-spacing:7px;
    background:none;border:none;color:#9d9179;transition:color .2s ease,letter-spacing .25s ease}
  #title .btn:hover{background:none;border:none;color:#f6ead0;letter-spacing:11px;text-shadow:0 0 18px rgba(220,200,150,.35)}
  #title .thint{position:absolute;bottom:26px;font-size:12px;color:#5f5748;letter-spacing:2px}
  #title .ver{position:absolute;top:18px;left:22px;font-size:11px;color:#4a443a;letter-spacing:2px}
  #pro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .8s ease}
  #pro.on{opacity:1;pointer-events:auto}
  #protext{max-width:680px;padding:0 44px;font-size:22px;line-height:2.15;color:#ded4bc;
    letter-spacing:2px;text-align:center;text-shadow:0 2px 10px #000}
  #prohint{position:absolute;bottom:40px;font-size:12px;color:#6a6252;letter-spacing:3px}
  /* ---------- 开发者模式 ---------- */
  #devp{position:fixed;left:0;top:0;bottom:0;width:392px;background:rgba(10,9,7,.96);
    border-right:1.5px solid #524639;padding:12px 14px 40px;overflow-y:auto;z-index:50;
    transform:translateX(-100%);transition:transform .22s ease;font-size:12px;color:#c8bda4;pointer-events:auto}
  #devp.on{transform:translateX(0)}
  #devp h3{font-size:12px;font-weight:400;color:#8fd8cf;letter-spacing:2px;margin:14px 0 7px;
    border-left:2px solid #3fd0c9;padding-left:7px}
  #devp h3:first-child{margin-top:2px}
  #devp .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  #devp button{font-family:inherit;font-size:11.5px;color:#d6cbb2;background:#1a1712;border:1px solid #3d352c;
    border-radius:2px;padding:6px 8px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #devp button:hover{background:#2a241d;border-color:#8a7a52}
  #devp button.hot{border-color:#e0705a;color:#f0c4b8}
  #devp .row{display:flex;align-items:center;gap:8px;margin:5px 0}
  #devp .row label{flex:0 0 52px;color:#8c8272}
  #devp input[type=range]{flex:1;accent-color:#3fd0c9}
  #devp .val{flex:0 0 46px;text-align:right;color:#e0d3b4;font-variant-numeric:tabular-nums}
  #devtag{position:fixed;left:calc(8px + var(--sal));top:calc(8px + var(--sat));z-index:60;font-size:11px;color:#5d5449;pointer-events:none}
  #devtag.on{color:#e0705a}
  #devpv{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:55;pointer-events:none;
    font-size:15px;color:#f0e4c8;background:rgba(20,17,13,.86);border:1.5px solid #8a7a52;border-radius:3px;
    padding:7px 18px;letter-spacing:2px;opacity:0;transition:opacity .2s}
  #devpv.on{opacity:1}
  #end{display:none !important;position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:26px;opacity:0;pointer-events:none;transition:opacity 1.6s ease;z-index:46;padding:0 24px}
  #end.on{opacity:1;pointer-events:auto}
  #end h1{font-size:32px;font-weight:400;letter-spacing:12px;color:#e8dcc0;text-indent:12px;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  #end ul{list-style:none;text-align:center;color:#9d9179;font-size:15px;line-height:2.2;letter-spacing:2px;
    font-family:"Kaiti SC",serif}
  #end .btn{width:220px;text-align:center;padding:12px 0;margin-top:10px}
  #pause{position:fixed;inset:0;background:rgba(4,4,3,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;
    transition:opacity .22s ease;z-index:48;padding:20px}
  #pause.on{opacity:1;pointer-events:auto}
  #pause .ph{font-size:13px;color:#6a6252;letter-spacing:6px;margin-bottom:18px}
  #pause .btn{width:250px;text-align:center;padding:12px 0;font-size:15px;letter-spacing:4px}
  #pset{display:none;flex-direction:column;gap:12px;margin-top:12px;width:300px}
  #pset.on{display:flex}
  #pset .row{display:flex;align-items:center;gap:10px;font-size:13px;color:#a99b80}
  #pset .row label{flex:0 0 84px}
  #pset input[type=range]{flex:1;accent-color:#3fd0c9}
  #pset input[type=checkbox]{width:16px;height:16px;accent-color:#3fd0c9}
  #pset .row span{flex:0 0 40px;text-align:right;color:#ded2b6;font-variant-numeric:tabular-nums}
  #pmsg{font-size:12px;color:#8fbf8f;height:16px;letter-spacing:2px}
  #dead{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:38px;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
  #dead.on{opacity:1;pointer-events:auto}
  #dead .t{font-size:34px;letter-spacing:10px;color:#ded6c4;font-family:"Kaiti SC","STKaiti","KaiTi",serif;
    text-indent:10px}
  #dead .btn{width:200px;text-align:center;padding:12px 0;font-size:15px;letter-spacing:4px;
  opacity:0;transition:opacity .8s ease .9s}
#dead.on .btn{opacity:1}
#dead .epi{font-size:13px;color:#6a625a;margin-top:9px;letter-spacing:.12em;font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  #dead .cause{margin-top:18px;font-size:15px;letter-spacing:2px;color:#8d8574;
  max-width:62vw;text-align:center;line-height:1.7;opacity:0;transition:opacity 1s ease .5s}
#dead.on .cause{opacity:1}
#dead .t{opacity:0;transition:opacity 1.1s ease .15s}
#dead.on .t{opacity:1}
  /* ---------- 主角对话框 ---------- */
  #proskip{position:absolute;right:26px;bottom:26px;z-index:5;background:none;border:1px solid #4a4132;
  border-radius:3px;color:#8d8574;font-family:inherit;font-size:13px;letter-spacing:3px;
  padding:9px 20px;cursor:pointer;pointer-events:auto;transition:color .2s,border-color .2s}
#proskip:hover{color:#f0e4c8;border-color:#8d8574}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:80;transition:opacity .7s ease}
#fade.on{opacity:1;pointer-events:auto}
#dlg{position:fixed;left:0;top:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .16s;
    max-width:min(46vw,520px)}
  #dlg.on{opacity:1}
  #dlgb{position:relative;background:rgba(236,230,214,.96);color:#241f18;border:2px solid #3a332a;
    border-radius:4px;padding:10px 14px;font-size:14.5px;line-height:1.62;letter-spacing:.6px;
    box-shadow:1.5px 2px 0 rgba(0,0,0,.45);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  #dlgb:after{content:'';position:absolute;left:26px;top:-11px;width:0;height:0;
    border:9px solid transparent;border-bottom-color:#3a332a}
  #dlgb:before{content:'';position:absolute;left:27.5px;top:-7.5px;width:0;height:0;
    border:7.5px solid transparent;border-bottom-color:rgba(236,230,214,.96);z-index:1}
  #dlg.who{color:#8a2b22}
  #dlgc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(168px + var(--sab));z-index:41;
    display:flex;flex-direction:column;gap:6px;align-items:stretch;pointer-events:auto;
    opacity:0;transition:opacity .18s}
  #dlgc:not(:empty){opacity:1}
  #dlgc button{min-width:280px}
  #dlgc button{font-family:"Kaiti SC",serif;font-size:15px;text-align:center;cursor:pointer;letter-spacing:1px;
    background:rgba(14,12,10,.86);color:#ded2b6;border:1px solid rgba(140,126,96,.55);border-radius:2px;padding:9px 16px;
    text-shadow:0 1px 6px #000;transition:color .15s,border-color .15s,background .15s}
  #dlgc button:hover{color:#fff3d6;border-color:#c9b489;background:rgba(40,34,26,.92)}
  #dlgc button:hover{background:rgba(58,48,36,.96);border-color:#c9b489}
  #dlgc button i{color:#8e8272;font-style:normal;margin-right:7px;font-size:12px}
  /* ---------- 底部内心字幕 ---------- */
  #sub .subline{line-height:1.55;margin-top:2px}
  #sub{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(7px);z-index:39;
    pointer-events:none;opacity:0;transition:opacity .5s ease,transform .5s ease;max-width:74vw;
    text-align:center;font-size:16.5px;line-height:1.7;letter-spacing:1.2px;color:#e2d8c0;
    text-shadow:0 2px 8px #000,0 0 22px rgba(0,0,0,.95);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  #sub.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #sub .em{color:#e0705a}

/* v1.1 视觉系统：界面、场景绘制和触屏分别管理。 */
/* Hidden overlay children must not intercept the live DOM menu. */
#san-label{color:#c4aa91;font:700 10px system-ui,sans-serif;letter-spacing:.08em}
#pause,#pro,#dead,#inv{visibility:hidden}
#pause.on,#pro.on,#dead.on,#inv.open{visibility:visible}
:root{color-scheme:dark;--panel:rgba(15,17,19,.88);--edge:rgba(192,178,149,.36);--cream:#ebe3d2;--muted:#a99e8b}
#hud{z-index:25}
#top{min-height:61px;padding:calc(9px + var(--sat)) calc(14px + var(--sar)) 9px calc(14px + var(--sal));
  background:linear-gradient(180deg,rgba(8,9,12,.94),rgba(10,11,13,.75));border-bottom:1px solid var(--edge);backdrop-filter:blur(8px);gap:12px}
#sanbox{height:11px;flex-basis:clamp(92px,13vw,156px);border-color:#7b6258;background:#231f20}
#sanbar{background:linear-gradient(90deg,#b75f53,#df8977)}
#clock{font-family:system-ui,sans-serif;font-size:17px;font-weight:650;letter-spacing:1px}
#sched{font-size:12px;color:#d1c5b2;max-width:37%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#locname{top:calc(74px + var(--sat));left:calc(15px + var(--sal));padding:6px 10px;background:var(--panel);border-left:2px solid #baa88b;color:var(--cream);border-radius:3px;max-width:57%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:rgba(20,23,25,.92);border:1px solid var(--edge);color:var(--cream);border-radius:7px;min-height:42px}
.btn:hover,.btn:focus-visible{border-color:#ddc89d;background:#2c2d2d}
#pausebtn{padding:6px 12px;font:600 12px system-ui,sans-serif;min-height:34px;letter-spacing:.1em;white-space:nowrap}
#bagbtn{padding:11px 16px;border-radius:8px;box-shadow:0 5px 18px #0007}
#prompt{bottom:calc(70px + var(--sab));width:max-content;max-width:min(88vw,560px);border-radius:8px;white-space:normal;text-align:center;line-height:1.45;background:var(--panel);backdrop-filter:blur(9px);box-shadow:0 5px 25px #0008}
#toast{top:calc(89px + var(--sat));max-width:min(86%,520px);border-radius:5px;background:rgba(14,16,18,.91);z-index:3}
#choices{bottom:calc(70px + var(--sab));z-index:3}
#choices .btn{max-width:min(86vw,340px);line-height:1.4}
#inv{z-index:45;backdrop-filter:blur(8px)}
#invbox{border-radius:12px;box-shadow:0 20px 80px #000b;max-height:calc(100dvh - 28px - var(--sat) - var(--sab));overflow:auto}
.invhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#invbox h2{margin:0}
#bag-close{min-width:44px;min-height:44px;color:var(--cream);background:#272726;border:1px solid var(--edge);border-radius:7px;font-size:24px;cursor:pointer}
#pause{overflow:auto;padding:calc(18px + var(--sat)) 18px calc(18px + var(--sab));backdrop-filter:blur(14px)}
#pause .btn{width:min(330px,90vw);flex-shrink:0;min-height:45px}
#pause .ph{margin-bottom:10px}
#pset{flex-shrink:0;max-width:90vw}
#dlg{max-width:min(460px,84vw)}
#dlgb{border-radius:8px;box-shadow:0 8px 30px #0007}
/* 选项多的时候（比如思索菜单有 8 条办法 + 再想想）必须能滚动，
   否则按钮会被顶出屏幕 —— 手机端"所有按钮消失"就是这个。
   注意：底部是锚点，加 max-height + overflow 才对。 */
  #dlgc{bottom:calc(100px + var(--sab));width:min(370px,calc(100vw - 32px));gap:8px;
    max-height:calc(100vh - 210px - var(--sat) - var(--sab));
    overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
    display:flex;flex-direction:column;padding:2px}
  #dlgc button{flex:0 0 auto}
  #grid .slot{position:relative}
  #grid .slot.sel{outline:2px solid #e0c489;outline-offset:-2px;background:rgba(74,62,44,.92)}
  #grid .slot .drop{position:absolute;right:2px;top:2px;width:19px;height:19px;min-height:0;padding:0;
    border-radius:4px;border:1px solid rgba(200,120,100,.55);background:rgba(48,24,20,.9);
    color:#e8b9a8;font:600 10px/16px system-ui,sans-serif;cursor:pointer}
  #grid .slot .drop:hover{background:rgba(96,40,32,.95);color:#fff}
  #bagnote{font-size:11px;color:#a99b83;text-align:center;letter-spacing:.04em;margin-top:4px}
#dlgc button{min-width:unset;width:100%;min-height:44px;border-radius:6px}
#pro{z-index:44;background:rgba(7,8,10,.76);padding:calc(20px + var(--sat)) 12px calc(20px + var(--sab))}
#protext{font-size:clamp(18px,3.2vw,25px);line-height:1.9;max-width:620px;padding:0 16px}
#proskip{position:absolute;right:calc(17px + var(--sar));bottom:calc(18px + var(--sab));z-index:4;min-height:44px;border-radius:6px}
#prohint{bottom:calc(85px + var(--sab))}
#menuUI{position:fixed;inset:0;z-index:34;display:none;pointer-events:none;align-items:flex-end;justify-content:center;padding:0 16px calc(9vh + var(--sab))}
#menuUI.on{display:flex;pointer-events:auto}
#menu-panel{width:min(420px,93vw);max-height:calc(100vh - 40px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:16px 16px 14px;background:linear-gradient(155deg,rgba(24,27,31,.96),rgba(9,10,13,.97));border:1.5px solid rgba(212,190,145,.42);border-radius:14px;box-shadow:0 18px 70px #000c,0 0 0 1px #0008 inset;backdrop-filter:blur(18px)}
#menu-subtitle{font:600 12px system-ui,sans-serif;letter-spacing:.55em;color:#e0c489;text-align:center;margin:2px 0 12px;text-shadow:0 1px 6px #000}
#menu-items{display:flex;flex-direction:column;gap:9px}
.menu-choice{width:100%;min-height:56px;padding:11px 16px 11px 46px;position:relative;background:linear-gradient(180deg,rgba(58,58,56,.62),rgba(34,34,34,.62));border:1.5px solid rgba(205,186,146,.40);border-radius:9px;color:var(--cream);text-align:center;font:500 17px 'Kaiti SC','KaiTi',serif;cursor:pointer;touch-action:manipulation}
.menu-choice small{display:block;margin-top:4px;font:400 11.5px system-ui,sans-serif;color:#c2b298;letter-spacing:0;line-height:1.4}
.menu-choice::before{content:'';position:absolute;left:17px;top:50%;width:9px;height:9px;margin-top:-4.5px;
    border:1.6px solid rgba(216,196,150,.75);transform:rotate(45deg);transition:background .15s,border-color .15s}
  .menu-choice:hover::before,.menu-choice:focus-visible::before,.menu-choice.selected::before{background:#e8cd93;border-color:#e8cd93}

/* ---------- Flashback: independent state with explicit cancellation and palette restoration ---------- */
var FLASH={ t:0, dur:0, cool:0, pending:0, active:false };
var FLASHBLOOM={ t:0 };
function flashPalette(ordinary){
  if(BW===!ordinary) return;
  BW=!ordinary;
  buildOutdoor();
  for(var id in INTERIORS) INTERIORS[id].baked=false;
  if(S.room && INTERIORS[S.room]) buildInterior(S.room);
  dropCache();
}
function flashAllowed(){
  if (typeof FN!=='undefined' && FN && FN.on) return false;   // 假正常期间不闪回表世界
  return S.screen==='play' && !S.dead && !S.death && !RT.end &&
    !PAUSE.on && !MAPV.on && !(DLG && DLG.open);
}
function flashBack(dur){
  dur=clamp(Number(dur)||0.7,0.15,3);
  if(!flashAllowed()) return false;
  if(TR.on){ FLASH.pending=Math.max(FLASH.pending,dur); return false; }
  if(FLASH.active){ FLASH.t=Math.max(FLASH.t,dur); FLASH.dur=Math.max(FLASH.dur,dur); return true; }
  if(FLASH.cool>0) return false;
  FLASH.active=true; FLASH.t=FLASH.dur=dur; FLASH.pending=0;
  FLASHBLOOM.t=0.45;
  flashPalette(true); SFX.blink();
  return true;
}
function flashEnd(){
  if(!FLASH.active) return;
  FLASH.active=false; FLASH.t=FLASH.dur=0;
  flashPalette(false);
}
function flashForceEnd(){
  FLASH.pending=0; FLASHBLOOM.t=0;
  if(FLASH.active) flashEnd();
}
function flashUpdate(dt){
  if(FLASH.cool>0) FLASH.cool=Math.max(0,FLASH.cool-dt);
  if(FLASH.active){
    if(!flashAllowed()){ flashForceEnd(); return; }
    FLASH.t-=dt;
    if(FLASH.t<=0) flashEnd();
    return;
  }
  if(FLASH.pending && !TR.on && flashAllowed()){
    var d=FLASH.pending; FLASH.pending=0;
    if(FLASH.cool<=0) flashBack(d);
  }
  if(FLASH.cool>0 || !flashAllowed() || TR.on) return;
  if(S.san<20 && Math.random()<dt*0.06) flashBack(0.42);
}
function drawFlashBloom(){
  if(!FLASH.active || FLASHBLOOM.t<=0) return;
  var ctx=C, a=clamp(FLASHBLOOM.t/0.45,0,1);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(255,248,226,'+(a*a*0.20)+')';ctx.fillRect(0,0,MW,MH);
  ctx.restore();
}

  for(r=H1+2;r<=rows-2;r++){ s=blank('.'); s[0]='#'; s[cols-1]='#'; g.push(s.join('')); }

/* ---------- 食堂：大餐厅 + 打饭窗口 + 后厨 ---------- */
function genCanteen(){
  /* 原来的 36×16 太小、太挤。放大到 62×28（≈3 倍面积），
     分三段：前厅（餐桌）→ 打饭窗口 → 后厨 + 冷库 + 洗手间。 */
  var W=62,H=28,g=[],r,c,s;
  function blank(ch){ var a=[]; for(c=0;c<W;c++) a.push(ch); return a; }
  for(r=0;r<H;r++){
    s=blank('.');
    if(r===0||r===H-1){ g.push(blank('#').join('')); continue; }
    s[0]='#'; s[W-1]='#';
    /* 前厅：1–16 行，四列一组长桌，中间留两条主通道 */
    if(r>=2&&r<=16&&r%3!==0){ for(c=3;c<W-4;c+=5) s[c]='t'; }
    /* 打饭窗口：18–19 行 */
    if(r===18||r===19){ for(c=1;c<W-1;c++) s[c]='k'; }
    /* 后厨：21–26 行 */
    if(r>=21&&r<=26){ for(c=1;c<W-1;c++) if((r+c)%4===0) s[c]='k'; }
    if(r>=21&&r<=26){ s[W-3]='v'; s[W-4]='v'; s[W-5]='v'; }   // 冷库货架
    g.push(s.join(''));
  }
  /* 后厨西头隔出洗手间（3 格宽） */
  for(r=21;r<=26;r++){ var b=g[r].split(''); b[3]='#'; b[1]='B'; b[2]='B'; g[r]=b.join(''); }
  s=g[23].split(''); s[4]='='; g[23]=s.join('');
  /* 大门开在西墙（食堂入口朝西） */
  s=g[9].split(''); s[0]='O'; s[1]='O'; g[9]=s.join('');
  return g;
}
/* ---------- 宿舍：一排排上下铺 + 东头盥洗室 ---------- */
function genDorm(fl){
  var W=44,H=16,g=[],r,c,s;
  function blank(ch){ var a=[]; for(c=0;c<W;c++) a.push(ch); return a; }
  g.push(blank('#').join(''));
  for(r=1;r<=10;r++){
    s=blank('.'); s[0]='#'; s[W-1]='#';
    if(r%3!==0){ for(c=2;c<=W-11;c+=3) s[c]='b'; }                    // 上下铺：三格一张，留出过道
    g.push(s.join(''));
  }
  for(r=1;r<=10;r++){ var a=g[r].split(''); a[W-9]='#';              // 盥洗室隔墙
    if(r>=3&&r<=9&&r%2===1){ a[W-5]='w'; a[W-6]='w'; a[W-7]='w'; }    // 一排龙头
    g[r]=a.join(''); }
  s=g[5].split(''); s[W-10]='='; g[5]=s.join('');
  // 西头再隔一间厕所
  for(r=1;r<=10;r++){ var b2=g[r].split(''); b2[5]='#'; b2[1]='B'; b2[2]='B'; b2[3]='B'; b2[4]='B'; g[r]=b2.join(''); }
  s=g[3].split(''); s[6]='='; g[3]=s.join('');
  for(r=11;r<=14;r++){ s=blank('.'); s[0]='#'; s[W-1]='#'; g.push(s.join('')); }
  var st=g[13].split(''); st[W-3]='S'; st[W-2]='S'; g[13]=st.join('');
  s=blank('#'); s[21]='O'; s[22]='O'; g.push(s.join(''));
  return g;
}
/* ---------- 教学楼天台 ---------- */
function genRoof(){
  var W=30,H=18,g=[],r,c,s;
  function blank(ch){ var a=[]; for(c=0;c<W;c++) a.push(ch); return a; }
  for(r=0;r<H;r++){
    if(r===0||r===H-1){ g.push(blank('#').join('')); continue; }
    s=blank('.'); s[0]='#'; s[W-1]='#';
    g.push(s.join(''));
  }
  // 水箱、空调外机、通风管
  s=g[2].split(''); for(c=5;c<=9;c++) s[c]='R'; g[2]=s.join('');
  s=g[3].split(''); s[5]='R'; s[9]='R'; g[3]=s.join('');
  s=g[6].split(''); for(c=18;c<=21;c++) s[c]='v'; g[6]=s.join('');
  s=g[12].split(''); for(c=4;c<=7;c++) s[c]='v'; g[12]=s.join('');
  s=g[15].split(''); for(c=20;c<=25;c++) s[c]='v'; g[15]=s.join('');
  // 楼梯口
  s=g[H-2].split(''); s[14]='S'; s[15]='S'; g[H-2]=s.join('');
  return g;
}
function genLab(fl, furn, name, linkL, linkM){
  var cols=50, rows=20, g=[], r, c, s, k, room, off, H1=rows-10;   // 走廊加宽到 6 行，东端 4 格给连廊大厅
  function blank(ch){ var a=[]; for(c=0;c<cols;c++) a.push(ch); return a; }
  g.push(blank('#').join(''));
  for(r=1;r<=H1;r++){
    s=blank('.'); s[0]='#'; s[cols-1]='#';
    for(c=46;c<=48;c++) s[c]='.';                 // 东端连廊大厅（46–48），贯通南北
    for(k=0;k<5;k++){
      room=[2+k*9, 8+k*9];
      s[room[0]-1]='#'; s[room[1]+1]='#';
      for(c=room[0];c<=room[1];c++){
        off=c-room[0];
        if (r===1) s[c]=(off===3)?'T':'.';                       // 讲台
        else if (furn==='n'){ if (r>=2&&r<=7&&r%2===0&&off%2===1) s[c]='n'; }   // 计算机教室：隔位摆，留出走道
        else if (furn==='p'){ if (r===3&&off===3) s[c]='p'; else if (r>=5&&r<=7&&off%2===0) s[c]='t'; }
        else if (furn==='x'){ if (r===2&&off===3) s[c]='x'; else if ((off===0||off===6)&&r>1) s[c]='v'; }
        else { if ((off===0||off===6)&&r>1&&r%2===0) s[c]=furn; else if (off===3&&r===Math.floor(H1/2)) s[c]=furn; }
      }
    }
    g.push(s.join(''));
  }
  s=blank('#'); for(k=0;k<5;k++) s[4+k*9]='='; s[46]='='; s[47]='='; g.push(s.join(''));
  // 先把走廊和最后两行都推到 g 里，再往上面放楼梯和连廊口
  for(r=H1+2;r<=rows-2;r++){ s=blank('.'); s[0]='#'; s[cols-1]='#'; g.push(s.join('')); }
  if (fl===1){ s=blank('#'); s[22]='O'; s[23]='O'; s[24]='O'; g.push(s.join('')); }
  else g.push(blank('#').join(''));
  while (g.length < rows) g.push(blank('#').join(''));
  for(r=H1+2;r<=rows-2;r++){ var a2=g[r].split(''); a2[42]='S'; a2[43]='S'; g[r]=a2.join(''); }
  /* 连廊口：北墙（第 0 行）通行政楼，南墙（最后一行）通教学楼。两处都在东端。 */
  /* 连廊口统一 3 格宽（原来 1 格 = 9 世界单位，玩家碰撞直径就 10 多，等于侧身挤过去） */
  /* 连廊口统一开在东端大厅正中（宽 4 格），而不是挤在教室角落 */
  if (linkM){ var a4=g[0].split(''); for(var mw=0;mw<=2;mw++) a4[46+mw]='M'; g[0]=a4.join(''); }
  if (linkL){ var a3=g[rows-1].split(''); for(var lw=0;lw<=2;lw++) a3[46+lw]='L'; g[rows-1]=a3.join(''); }
  if (fl===1){ s=blank('#'); s[22]='O'; s[23]='O'; s[24]='O'; g.push(s.join('')); }
  else g.push(blank('#').join(''));
  return g;
}

/* ---------- 场地线稿 ----------
   球场的白线、田径场的跑道分道线。全部烘进 G.polys，逐帧零开销。
   坐标一律用 V5 图纸坐标，函数内部乘 SC。 */
function arcPts(cx,cy,rx,ry,a0,a1,n){
  var out=[], i;
  for(i=0;i<=n;i++){ var a=a0+(a1-a0)*(i/n); out.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
  return out;
}
var CLL='rgba(242,238,226,0.78)';      // 球场白线
var CLL2='rgba(242,238,226,0.50)';     // 次要线
function lineS(x1,y1,x2,y2,seed,w){
  addShape('stroke', [[x1*SC,y1*SC],[x2*SC,y2*SC]], 0.8, seed, { c:CLL, w:w||2.6 });
}
/* 注意：rectPts(x,y,w,h,step) 的第 5 个参数是步长，不是圆角半径。传 0 会死循环。 */
function rectS(x,y,ww,hh,seed,w){
  addShape('stroke', rectPts(x*SC,y*SC,ww*SC,hh*SC,11*SC), 0.8, seed, { c:CLL, w:w||2.6 });
}
function roundS(cx,cy,rx,ry,seed,w){
  addShape('stroke', ellPts(cx*SC,cy*SC,rx*SC,ry*SC,30), 0.8, seed, { c:CLL, w:w||2.6 });
}
function arcS(cx,cy,rx,ry,a0,a1,seed,w){
  addShape('stroke', arcPts(cx*SC,cy*SC,rx*SC,ry*SC,a0,a1,22), 0.8, seed, { c:CLL, w:w||2.6 });
}
/* ---------- 篮球场 ---------- */
function basketballArt(x,y,w,h,seed){
  var cx=x+w*0.5, cy=y+h*0.5;
  var inX=x+5, inY=y+5, inW=w-10, inH=h-10;
  rectS(inX,inY,inW,inH,seed,3.0);
  lineS(cx,inY,cx,inY+inH,seed+1,3.0);                       // 中线
  roundS(cx,cy,15,15,seed+2,2.8);                            // 中圈
  var laneW=34, laneH=44;
  for(var e=0;e<2;e++){
    var top = (e===0);
    var ly = top ? inY : inY+inH-laneH;
    rectS(cx-laneW*0.5, ly, laneW, laneH, seed+3+e*10, 2.8);   // 罚球区
    roundS(cx, top ? ly+laneH : ly, 12, 12, seed+5+e*10, 2.4); // 罚球圈
    /* 三分弧：以篮筐为圆心 */
    var hoopY = top ? inY+3 : inY+inH-3;
    var a0 = top ? 0 : Math.PI;
    arcS(cx, hoopY, 42, 34, top?0:Math.PI, top?Math.PI:TAU, seed+7+e*10, 2.6);
    /* 篮筐 + 篮板 */
    addShape('stroke', [[(cx-7)*SC,hoopY*SC],[(cx+7)*SC,hoopY*SC]], 0.6, seed+9+e*10, { c:'rgba(230,120,90,0.9)', w:4.0 });
    roundS(cx, top ? hoopY+6 : hoopY-6, 4.5, 4.5, seed+11+e*10, 2.2);
  }
}
/* ---------- 羽毛球场（并排 n 块） ---------- */
function badmintonArt(x,y,w,h,n,seed){
  var cw=w/n;
  for(var c=0;c<n;c++){
    var x0=x+c*cw+3, y0=y+3, w0=cw-6, h0=h-6;
    var mx=x0+w0*0.5;
    rectS(x0,y0,w0,h0,seed+c*20,2.6);
    lineS(mx,y0,mx,y0+h0,seed+c*20+1,2.2);                    // 中线
    var netY=y0+h0*0.5;

    lineS(x0,y0+h0*0.16,x0+w0,y0+h0*0.16,seed+c*20+3,1.8);    // 前发球线

function buildInterior(id){
  var R=INTERIORS[id];
  if (!R || R.baked) return R;
  var tw=R.tw, th=R.th;
  R.walls=[]; R.desks=[]; R.misc=[]; R.doors=[];
  var runs={}, y, x, ch, x0;
  for(y=0;y<R.rows;y++){
    x=0;
    while(x<R.cols){
      ch=R.grid[y][x]; x0=x;
      while(x<R.cols && R.grid[y][x]===ch) x++;
      var wx=R.ox+x0*tw, wy=R.oy+y*th, ww=(x-x0)*tw;
      if (ch==='#') R.walls.push({x:wx,y:wy,w:ww,h:th});
      else if (ch==='d'||ch==='P'){
        for(var k=x0;k<x;k++){
          var dx=R.ox+k*tw;
          R.desks.push({ x:dx+1.4, y:wy+1.4, w:tw-2.8, h:th-3.0, seat:(ch==='P'), chair:wy+th-1.0 });
        }
      }
      else if (ch==='=') R.doors.push({x:wx+tw*0.5, y:wy+th*0.5, w:ww, h:th, x0:wx, y0:wy, vert:(ww<th)});
      else if (MISCMAP[ch]) R.misc.push({k:MISCMAP[ch], x:wx, y:wy, w:ww, h:th, ch:ch});
    }
  }
  for(var i=0;i<R.walls.length;i++){ var wl=R.walls[i];
    wl.v=bake(rectPts(wl.x,wl.y,wl.w,wl.h,Math.max(5,tw*0.8)),0.8,3000+i*3); }
  for(i=0;i<R.misc.length;i++){ var mi=R.misc[i];
    mi.v=bake(rectPts(mi.x,mi.y,mi.w,mi.h,Math.max(5,tw*0.8)),0.8,4000+i*3); }
  // 黑板 + 窗
  R.boards=[]; R.windows=[];
  var rm=R.rooms;
  if (rm){ for(i=0;i<rm.length;i++){
    R.boards.push({ x:R.ox+rm[i][0]*tw, y:R.oy+1*th-2.0, w:(rm[i][1]-rm[i][0]+1)*tw, h:4.0 }); } }
  for(y=0;y<R.rows;y+=1){
    if (R.grid[y][0]==='#' && y>0 && y<R.rows-1) R.windows.push({ x:R.ox, y:R.oy+y*th+th*0.28, w:tw, h:th*0.44, vert:1 });
    if (R.grid[y][R.cols-1]==='#' && y>0 && y<R.rows-1) R.windows.push({ x:R.ox+(R.cols-1)*tw, y:R.oy+y*th+th*0.28, w:tw, h:th*0.44, vert:1 });
  }
  /* 教室陈设：日光灯 / 吊扇 / 后墙挂钟 / 黑板报 */
  R.lamps=[]; R.fans=[]; R.clocks=[]; R.corner=[];
  if (rm){ for(i=0;i<rm.length;i++){ var c0=rm[i][0], c1=rm[i][1], cw=(c1-c0+1)*tw;
    R.lamps.push({ x:R.ox+c0*tw+cw*0.30, y:R.oy+4.4*th, w:tw*1.7, h:th*0.30 });
    R.lamps.push({ x:R.ox+c0*tw+cw*0.72, y:R.oy+4.4*th, w:tw*1.7, h:th*0.30 });
    R.lamps.push({ x:R.ox+c0*tw+cw*0.30, y:R.oy+9.4*th, w:tw*1.7, h:th*0.30 });
    R.lamps.push({ x:R.ox+c0*tw+cw*0.72, y:R.oy+9.4*th, w:tw*1.7, h:th*0.30 });
    R.fans.push({ x:R.ox+c0*tw+cw*0.5, y:R.oy+3.0*th, r:th*1.5 });
    R.fans.push({ x:R.ox+c0*tw+cw*0.5, y:R.oy+8.4*th, r:th*1.5 });
    R.clocks.push({ x:R.ox+c1*tw+tw*0.35, y:R.oy+1.5*th, r:th*0.38 });
    R.corner.push({ x:R.ox+c0*tw+tw*0.6, y:R.oy+13.4*th, w:cw-tw*1.2, h:th*0.55 });
  } }
  R.floorPoly=bake(rectPts(R.ox+tw,R.oy+th,(R.cols-2)*tw,(R.rows-2)*th,tw),1.2,2999);
  R.baked=true; dropCache();
  return R;
}

/* ============================ 等级缓存（静态底图 + 遮挡网格） ============================ */
function dropCache(){ BASE.key=''; OCC.key=''; }
function levelBounds(){
  if (S.mode==='out') return [200*SC, 50*SC, 770*SC, 1330*SC];
  var R=INTERIORS[S.room];
  return [R.ox-30, R.oy-30, R.ox+R.w+30, R.oy+R.h+30];
}
function isSolidPt(wx,wy){
  if (S.mode==='out') return solidOutdoor(wx,wy,0.1);
  return SOLID[tileAt(INTERIORS[S.room],wx,wy)]===1;
}
function buildLevel(){
  var b=levelBounds(), minX=b[0], minY=b[1], maxX=b[2], maxY=b[3];
  var lk=S.mode+'|'+(S.room||'')+'|'+(BW?1:0);
  if (OCC.key!==lk){
    var cell=OCC.cell;
    OCC.x0=minX; OCC.y0=minY;
    OCC.gw=Math.max(1,Math.ceil((maxX-minX)/cell));
    OCC.gh=Math.max(1,Math.ceil((maxY-minY)/cell));
    OCC.data=new Uint8Array(OCC.gw*OCC.gh);
    for(var gy=0;gy<OCC.gh;gy++) for(var gx=0;gx<OCC.gw;gx++){
      OCC.data[gy*OCC.gw+gx] = isSolidPt(minX+(gx+0.5)*cell, minY+(gy+0.5)*cell) ? 1 : 0;
    }
    OCC.key=lk;
  }
  var bk=lk+'|'+needWhere(S.tsec);
  if (BASE.key!==bk){
    var w=Math.max(1,Math.ceil(maxX-minX)), h=Math.max(1,Math.ceil(maxY-minY));
    if (!BASE.cv){ BASE.cv=document.createElement('canvas'); BASE.cx=BASE.cv.getContext('2d'); }
    try{ BASE.cv.width=w; BASE.cv.height=h; }catch(e){ BASE.key=lk; return; }
    BASE.x=minX; BASE.y=minY; BASE.w=w; BASE.h=h;
    var cx=BASE.cx, ob=boil; boil=0;
    cx.setTransform(1,0,0,1,-minX,-minY);
    cx.lineCap='round'; cx.lineJoin='round';
    cx.clearRect(minX,minY,w,h);
    if (S.mode==='out') drawOutdoorTo(cx);
    else drawInteriorTo(cx, INTERIORS[S.room]);
    boil=ob;
    BASE.key=bk;
  }
}
function occIdx(gx,gy){ if(gx<0||gy<0||gx>=OCC.gw||gy>=OCC.gh) return 1; return OCC.data[gy*OCC.gw+gx]; }
function castRay(x,y,ang,maxD){
  var dx=Math.cos(ang), dy=Math.sin(ang), cell=OCC.cell;
  var gx=Math.floor((x-OCC.x0)/cell), gy=Math.floor((y-OCC.y0)/cell);
  var sx=dx>0?1:-1, sy=dy>0?1:-1;
  var tmx = dx!==0 ? ((OCC.x0+(gx+(dx>0?1:0))*cell)-x)/dx : 1e9;
  var tmy = dy!==0 ? ((OCC.y0+(gy+(dy>0?1:0))*cell)-y)/dy : 1e9;
  var tdx = dx!==0 ? Math.abs(cell/dx) : 1e9;
  var tdy = dy!==0 ? Math.abs(cell/dy) : 1e9;
  var t=0, guard=0;
  while (guard++ < 512){
    if (tmx < tmy){ t=tmx; gx+=sx; tmx+=tdx; } else { t=tmy; gy+=sy; tmy+=tdy; }
    if (t > maxD) return maxD;
    if (t >= 0 && occIdx(gx,gy)) return t;
  }
  return maxD;
}
/* 自适应画质：低端机自动降射线数 / 羽化 / 粒子 / 分辨率。不插帧、不堆后处理。 */
var Q={ level:2, ft:16.7, slow:0, fast:0, rays:200, feather:true, parts:1, dprCap:2, fpCols:240 };
function qApply(){
  if (Q.level>=2){ Q.rays=200; Q.feather=true;  Q.parts=1;    Q.dprCap=2;   Q.fpCols=240; }
  else if (Q.level===1){ Q.rays=112; Q.feather=true;  Q.parts=0.6;  Q.dprCap=1.5; Q.fpCols=150; }
  else { Q.rays=64; Q.feather=false; Q.parts=0.35; Q.dprCap=1.25; Q.fpCols=96; }
  VIS.n=Q.rays;
}
function qSample(dt){
  Q.ft += ((dt*1000)-Q.ft)*0.06;
  if (Q.ft>23){ Q.slow++; Q.fast=0; } else if (Q.ft<15){ Q.fast++; Q.slow=0; } else { Q.slow=0; Q.fast=0; }
  if (Q.slow>90 && Q.level>0){ Q.level--; qApply(); resize(); Q.slow=0; toast('画质自动降到 '+Q.level); }

  /* 广播点名：一圈圈声波，中间浮出名字 */

      var f=((t*0.9+i/N)%1);
      var rr=f*Math.max(w,h)*0.75;

      ctx.lineWidth=(1.4+f*3.2)*DPR;

  /* 钟敲十三下：钟摆 + 一道道声波 */

  /* 说出一个名字：一排脸一起转过来 */
  names:function(ctx,w,h,k,t){

    var e=clamp(k*1.15,0,1), n=6;

      var fw=Math.min(w,h)*0.062*e, fh=fw*1.34;

      ctx.beginPath(); ctx.ellipse(cx,cy,fw,fh,0,0,TAU); ctx.fill();

      ctx.beginPath(); ctx.ellipse(cx-off+look*fw*0.18,cy-fh*0.12,fw*0.15,fh*0.07,0,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+off+look*fw*0.18,cy-fh*0.12,fw*0.15,fh*0.07,0,0,TAU); ctx.fill();

  squeeze:function(ctx,w,h,k,t){

    ctx.fillStyle='rgba(8,8,10,0.99)';

    ctx.fillStyle='rgba(0,0,0,'+(q*0.35)+')'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(160,154,142,'+(0.25+q*0.5)+')'; ctx.lineWidth=2*DPR;

  },
  /* 冷库：冰从边缘长进来 */
  freeze:function(ctx,w,h,k,t){
    ctx.fillStyle='rgba(206,224,236,'+(k*k*0.42)+')'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(0,0,0,'+(k*0.30)+')'; ctx.fillRect(0,0,w,h);
    var n=18;
    for(var i=0;i<n;i++){
      var s1=hash2(i,3,11), s2=hash2(i,7,5);
      var side=Math.floor(s1*4), px,py,ang;
      if (side===0){ px=w*s2; py=0; ang=Math.PI/2; }
      else if (side===1){ px=w; py=h*s2; ang=Math.PI; }
      else if (side===2){ px=w*s2; py=h; ang=-Math.PI/2; }
      else { px=0; py=h*s2; ang=0; }

  slit:function(ctx,w,h,k,t){

    ctx.fillStyle='rgba(0,0,0,0.98)';
    ctx.fillRect(0,0,w*0.5-half,h);
    ctx.fillRect(w*0.5+half,0,w*0.5-half+2,h);
    var g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'rgba(0,0,0,'+(k*0.5)+')'); g.addColorStop(1,'rgba(0,0,0,'+(k*0.5)+')');

    /* E8 全体回头：一圈眼睛同时睁开，全部看向中心 */
    stare:function(ctx,w,h,k,t){
      var q=clamp(k,0,1), i;
      ctx.save();
      ctx.fillStyle='rgba(6,7,9,'+(0.5*q)+')'; ctx.fillRect(0,0,w,h);
      var N=13, cx=w*0.5, cy=h*0.46, R=Math.min(w,h)*(0.20+q*0.30);
      for(i=0;i<N;i++){
        var a=-Math.PI/2 + i/N*Math.PI*2;
        var ex=cx+Math.cos(a)*R, ey=cy+Math.sin(a)*R*0.72;
        var er=(5+q*11)*(1+0.08*Math.sin(t*7+i));
        ctx.fillStyle='rgba(226,230,234,'+(0.30+q*0.66)+')';
        ctx.beginPath(); ctx.ellipse(ex,ey,er,er*0.66,0,0,6.2832); ctx.fill();
        ctx.fillStyle='#08090b';
        ctx.beginPath(); ctx.arc(ex,ey,er*0.42,0,6.2832); ctx.fill();
      }
      ctx.restore();
    },
    /* E21 天台的第二个你：远处一个背影，慢慢转过来 */
    twin:function(ctx,w,h,k,t){
      var q=clamp(k,0,1);
      ctx.save();
      var cx=w*0.5, base=h*0.80, sc=Math.min(w,h)*0.30*(0.7+q*0.6);
      var turn=clamp((q-0.45)/0.5,0,1);
      ctx.globalAlpha=0.25+q*0.75;
      ctx.fillStyle='#0d0e10';
      ctx.beginPath();
      ctx.moveTo(cx-sc*0.30, base); ctx.lineTo(cx-sc*0.22, base-sc*1.35);
      ctx.lineTo(cx+sc*0.22, base-sc*1.35); ctx.lineTo(cx+sc*0.30, base);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(cx, base-sc*1.58, sc*0.26, 0, 6.2832); ctx.fill();
      if (turn>0){
        ctx.strokeStyle='rgba(232,236,240,'+(turn*0.85)+')';
        ctx.lineWidth=Math.max(1,sc*0.035);
        ctx.beginPath(); ctx.moveTo(cx-sc*0.12, base-sc*1.62); ctx.lineTo(cx+sc*0.12, base-sc*1.54); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-sc*0.10, base-sc*1.66); ctx.lineTo(cx+sc*0.10, base-sc*1.66); ctx.stroke();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle='rgba(0,0,0,'+(0.7*q)+')'; ctx.fillRect(0,0,w,h);
      ctx.restore();
    },
    /* E22 熄灯后的走廊灯：一排灯扫过来，最后停在正中 */
    lamps:function(ctx,w,h,k,t){
      var q=clamp(k,0,1), i;
      ctx.save();
      ctx.fillStyle='rgba(4,5,7,'+(0.86*q)+')'; ctx.fillRect(0,0,w,h);
      var N=7;
      for(i=0;i<N;i++){
        var ph=(t*0.75 + i*0.13)%1.0;
        var lx=w*(0.06+0.88*(i/(N-1)));
        var on=clamp(1-Math.abs(ph-0.5)*2.6,0,1);
        if (i===Math.floor(N/2) && q>0.55) on=clamp((q-0.55)/0.35,0,1);
        if (on<=0.01) continue;
        var rad=Math.min(w,h)*(0.10+0.26*on)*(0.6+q*0.5);
        var g=ctx.createRadialGradient(lx,h*0.34,0,lx,h*0.34,rad);
        g.addColorStop(0,'rgba(246,240,214,'+(0.80*on)+')');
        g.addColorStop(0.5,'rgba(228,214,168,'+(0.28*on)+')');
        g.addColorStop(1,'rgba(228,214,168,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lx,h*0.34,rad,0,6.2832); ctx.fill();
        ctx.fillStyle='rgba(252,248,232,'+(0.9*on)+')';
        ctx.beginPath(); ctx.ellipse(lx,h*0.18,rad*0.20,rad*0.07,0,0,6.2832); ctx.fill();
      }
      ctx.fillStyle='rgba(0,0,0,'+(0.55*q)+')'; ctx.fillRect(0,0,w,h);
      ctx.restore();
    },
  };
/* 死因 → 动画 */
var DFX_MAP={
  'rain':'drown','moth':'swarm','turn':'gaze','broad':'voice','bell13':'bell',
  'exercise':'follow','bells':'shatter','hand':'hand','feast':'deep','necker':'face',
  'leak':'water','shadow':'shadow','rite':'ring','name':'names','laugh':'laugh',
  'viol':'grip','trap_out':'slit','trap_wall':'squeeze','trap_beg':'face','beast':'deep',
  /* 下面这几条本身不致命，但万一以后改了，也有对应的演出 */
  'repeat':'gaze','chalk':'vignette','loop':'vignette','roster':'vignette',

   /* 设计清单 E8 / E21 / E22 */
   'stare':'stare','twin':'twin','lamps':'lamps'
   };
DFX.follow=function(ctx,w,h,k,t){        /* 做操：画面跟着一起转 */
  var q=k*k;
  ctx.save(); ctx.translate(w*0.5,h*0.5); ctx.rotate(Math.sin(q*9)*0.20*q);
  ctx.fillStyle='rgba(0,0,0,'+(q*0.70)+')'; ctx.fillRect(-w,-h,w*2,h*2);
  ctx.restore();
  /* 一模一样的剪影排成行 */
  if (q>0.25){
    var e=(q-0.25)/0.75, n=7;
    ctx.fillStyle='rgba(0,0,0,'+(0.55*e)+')';
    for(var i=0;i<n;i++){
      var cx=w*(i+0.5)/n, cy=h*(0.55+0.06*Math.sin(t*2+i));
      ctx.beginPath(); ctx.arc(cx,cy-h*0.10,w*0.018*e,0,TAU); ctx.fill();
      ctx.fillRect(cx-w*0.020*e, cy-h*0.085, w*0.040*e, h*0.16*e);
    }
  }
};
function kill(msg, fx){
  flashForceEnd();
  if (S.dead||S.death) return;
  if (DEV.on&&DEV.inv) return;
  S.dead=msg; S.deadT=0;
  DEADSEQ.t=0; DEADSEQ.done=false; DEADSEQ.msg=msg;
  DEADSEQ.kind = fx || DEADSEQ.autoKind || 'vignette';
  DEADSEQ.autoKind=null;
  /* 每类死法一个音效 —— 原来不管怎么死都是同一声 */
  try{ SFX[DFX_SFX[DEADSEQ.kind] || DFX_SFX.default](); }catch(e){}
}
function deadSeqTick(dt){
  if (!S.dead || S.death) return;
  if (DEADSEQ.done) return;
  DEADSEQ.t += dt;
  S.deadT = DEADSEQ.t;
  if (DEADSEQ.t >= DEADSEQ.dur){ DEADSEQ.done=true; showDead(); }
}
function killViol(){
  if (S.dead||S.death) return;
  if (DEV.on&&DEV.inv) return;
  if (Math.random()<0.5){ kill('违规太多，有人在暗处把你按住了。','grip'); return; }   // 暴毙：无动画
  DEADSEQ.kind='deep'; S.death={ kind:'floor', t:0 };
  SHAKE.t=0; SHAKE.mag=0;
  SFX.crack();
}
function deathUpdate(dt){
  if (!S.death) return;
  var d=S.death; d.t+=dt;
  if (d.kind==='floor'){
    if (d.t>0.30 && d.t<1.35){ SHAKE.mag=Math.min(6, (d.t-0.30)*5); SHAKE.t+=dt; }
    if (d.t>1.9){ S.dead='地板合上了。'; S.death=null; SFX.blink();
      DEADSEQ.t=1.2; DEADSEQ.done=false; DEADSEQ.msg=S.dead; S.deadT=1.2; }   // 动画已经播过一半，接上后半段
  } else {
    if (Math.abs(d.t-0.72)<0.06){ SHAKE.mag=16; }
    if (d.t>1.5){ S.dead='墙把你压在了下面。'; DEADSEQ.kind='grip'; S.death=null; SFX.blink();
      DEADSEQ.t=1.2; DEADSEQ.done=false; DEADSEQ.msg=S.dead; S.deadT=1.2; }
  }
  SHAKE.mag*=0.90; SHAKE.t+=dt;
}
function drawDeath(){
  if (!S.death) return;
  var d=S.death, t=d.t, ctx=C;
  ctx.setTransform(1,0,0,1,0,0);
  if (d.kind==='floor'){
    var open = t<0.30 ? smooth(t/0.30) : (t<1.35?1:(t<1.9?smooth(1-(t-1.35)/0.55):0));
    var px=(S.x-cam.x)*cam.z*DPR+MW/2, py=(S.y-cam.y)*cam.z*DPR+MH/2;
    var rr=6*DPR+open*96*DPR;
    var g=ctx.createRadialGradient(px,py,0,px,py,rr);
    g.addColorStop(0,'rgba(0,0,0,'+(0.9*open)+')');
    g.addColorStop(0.72,'rgba(10,6,4,'+(0.92*open)+')');
    g.addColorStop(1,'rgba(10,6,4,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(px,py,rr,rr*0.62,0,0,TAU); ctx.fill();
    // 裂口边缘
    ctx.strokeStyle='rgba(0,0,0,'+(0.85*open)+')'; ctx.lineWidth=3*DPR;
    for(var i=0;i<12;i++){
      var a=i/12*TAU+hash2(i,1,9)*0.4, L=rr*(0.9+hash2(i,2,9)*0.5);
      ctx.beginPath(); ctx.moveTo(px+Math.cos(a)*rr*0.7, py+Math.sin(a)*rr*0.45);
      ctx.lineTo(px+Math.cos(a)*L, py+Math.sin(a)*L*0.66); ctx.stroke();
    }
  } else {
    var px2=(S.x-cam.x)*cam.z*DPR+MW/2, py2=(S.y-cam.y)*cam.z*DPR+MH/2;
    var p = t<0.35 ? 0 : (t<0.72 ? smooth((t-0.35)/0.37) : 1);
    var sx = px2 + (1-p)*260*DPR - (t>0.72?0:0);
    if (t<0.72){
      ctx.save(); ctx.translate(sx, py2-40*DPR); ctx.rotate(-0.22+p*0.22);
      ctx.fillStyle='rgba(28,26,24,0.96)';
      ctx.fillRect(-150*DPR,-70*DPR,300*DPR,140*DPR);
      ctx.strokeStyle='rgba(120,110,96,0.7)'; ctx.lineWidth=2*DPR;
      ctx.strokeRect(-150*DPR,-70*DPR,300*DPR,140*DPR);
      ctx.restore();
    }
    if (t>=0.72){
      var k=clamp((t-0.72)/0.5,0,1);
      ctx.fillStyle='rgba(0,0,0,'+(0.45*k)+')'; ctx.fillRect(0,0,MW,MH);
      ctx.fillStyle='rgba(150,20,16,'+(0.72*k)+')';
      ctx.beginPath(); ctx.ellipse(px2,py2, 20*DPR+k*70*DPR, 14*DPR+k*50*DPR, 0.4, 0, TAU); ctx.fill();
      ctx.strokeStyle='rgba(220,40,30,'+(0.5*k)+')'; ctx.lineWidth=3*DPR;
      for(var j=0;j<10;j++){ var a2=hash2(j,4,3)*TAU, L2=(30+hash2(j,5,3)*90)*DPR*k;
        ctx.beginPath(); ctx.moveTo(px2,py2); ctx.lineTo(px2+Math.cos(a2)*L2, py2+Math.sin(a2)*L2); ctx.stroke(); }
    }
  }
}

/* ============================ 输入 ============================ */
var K={};
function anyKey(){ auInit(); auResume(); }
addEventListener('keydown', function(e){
  anyKey();
  var k=e.key.toLowerCase();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
  /* ★ 移动键必须在所有守卫之前记下来。
     原来 K[k]=true 写在几十行之后，而「对话框开着」那条守卫会直接 return ——
     于是按 H 打开思索之后，移动键永远记不上，人就动不了。 */
  K[k]=true;
  if (RT.end){ if(k==='enter'||k===' '||k==='escape') endClick(null,null,true); return; }
  if (S.screen==='pro'){ if (k===' '||k==='enter') proNext(); return; }
  if (S.screen==='title'){
    try{ var L=titleItems().length; }catch(e){ return; }
    if (k==='arrowdown'||k==='s'){ TITLE.sel=(TITLE.sel+1+L)%L; menuSelect(); SFX.ui(); return; }
    if (k==='arrowup'||k==='w'){ TITLE.sel=(TITLE.sel-1+L)%L; menuSelect(); SFX.ui(); return; }
    /* 数字键直选：三项菜单直接按 1 / 2 / 3 —— 比上下键快，也更容易被发现 */
    if (k>='1' && k<='9'){
      var di=parseInt(k,10)-1;
      if (di<L){ TITLE.sel=di; menuSelect(); ensureAudio(); titlePick(di); }
      return;
    }
    if (k==='escape'&&TITLE.mode!=='main'){ TITLE.mode='main'; TITLE.sel=0; menuSelect(); return; }
    if (k==='enter'||k===' ') { ensureAudio(); titlePick(TITLE.sel<0?0:TITLE.sel); return; }
    return;
  }
  if ((S.dead||S.death) && (k==='r'||k==='enter')){ location.reload(); return; }
  if (S.dead||S.death) return;
  if (k==='escape'){
    if(DLG.open) dlgClose();
    else if(elInv.classList.contains('open')) toggleBag();
    else if(MAPV.on) mapToggle();
    else if(PAUSE.on) pauseClose(); else pauseOpen();
    return;
  }
  if(PAUSE.on) return;
  if(DLG.open){
    if (k>='1'&&k<='9'){ pickChoice(+k-1); return; }
    /* 按 H 打开的就按 H 关掉 —— 原来只能用 Esc，而且没有任何提示 */
    if (k==='h' && THINKING){ THINKING=false; dlgClose(); os('我：先不想了。',2.4); return; }
    return;
  }
  if(MAPV.on){ if(k==='m') mapToggle(); else if(k==='n') mapMark(); return; }
  if(elInv.classList.contains('open')){
    /* 背包开着的时候：方向键 / WASD 换格子，1-8 直接用，G 丢掉选中的那一格 */
    if (k==='b'||k==='escape') { toggleBag(); return; }
    if (k==='arrowright'||k==='d'){ bagSel(Math.min(BAG_MAX-1, BAGSEL+1)); SFX.ui(); return; }
    if (k==='arrowleft' ||k==='a'){ bagSel(Math.max(0, BAGSEL-1)); SFX.ui(); return; }
    if (k==='arrowdown' ||k==='s'){ bagSel(Math.min(BAG_MAX-1, BAGSEL+4)); SFX.ui(); return; }
    if (k==='arrowup'   ||k==='w'){ bagSel(Math.max(0, BAGSEL-4)); SFX.ui(); return; }
    if (k==='g'){ throwSelected(); return; }
    if (k>='1'&&k<='8'){ bagSel(+k-1); if(useItem(+k-1)) renderBag(); return; }
    return;
  }
  K[k]=true;
  if (k==='e') tryInteract(e.shiftKey);
  if (k==='b'){ TUT.sawB=true; toggleBag(); return; }
  if (k==='r' && DEV.on) doFlip();
  if (k==='v'){ if (S.screen==='play' && !S.dead && !RT.end){ TUT.sawV=true; VIEW.fp=!VIEW.fp; SFX.ui();
    os(VIEW.fp?'我：把眼睛抬起来看。':'我：低头看路。',2.6); } return; }
  if (k==='m'){ mapToggle(); return; }
  if (k==='n') return;
  if (k>='1' && k<='8'){ if (useItem(+k-1)) renderBag(); return; }
  if (k==='h'){ thinkOpen(); return; }
  /* F：地上有东西就捡起来，没有就把背包里选中的那件放下。
     "拿"和"放"是一个键，E 是"用" —— 两条线不再打架。 */
  if (k==='f'){ tryPickup(); return; }
  /* G：只丢背包里当前选中的那一格。原来是"丢第一件"，玩家根本不知道会丢什么。 */

  var R=INTERIORS[S.room], t=tileAt(R,S.x,S.y);
  if (t==='S'){
    var f=down?R.floor-1:R.floor+1;
    if (f>=1 && INTERIORS[R.host+f]){ SFX.stair(); go('stair',0.34,function(){ gotoFloor(R.host,f); }); }
    else toast(down?'到底了。':'上面还没做。');
    return;
  }
  if (t==='L'||t==='M'){ return; }
  if (t==='O'){ return; }
    /* 自己的抽屉必须排在"坐下"前面 —— 否则站在自己座位上按 E 只会坐下，翻不出作业本 */
    var _hr = (S.mode==='in' && S.room) ? INTERIORS[S.room] : null;
    var _tx = _hr ? Math.floor((S.x-_hr.ox)/_hr.tw) : -99;
    var _ty = _hr ? Math.floor((S.y-_hr.oy)/_hr.th) : -99;
    /* 任何一张课桌、柜子、实验台都能翻 */
    DESK._tx=_tx; DESK._ty=_ty;
    if (t==='l' && MAT>0){ doExperiment(); return; }
    if (t==='d' || t==='f' || t==='l'){ searchDesk(t==='l' ? 'lab' : 'desk'); return; }
  if (t==='P'){ S.seated=!S.seated; SFX.ui(); toast(S.seated?'你坐下了。':'你站了起来。'); return; }
  if (t==='B'){ toast(isThirdStall(S.room,S.x,S.y)?'第三个隔间。这里似乎有动静。':'男厕。'); return; }
  if (t==='G'){ toast('女厕。'); return; }
  var near=nearbyFurniture(R);
  if (!near) return;
  if (near.ch==='R'){ searchShelf(); return; }
  if (near.ch==='c'){ useCar(carAt(near.x,near.y)); return; }
  if (near.ch==='D'){ if(S.room==='lab3') useTerminal(); else if(S.room==='admin3') useData(); return; }
  if (near.ch==='X'){ useTrash(); return; }
  if (near.ch==='p'){ playPiano(); actStart('piano'); return; }
  if (near.ch==='n'){ actStart('computer'); return; }
  if (near.ch==='b'){ actStart('sleep'); return; }
  /* ---- 下面这些原来一个分支都没有，站过去按 E 毫无反应 ----
     行政楼整层的柜子、实验楼的器材/陈列架/桌子都是摆设，就是这个原因。 */
  if (near.ch==='f'){ openCabinet(near); return; }        // 行政楼柜子
  if (near.ch==='d'){ openDrawer(near); return; }         // 课桌抽屉
  if (near.ch==='t'){ openDrawer(near); return; }         // 音乐教室的桌子
  if (near.ch==='v'){ searchRack(near); return; }         // 地理陈列架
  if (near.ch==='l'){ if (MAT>0) doExperiment(); else searchDesk('lab'); return; }   // 实验台
  if (near.ch==='q'){ doPhysics(); return; }              // 物理器材
  if (near.ch==='w'){ useBasin(); return; }               // 盥洗盆
  if (near.ch==='x'){ readGlobe(); return; }              // 地球仪
}
function gotoFloor(host,f){
  var id=host+f, R=INTERIORS[id]; if(!R) return;
  buildInterior(id); S.room=id; S.seated=false;
  var p=findTileIn(id,'S');
  var c = p ? tileCenter(R, R.ox+(p[0]+0.5)*R.tw, R.oy+(p[1]+0.5)*R.th)
            : tileCenter(R, R.ox+R.w/2, R.oy+R.h/2);
  S.x=c[0]; S.y=c[1]; S.enterCool=1.2; dropCache();
  describe(id);
}
function enterRoom(id){
  if (!INTERIORS[id]){ toast('（这栋楼还没做）'); return; }
  buildInterior(id);
  var R=INTERIORS[id], o=objById(R.host), door=doorOf(o);
  S.mode='in'; S.room=id;
  var c=tileCenter(R, door?door[0]:R.ox+R.w/2, R.oy+16.5*R.th);
  S.x=c[0]; S.y=c[1]; S.enterCool=1.4; dropCache();
  describe(id);
}
function exitRoom(){
  var R=INTERIORS[S.room]; if(!R){ S.mode='out'; S.room=null; return; }   // 房间数据缺失也要能出来，不能卡死
  var o=objById(R.host), door=doorOf(o); if(!door) return;
  S.mode='out'; S.room=null; S.seated=false;
  S.x = door[0] + door[2]*32;
  S.y = door[1] + door[3]*32;
  S.enterCool = 1.6;
  dropCache(); describe('OUT');
}

var ART={

        roof:'#535862',edge:'#7e848b',roof2:'#414850',glass:'#96a8af',line:'#c7c9c3',accent:'#bb6455',

        roof:'#e9d3ba',edge:'#896e5b',roof2:'#cfbda6',glass:'#9dc6d2',line:'#f6f2df',accent:'#bf5142',
        wall:'#e1c4aa',floor:'#e7dbc2',floor2:'#ede1c9',corridor:'#d8ceb9',desk:'#b28e6c',trim:'#6b5b4e',ink:'#3a312c',paper:'#f3e9d2',tree:'#67925f'}

function art(){return BW?ART.dark:ART.day;}
function aRound(ctx,x,y,w,h,r,fill,stroke,sw){

  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();

function aLine(ctx,col,width,x0,y0,x1,y1){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineWidth=width;ctx.strokeStyle=col;ctx.stroke();}

function aTexture(ctx,x,y,w,h,step,seed,alpha){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle=BW?'#d6d4c9':'#695a43';ctx.globalAlpha=alpha;
  var ex=Math.min(x+w,x+2000),ey=Math.min(y+h,y+3000);

function aBuilding(ctx,o,A){
  var x=o.x,y=o.y,w=o.w,h=o.h;

  ctx.fillStyle='rgba(0,0,0,'+(BW?.40:.14)+')';ctx.fillRect(x+9,y+12,w+7,h+8);
  ctx.fillStyle=A.ink;ctx.fillRect(x+5,y+6,w,h+3);

  // Vents / stairwell / skylights, arranged from physical building dimensions.
  var num=Math.max(2,Math.floor(w/29)),winH=Math.max(5,Math.min(10,h*.20));

    aLine(ctx,A.edge,.6,px+3,y+10,px+3,y+10+winH);

    for(n=0;n<num;n++)aRound(ctx,x+13+n*(w-26)/num,sy,Math.max(6,(w-34)/num-8),6,1,A.roof2,A.trim,.7);
  }

  }
  if(o.id==='bell'){
    aRound(ctx,x+w*.20,y+6,w*.60,h-12,1,A.roof2,A.edge,1);
    aEll(ctx,x+w*.5,y+h*.49,Math.min(w,h)*.19,Math.min(w,h)*.19,A.paper);
    aLine(ctx,A.ink,1,x+w*.5,y+h*.49,x+w*.54,y+h*.36);

function drawOutdoorTo(ctx){

function aFurniture(ctx,m,A){

function drawInteriorTo(ctx,R){

  /* 天台上的东西单独画：水箱 / 空调外机 / 通风管。

    var tp=twinPos();

function drawAccentParts(ctx,a,alpha){

function drawPlayer(){
  var ctx=C, a=S.ang, spd=S.sprinting?1.5:1.0;
  var sw=S.moving?Math.sin(S.walkPhase)*2.6*spd:0;
  var bob=S.moving?Math.abs(Math.sin(S.walkPhase))*1.1*spd:Math.sin(S.walkPhase)*0.7;
  var sinkK=0;
  if (S.death && S.death.kind==='floor'){
    var dtt=S.death.t;
    sinkK = dtt<0.30 ? 0 : (dtt<1.35 ? smooth((dtt-0.30)/1.05) : 1);
  }
  ctx.save(); ctx.translate(S.x, S.y + sinkK*22);
  if (sinkK>0){ ctx.scale(1-0.62*sinkK, 1-0.62*sinkK); ctx.rotate(2.4*sinkK); }
  ctx.beginPath(); ctx.ellipse(0,2.4,6.6,3.6,0,0,TAU);
  ctx.fillStyle=BW?'rgba(0,0,0,.45)':'rgba(40,30,20,.22)'; ctx.fill();
  ctx.rotate(a+Math.PI/2); ctx.translate(0,-bob);
  drawBody(ctx, sw, 0, 0, 0);
  ctx.restore();
}
/* 人的身体。调用前必须已经 translate 到脚下、rotate(a+PI/2)、translate(0,-bob)。
   本地坐标里 -Y 是【正前方】。
   turn  0 = 背对（看到后脑勺，全是头发）　1 = 正面（看得到脸）
   mouth 张嘴程度 0..1 */
function drawBody(ctx, sw, bob, turn, mouth){
  // 鞋
  ctx.fillStyle=P('hair');
  ctx.beginPath(); ctx.ellipse(-2.0+sw*0.45, 5.4+sw, 2.1, 1.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 2.0-sw*0.45, 5.4-sw, 2.1, 1.5, 0, 0, TAU); ctx.fill();
  // 腿
  ctx.strokeStyle=P('cloth'); ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-1.9,0.8); ctx.lineTo(-1.9+sw*0.5,4.9+sw*0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1.9,0.8);  ctx.lineTo(1.9-sw*0.5,4.9-sw*0.9); ctx.stroke();
  // 书包
  ctx.beginPath(); ctx.ellipse(0,2.4,3.9,3.2,0,0,TAU); ctx.fillStyle=P('pack'); ctx.fill();
  ctx.strokeStyle=P('hair'); ctx.lineWidth=1.1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.6,0.4); ctx.lineTo(2.6,0.4); ctx.stroke();
  // 肩 + 校服（白衬衫领）
  ctx.beginPath(); ctx.ellipse(0,-0.2,4.9,5.8,0,0,TAU); ctx.fillStyle=P('cloth'); ctx.fill();
  ctx.strokeStyle=P('hair'); ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.4,-3.4); ctx.lineTo(0,0.4); ctx.lineTo(2.4,-3.4);
  ctx.strokeStyle=BW?'rgba(200,200,200,.55)':'rgba(245,242,232,.75)'; ctx.lineWidth=1.8; ctx.stroke();
  // 手臂
  ctx.strokeStyle=P('cloth'); ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(-4.2,-0.8); ctx.lineTo(-5.0+sw*0.35, 2.0-sw*0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 4.2,-0.8); ctx.lineTo( 5.0-sw*0.35, 2.0+sw*0.7); ctx.stroke();
  ctx.fillStyle=P('skin');
  ctx.beginPath(); ctx.arc(-5.0+sw*0.35, 2.0-sw*0.7, 1.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 5.0-sw*0.35, 2.0+sw*0.7, 1.3, 0, TAU); ctx.fill();
  // 脖子 + 头
  ctx.fillStyle=P('skin');
  ctx.beginPath(); ctx.ellipse(0,-3.0,1.7,1.4,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-5.4,3.5,3.8,0,0,TAU); ctx.fill();
  ctx.strokeStyle=P('hair'); ctx.lineWidth=1.5; ctx.stroke();
  // 头发：背对时在正面（看到后脑勺），转过来时翻到背面
  var hairA0 = turn>0 ? Math.PI*0.02 : Math.PI*1.02;
  var hairA1 = turn>0 ? Math.PI*0.98 : Math.PI*1.98;
  ctx.beginPath(); ctx.ellipse(0,-6.0,3.5,2.9,0,hairA0,hairA1);
  ctx.strokeStyle=P('hair'); ctx.lineWidth=2.6; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,-4.6,3.3,3.4,0,Math.PI*0.15,Math.PI*0.85);
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.2; ctx.stroke();
  /* 正面才画脸：眼睛 + 嘴 */
  if (turn > 0){
    ctx.fillStyle='rgba(20,18,16,.85)';
    ctx.beginPath(); ctx.ellipse(-1.35, -6.0, 0.62, 0.78, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 1.35, -6.0, 0.62, 0.78, 0, 0, TAU); ctx.fill();
    if (mouth > 0.01){
      ctx.fillStyle='rgba(14,12,11,.82)';
      ctx.beginPath(); ctx.ellipse(0, -4.15, 0.85, 0.30 + 1.15*mouth, 0, 0, TAU); ctx.fill();
    }
  }
}
/* ============================ SAN 引导 ============================
   SAN 低了主角会自己想起"该去哪儿缓一缓"，并且报出最近的那个地方。
   越难受说得越急；同一个地方不会连着念。 */
var SANSPOTS=[
  { k:'piano',    x:560, y:700,  n:'实验楼五楼的音乐教室', d:'去弹会儿琴' },
  { k:'computer', x:560, y:700,  n:'实验楼三楼的计算机教室', d:'去机房坐一会儿' },
  { k:'sleep',    x:552, y:1115, n:'宿舍',                 d:'回宿舍躺一会儿' },
  { k:'eat',      x:600, y:1160, n:'食堂',                 d:'去食堂吃点东西' },
  { k:'jog',      x:515, y:530,  n:'大操场',               d:'去操场跑两圈' },
  { k:'hoop',     x:500, y:300,  n:'篮球场',               d:'去打会儿球' },
  { k:'wash',     x:500, y:900,  n:'洗手间',               d:'去洗把脸' }
];
var GUIDE={ t:18, last:'', lvl:0 };
/* 什么时候"适合"想起这件事：
   —— 站定不动一会儿（不是在赶路）
   —— 没有异象在发生（心不慌的时候才想得起别的）
   —— 不在高危区（那种地方只想赶紧出去）
   —— 不是在教室里上课（上课说这个太出戏）
   —— 天还亮着/或者已经在室内躲好了 */
function guideMoment(){
  if (AN.cur) return false;
  if (S.moving) return false;
  if ((S.idle||0) < 2.2) return false;
  if (dangerAt()) return false;
  if (ACT.on) return false;
  if (S.mode==='in' && inClassroom()>=0 && needWhere(S.tsec)==='教室') return false;
  return true;
}
function guideTick(dt){
  if (S.screen!=='play' || S.dead || S.death || RT.end) return;
  GUIDE.t -= dt;
  if (GUIDE.t>0) return;
  if (!guideMoment()) return;                          // 时机不对就再等等
  if (ACT.on) return;                                  // 已经在放松了，别催
  var san=S.san, want = san<18 ? 3 : (san<30 ? 2 : (san<42 ? 1 : 0));
  if (want===0){ GUIDE.lvl=0; return; }
  /* 找最近的那个地方 */
  var best=null, bd=1e18;
  for(var i=0;i<SANSPOTS.length;i++){
    var sp=SANSPOTS[i];
    var dx=S.x-sp.x*SC, dy=S.y-sp.y*SC, d2=dx*dx+dy*dy;
    if (d2<bd){ bd=d2; best=sp; }
  }
  if (!best) return;
  if (best.k===GUIDE.last && want<=GUIDE.lvl){ GUIDE.t=8; return; }   // 同一个地方别连念
  if ((GUIDE.n||0) >= 6 && want<3){ GUIDE.t=30; return; }   // 说够了就闭嘴，除非真的撑不住
  GUIDE.last=best.k; GUIDE.lvl=want;
  GUIDE.n=(GUIDE.n||0)+1;
  if (want>=3) GUIDE.t=26;
  GUIDE.t = want>=3 ? 14 : (want===2 ? 22 : 34);
  if (want>=3)      os('我：不行了。我得找个地方缓一缓 —— '+best.d+'。', 6.0);
  else if (want===2) os('我：头很沉。……'+best.n+'。'+best.d+'吧。', 5.6);
  else              os('我：有点撑不住了。要不要'+best.d+'？', 5.0);
}
/* ============================ 高危区 ============================
   有些地方本来就不该去：地下车库、垃圾房、熄灯后的室外。
   在里面 SAN 掉得快、异象来得勤，车库还有一个会动的东西。 */
var DANGER={
  garage: { n:'地下车库', san:0.55, an:2.2, roam:true },
  trash:  { n:'垃圾房',   san:0.40, an:1.8, roam:false },
  night:  { n:'熄灯后的校园', san:0.30, an:1.6, roam:false }
};
function dangerAt(){
  if (S.mode==='in'){
    if (S.room==='garage1') return 'garage';
    if (S.room==='trash1')  return 'trash';
    return null;
  }
  if (isNight()) return 'night';
  return null;
}
/* 车库里游荡的东西：只在你视线之外移动，靠近就出事 */
var ROAM={ on:false, x:0, y:0, vx:0, vy:0, cd:0, seen:0 };
function roamReset(){
  var R=INTERIORS['garage1']; if(!R) return;
  ROAM.x=R.ox+R.w*0.86; ROAM.y=R.oy+R.h*0.5;
  ROAM.vx=ROAM.vy=0; ROAM.cd=3.5; ROAM.on=true; ROAM.seen=0; ROAM.told=0; ROAM.seen2=0; ROAM.lit=false;
}
/* 光能定住它：手电筒或手机屏幕照着，而且它在你正前方 ±60° 内 */
function roamLit(){
  if (!(USE.torch || USE.phone)) return false;
  var dx=ROAM.x-S.x, dy=ROAM.y-S.y, d2=dx*dx+dy*dy;
  if (d2 > 260*260) return false;
  var a=Math.atan2(dy,dx);
  var diff=Math.abs(((a-S.ang+Math.PI*3)%(Math.PI*2))-Math.PI);
  return diff < Math.PI/3;
}
function roamTick(dt){
  var dg=dangerAt();
  if (dg!=='garage' || !INTERIORS['garage1']){ ROAM.on=false; return; }
  if (!ROAM.on) roamReset();
  var R=INTERIORS['garage1'];
  ROAM.cd-=dt;

  }
  var ddx=S.x-ROAM.x, ddy=S.y-ROAM.y;
  var dist=Math.sqrt(ddx*ddx+ddy*ddy);

var BALL={ on:false, t:0, x0:0,y0:0, x1:0,y1:0, hit:0, score:0, miss:0 };
function actMotion(dt){
  if (!ACT.on) return;
  var R=INTERIORS[S.room];
  /* ---- 跑步：沿椭圆移动 ---- */
  if (ACT.kind==='jog'){
    var T=INTERIORS['__track__'];
    /* 小跑道：中心 (500,827)，半径 95×42（V5 坐标），世界坐标要乘 SC */
    var cx=500*SC, cy=827*SC, rx=95*SC, ry=42*SC;
    if (ACT.jogA===undefined){

      ACT.laps=0;
    }
    var spd=0.62;                      // 弧度/秒：一圈约 10 秒
    var prev=ACT.jogA;
    ACT.jogA += dt*spd;
    if (Math.floor(ACT.jogA/TAU) > Math.floor(prev/TAU)) ACT.laps=(ACT.laps||0)+1;
    S.x = cx + Math.cos(ACT.jogA)*rx;
    S.y = cy + Math.sin(ACT.jogA)*ry;
    /* 朝向 = 切线方向 */
    S.ang = Math.atan2(Math.cos(ACT.jogA)*ry, -Math.sin(ACT.jogA)*rx);
    S.moving=true; S.walkPhase += dt*7.5;

    if (ACT.laps && !ACT.lapSaid){
      ACT.lapSaid=true;
      os('我：……一圈。',2.6);
      setTimeout(function(){ if(ACT.on&&ACT.kind==='jog') os('我：操场上只有我一个人的脚印。',4.4); },1800);
    }
    return;
  }
  /* ---- 投篮：站到篮下，反复起跳出手 ---- */
  if (ACT.kind==='hoop'){
    /* 先把玩家挪到篮筐前面一点 */
    var bx=500*SC, by=300*SC;          // 篮球场（V5 500,300）
    if (!ACT.hoopPlaced){

      ACT.jump=0; ACT.cool=0.9; BALL.score=0; BALL.miss=0;
    }
    ACT.cool-=dt;
    if (ACT.cool<=0){

      if (jt>0.30 && !ACT.thrown){

        BALL.x0=S.x; BALL.y0=S.y;
        var good = Math.random() < (0.35 + (100-S.san)/300);   // SAN 越低越准，越不正常
        BALL.hit = good ? 1 : 0;
        BALL.x1 = bx + (good?0:(Math.random()-0.5)*90*SC);
        BALL.y1 = by + (good?0:(Math.random()-0.5)*40*SC);
        if (good){ BALL.score++; } else { BALL.miss++; }

      if (jt>0.95){ ACT.jump=0; ACT.thrown=false; S.bob=0; }
    }

    AN.next -= dt*2.6;

  }

function fpCast(x,y,ang,maxD){
  var R = (S.mode==='in') ? INTERIORS[S.room] : null;

  if (R){ gx=R.ox; gy=R.oy; cell=R.tw; gw=R.cols; gh=R.rows; }
  else { gx=OCC.x0; gy=OCC.y0; cell=OCC.cell; gw=OCC.gw; gh=OCC.gh; }
  FPH.ch='#'; FPH.u=0; FPH.side=0; FPH.tileW=cell;
  var rx=Math.cos(ang), ry=Math.sin(ang);
  var mx=Math.floor((x-gx)/cell), my=Math.floor((y-gy)/cell);

  if (ry<0){ stepY=-1; sdy=((y-gy)-my*cell)/cell*ddy; } else { stepY=1; sdy=(((my+1)*cell)-(y-gy))/cell*ddy; }

function fpCeilingLamps(){

  var fx=-ry, fy=rx;
  var tanHalf=Math.tan(FOV*0.5);

    for(var tx=2; tx<R.cols-1; tx+=step){

      var dx=wx-S.x, dy=wy-S.y;

/* 把贴地的形状真正"印"在地上：把每个顶点投到地面平面，用多边形填充。

function fpGroundPolyN(pts, m, col){
  var ctx=C, W2=MW, H2=MH;
  var tanHalf=Math.tan(FOV*0.5);
  var rx=Math.cos(S.ang), ry=Math.sin(S.ang);
  var fx=-ry, fy=rx;
  var eyeH=12, EPS=3, n=0, i;
  for(i=0;i<m;i++){
    var j=(i+1)%m;
    var a0x=pts[i*2]-S.x, a0y=pts[i*2+1]-S.y;
    var b0x=pts[j*2]-S.x, b0y=pts[j*2+1]-S.y;
    var a0=a0x*rx+a0y*ry, b0=b0x*rx+b0y*ry;
    var a1=a0x*fx+a0y*fy, b1=b0x*fx+b0y*fy;
    var ain=a0>=EPS, bin=b0>=EPS;
    if (ain){ CF1[n]=a0; CS1[n]=a1; n++; }
    if (ain!==bin && n<10){ var t=(EPS-a0)/(b0-a0); CF1[n]=EPS; CS1[n]=a1+(b1-a1)*t; n++; }
  }
  if (n<3) return 0;
  ctx.beginPath();
  for(i=0;i<n;i++){
    var fwd=CF1[i];
    var sxp = W2*0.5 + (CS1[i]/fwd)*(W2*0.5)/tanHalf;
    var syp = H2*0.5 + (eyeH/fwd)*(W2*0.5)/tanHalf;
    if (i===0) ctx.moveTo(sxp,syp); else ctx.lineTo(sxp,syp);
  }

  if (col){ ctx.fillStyle=col; ctx.fill(); }

function fpGroundPoly(pts, col, close){

  var fx=-ry, fy=rx;
  var eyeH=12, EPS=3;
  var n=0, i;
  var m=pts.length>>1;
  for(i=0;i<m;i++){
    var j=(i+1)%m;
    var a0x=pts[i*2]-S.x, a0y=pts[i*2+1]-S.y;
    var b0x=pts[j*2]-S.x, b0y=pts[j*2+1]-S.y;
    var a0=a0x*rx+a0y*ry, b0=b0x*rx+b0y*ry;
    var a1=a0x*fx+a0y*fy, b1=b0x*fx+b0y*fy;
    var ain=a0>=EPS, bin=b0>=EPS;
    if (ain){ CF1[n]=a0; CS1[n]=a1; n++; }
    if (ain!==bin && n<10){
      var t=(EPS-a0)/(b0-a0);
      CF1[n]=EPS; CS1[n]=a1+(b1-a1)*t; n++;
    }
  }
  if (n<3) return 0;
  ctx.beginPath();
  for(i=0;i<n;i++){
    var fwd=CF1[i];
    var sxp = W2*0.5 + (CS1[i]/fwd)*(W2*0.5)/tanHalf;

function fpAccents(){

    /* 距离太远/太近就不画 */
    var dx0=cx0-S.x, dy0=cy0-S.y;
    var fwd0=dx0*Math.cos(S.ang)+dy0*Math.sin(S.ang);
    if (fwd0<14 || fwd0>420) continue;
    /* 用形状自己的顶点，投到地面平面上按多边形填 —— 真正印在地上 */
    var src=(a.parts && a.parts[0] && a.parts[0].pts) ? a.parts[0].pts : null;
    if (src && src.length>=3){
      if (src.length*2 > GQA.length){ /* 顶点太多就退回圆形 */ }
      else {
        for(var vi=0; vi<src.length; vi++){ GQA[vi*2]=src[vi][0]; GQA[vi*2+1]=src[vi][1]; }

        fpGroundPoly(GQA, 'rgba(190,46,38,0.55)');

        ctx.save();

      var aa=k/N*TAU;
      GQA[k*2]=cx0+Math.cos(aa)*rr;
      GQA[k*2+1]=cy0+Math.sin(aa)*rr;
    }
    ctx.save(); fpGroundPoly(GQA, 'rgba(190,46,38,0.5)'); ctx.restore();
  }

function fpGroundQuad(x0,y0,x1,y1,col){

  }

/* 把一块地面上的东西（祭坛之类）投到屏幕上：返回 [x,y,缩放] 或 null */
function fpGroundPoint(wx,wy){

/* ---------- 三维盒子：按物体的真实朝向投影，不再永远正对镜头 ---------- */
var CF1=new Float32Array(12), CS1=new Float32Array(12), CU1=new Float32Array(12);
var OF1=new Float32Array(12), OS1=new Float32Array(12), OU1=new Float32Array(12);
function fpQuad(col, camx, camy, eyeH, rx, ry, tanHalf, W2, H2){
  /* 四点已展开成 3 组坐标传进来太啰嗦，这里改成：调用方先填 CF1/CS1/CU1，本函数只负责裁切+画 */
  var n=0, i;
  for(i=0;i<4;i++){
    var a0=CF1[i], a1=CS1[i], a2=CU1[i];
    var j=(i+1)%4;
    var b0=CF1[j], b1=CS1[j], b2=CU1[j];
    var ain=a0>=4, bin=b0>=4;
    if (ain){ OF1[n]=a0; OS1[n]=a1; OU1[n]=a2; n++; }
    if (ain!==bin){
      var t=(4-a0)/(b0-a0);
      OF1[n]=4; OS1[n]=a1+(b1-a1)*t; OU1[n]=a2+(b2-a2)*t; n++;
    }
    if (n>=8) break;
  }
  if (n<3) return 0;
  var ctx=C;
  ctx.beginPath();
  for(i=0;i<n;i++){
    var fwd=OF1[i];
    var sxp = W2*0.5 + (OS1[i]/fwd)*(W2*0.5)/tanHalf;
    var syp = H2*0.5 + ((eyeH-OU1[i])/fwd)*(W2*0.5)/tanHalf;
    if (i===0) ctx.moveTo(sxp,syp); else ctx.lineTo(sxp,syp);
  }
  ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
  return 1;
}
/* 把一个轴对齐的长方体画出来：顶面 + 可见侧面 */
/* 家具的四个侧面 / 顶面用到的常量，预先算好，循环里不再建数组 */
var BOX_NX=[-1, 1, 0, 0], BOX_NY=[0, 0, 1, -1];
var BOX_AX=[0,1,1,0], BOX_AY=[0,0,1,1], BOX_BX=[0,1,1,0], BOX_BY=[1,1,0,0];
function fpBox(x0,y0,x1,y1,H, baseCol, rx, ry, fx2, fy2, tanHalf, W2, H2, eyeH){
  var camx=S.x, camy=S.y;
  var i, q;
  var xs=[x0,x1,x1,x0], ys=[y0,y0,y1,y1];
  for(i=0;i<4;i++){
    /* 侧面 i 是第 i 条竖边 -> 相邻两条竖边之间那块面
       这里用「边」的法线判断：面在 i 与 i+1 之间，法线朝外 */
    var ax=xs[i], ay=ys[i], bx=xs[(i+1)%4], by=ys[(i+1)%4];
    var mx=(ax+bx)*0.5, my=(ay+by)*0.5;
    /* 面的外法线：矩形四条边依次是 -Y, +X, +Y, -X */
    var nIx=[0,1,0,-1][i], nIy=[-1,0,1,0][i];
    if (nIx*(mx-camx) + nIy*(my-camy) >= 0) continue;
    var qx=[ax,bx,bx,ax], qy=[ay,by,by,ay];
    for(q=0;q<4;q++){
      var dx=qx[q]-camx, dy=qy[q]-camy;
      CF1[q]=dx*rx+dy*ry;
      CS1[q]=dx*fx2+dy*fy2;
      CU1[q]=(q<2)?0:H;
    }
    var shade = 0.68 + 0.32*(1-Math.min(1,i*0.25));
    fpQuad(tintSide(baseCol, shade), camx,camy,eyeH, rx,ry,tanHalf,W2,H2);
  }
  /* 顶面：眼睛高过它才看得见 */
  if (H < eyeH){
    for(i=0;i<4;i++){
      var dx2=xs[i]-camx, dy2=ys[i]-camy;
      CF1[i]=dx2*rx+dy2*ry;
      CS1[i]=dx2*fx2+dy2*fy2;
      CU1[i]=H;
    }
    fpQuad(tintSide(baseCol, 1.26), camx,camy,eyeH, rx,ry,tanHalf,W2,H2);
  }
  return 1;
}
function tintSide(hex, k){
  if (hex.charAt(0)!=='#') return hex;
  var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  r=Math.min(255,Math.round(r*k)); g=Math.min(255,Math.round(g*k)); b=Math.min(255,Math.round(b*k));
  return 'rgb('+r+','+g+','+b+')';
}
function fpBillboards(cz,sz,proj){

  var rx=Math.cos(S.ang), ry=Math.sin(S.ang);
  var fx=-ry, fy=rx;                       // 右手方向

  var list=FP_LIST, ln=0;

      if (!mm.k || mm.k==='wall') continue;

    var dk=R.desks||[];

      FP_K[ln]='desk'; list[ln*5]=mm.x; list[ln*5+1]=mm.y; list[ln*5+2]=mm.w; list[ln*5+3]=mm.h; list[ln*5+4]=0; ln++;

  } else {

      if (ob.t!=='solid'||ob.x===undefined) continue;
      FP_K[ln]='wall'; list[ln*5]=ob.x; list[ln*5+1]=ob.y; list[ln*5+2]=ob.w; list[ln*5+3]=ob.h; list[ln*5+4]=0; ln++; }
  }

    if (VIEW.d && VIEW.d.length){

    }

    var floorY = H2*0.5 + eyeH*pu + VIEW.bob;   // 该距离处的地面线

}

    var fwd=(ANA.x-S.x)*Math.cos(S.ang)+(ANA.y-S.y)*Math.sin(S.ang);
    if (fwd<8 || fwd>300) return;
    var pt=fpAnPoint(ANA.x, ANA.y); if (!pt) return;
    var sc=clamp(pt[2]*17, 4, 96)*DPR;                    // 原来最大 260px，像贴了张海报
    ctx.save();
    ctx.globalAlpha=al;
    ctx.fillStyle=f.f; ctx.fillRect(pt[0]-sc*0.5, pt[1]-sc*0.62, sc, sc*0.5);
    ctx.strokeStyle=f.s; ctx.lineWidth=Math.max(1,DPR); ctx.strokeRect(pt[0]-sc*0.5, pt[1]-sc*0.62, sc, sc*0.5);
    /* 上面画几道涂黑的横线 */
    ctx.strokeStyle='rgba(40,38,36,.8)'; ctx.lineWidth=Math.max(1.4, sc*0.055);
    for (var li=0; li<3; li++){
      var lw=sc*(0.60-li*0.10);
      ctx.beginPath(); ctx.moveTo(pt[0]-lw*0.5, pt[1]-sc*0.50+li*sc*0.13);
      ctx.lineTo(pt[0]+lw*0.5, pt[1]-sc*0.50+li*sc*0.13); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  /* 俯视：走世界坐标 */
  var x=ANA.x, y=ANA.y, cam=MAPX;
  ctx.save();
  ctx.globalAlpha=al;
  var w=f.w*0.62, h=f.h*0.62;                             // 俯视也收小一点，别盖住整条路
  ctx.fillStyle=f.f; ctx.fillRect(x-w/2, y-h/2, w, h);
  ctx.strokeStyle=f.s; ctx.lineWidth=1; ctx.strokeRect(x-w/2, y-h/2, w, h);
  ctx.strokeStyle='rgba(40,38,36,.75)'; ctx.lineWidth=1.1;
  for (var k2=0; k2<3; k2++){
    var w2=w*(0.62-k2*0.12);
    ctx.beginPath(); ctx.moveTo(x-w2/2, y-h*0.28+k2*h*0.26);
    ctx.lineTo(x+w2/2, y-h*0.28+k2*h*0.26); ctx.stroke();
  }
  if (ANA.read){ anLabel(ctx,'（看过了）',x,y-h/2-4,3.6,'rgba(210,200,180,.9)'); }
  ctx.restore();
}
/* 异象生效时房间里的实体变化。在室内绘制流程里调用。
   只有"玩家就在现场"的时候才画 —— 别的楼层不该受影区。 */
function drawAnomalyRoom(ctx, R){
  if (!R || !AN.cur) return;
  var a = AN.cur, i, m, x, y, w, h;
  var host = R.host || '';
  var sameRoom = (S.mode === 'in' && S.room === R.id);

  /* ---------- 食堂盛宴：暖光 + 满桌的菜 ---------- */
  if (a === 'feast' && host === 'canteen'){
    var k = clamp((AN.t||0)/2.5, 0, 1);                 // 慢慢亮起来
    var flick = 0.92 + Math.sin(MARK_T*3.1)*0.05 + Math.sin(MARK_T*7.7)*0.03;
    /* ① 整间屋子罩一层暖黄 */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,186,96,' + (0.16*k*flick) + ')';
    ctx.fillRect(R.ox, R.oy, R.w, R.h);
    /* ② 灯下的光池 */
    for (i = 0; i < (R.lamps ? R.lamps.length : 0); i++){
      var lp = R.lamps[i];
      var rad = Math.max(lp.w, lp.h) * 4.2;
      var g = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, rad);
      g.addColorStop(0, 'rgba(255,214,140,' + (0.34*k*flick) + ')');
      g.addColorStop(0.55, 'rgba(255,178,92,' + (0.15*k) + ')');
      g.addColorStop(1, 'rgba(255,178,92,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(lp.x, lp.y, rad, 0, TAU); ctx.fill();
    }
    ctx.restore();
    /* ③ 每张桌子上摆菜 —— 用确定性的随机，别每帧跳 */
    var COL = ['#d8563c','#e0a33a','#7fae52','#c8663f','#e6d5a8','#a8503c','#d9b45c','#8f9e4e'];
    for (i = 0; i < R.misc.length; i++){
      m = R.misc[i];
      if (m.k !== 'table') continue;
      var seed = (m.x*7.13 + m.y*3.71) % 1;
      var n = 3 + Math.floor(Math.abs(seed)*3);
      for (var q = 0; q < n; q++){
        var sd = Math.abs((m.x*13.1 + m.y*29.7 + q*17.3) % 1);
        var sd2 = Math.abs((m.x*41.7 + m.y*11.3 + q*7.9) % 1);
        var fx = m.x + m.w*(0.18 + sd*0.64);
        var fy = m.y + m.h*(0.20 + sd2*0.60);
        var fr = Math.min(m.w, m.h)*0.17;
        /* 盘子 */
        ctx.fillStyle = 'rgba(242,236,222,' + (0.85*k) + ')';
        ctx.beginPath(); ctx.ellipse(fx, fy, fr*1.25, fr*0.85, 0, 0, TAU); ctx.fill();
        /* 菜 */
        ctx.fillStyle = COL[(q + Math.floor(sd*8)) % COL.length];
        ctx.globalAlpha = 0.9*k;
        ctx.beginPath(); ctx.ellipse(fx, fy, fr*0.78, fr*0.52, 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
        /* 冒的热气 */
        if (q % 2 === 0){
          ctx.strokeStyle = 'rgba(255,244,226,' + (0.20*k) + ')';
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          var hy = fy - fr*1.1 - ((MARK_T*8 + q*11) % 9);
          ctx.moveTo(fx, fy - fr*0.9);
          ctx.quadraticCurveTo(fx + 2.2, hy, fx - 1.4, hy - 3.2);
          ctx.stroke();
        }
      }
    }
    return;
  }

  /* ---------- 冷库：满屋结霜，人形挂着 ---------- */
  if (a === 'cold' && host === 'canteen'){
    ctx.save();
    ctx.fillStyle = 'rgba(196,224,236,0.20)';
    ctx.fillRect(R.ox, R.oy, R.w, R.h);
    ctx.strokeStyle = 'rgba(232,244,250,0.34)';
    ctx.lineWidth = 1.1;
    for (i = 0; i < 22; i++){
      var cx2 = R.ox + ((i*137)%100)/100*R.w, cy2 = R.oy + ((i*79)%100)/100*R.h;
      ctx.beginPath();
      ctx.moveTo(cx2, cy2); ctx.lineTo(cx2+2.4, cy2+5.5); ctx.lineTo(cx2-1.6, cy2+9);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 天花板渗水：地上有水渍，天花板在滴 ---------- */
  if (a === 'leak' && AN.spots && AN.spots.length){
    for (i = 0; i < AN.spots.length; i++){
      var sp = AN.spots[i];
      ctx.fillStyle = 'rgba(52,58,64,0.30)';
      ctx.beginPath(); ctx.ellipse(sp[0], sp[1], 13, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(30,34,38,0.24)';
      ctx.beginPath(); ctx.ellipse(sp[0], sp[1], 7, 4.2, 0, 0, TAU); ctx.fill();
      /* 正在滴 */
      var drip = (MARK_T*1.4 + i*0.37) % 1;
      ctx.fillStyle = 'rgba(150,170,184,' + (0.65*(1-drip)) + ')';
      ctx.beginPath(); ctx.ellipse(sp[0], sp[1] - 24*(1-drip), 1.1, 2.0, 0, 0, TAU); ctx.fill();
    }
  }

  /* ---------- 实验楼仪式：圈已经用 drawAnomalyWorld 画了，这里补房间的暗红 ---------- */
  if (a === 'rite' && host === 'lab'){
    ctx.save();
    ctx.fillStyle = 'rgba(96,26,22,0.13)';
    ctx.fillRect(R.ox, R.oy, R.w, R.h);
    ctx.restore();
  }

  /* ---------- 被划掉的名字：墙上的名册 ---------- */
  if (a === 'roster' && sameRoom && AN.rosX !== undefined){
    var rx = AN.rosX, ry = AN.rosY;
    ctx.save();
    ctx.fillStyle = 'rgba(238,232,214,0.92)';
    ctx.fillRect(rx-11, ry-15, 22, 30);
    ctx.strokeStyle = 'rgba(60,52,42,0.7)'; ctx.lineWidth = 0.9;
    ctx.strokeRect(rx-11, ry-15, 22, 30);
    ctx.strokeStyle = 'rgba(96,90,78,0.55)'; ctx.lineWidth = 0.7;
    for (i = 0; i < 9; i++){
      var ly = ry - 11 + i*2.9;
      ctx.beginPath(); ctx.moveTo(rx-7, ly); ctx.lineTo(rx+7, ly); ctx.stroke();
    }
    /* 一道红杠 */
    ctx.strokeStyle = 'rgba(176,48,40,0.92)'; ctx.lineWidth = 2.1;
    ctx.beginPath(); ctx.moveTo(rx-8, ry+2); ctx.lineTo(rx+8, ry+4.5); ctx.stroke();
    ctx.restore();
  }
}

/* Billboard projection onto existing first-person scene: projected WORLD location, depth-tested
   against the renderer's actual wall distances, never fixed full-screen overlays. */
function drawAnomalyFP(){
  if(!AN.cur)return;
  var p=anPosition();if(!p)return;
  var ctx=C,t=AN.t,id=AN.cur;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  // Weather uses points sampled from ground positions in the world, not screen-normalized sprites.
  if(id==='rain'||id==='moth'||id==='raindots'){
    for(var i=0;i<135;i++){
      var a=(i*.61803398875%1)*TAU,d=14+(i*29%215),wx=S.x+Math.cos(a)*d,wy=S.y+Math.sin(a)*d;
      var q=fpAnPoint(wx,wy);if(!q)continue;
      var sz=clamp(q[2]*3,1,10)*DPR;
      if(id==='moth'){
        ctx.fillStyle='rgba(223,216,198,.68)';ctx.beginPath();ctx.ellipse(q[0],q[1]-sz*4,sz*.55,sz*.3,Math.sin(t*3+i),0,TAU);ctx.fill();
      }else{
        var f=(t*.8+i*.16)%1;ctx.strokeStyle='rgba(182,209,221,.58)';ctx.lineWidth=Math.max(.7,sz*.2);
        ctx.beginPath();ctx.moveTo(q[0],q[1]-sz*(8-f*7));ctx.lineTo(q[0]-sz*.4,q[1]-sz*(5-f*7));ctx.stroke();
      }
    }
  }
  var v=fpAnPoint(p[0],p[1]);if(!v){ctx.restore();return;}
  var xx=v[0], yy=v[1], size=clamp(v[2]*7,7,105)*DPR;
  if(id==='exercise'||id==='necker'||id==='turn'||id==='repeat'||id==='rite'){
    var total=id==='exercise'?14:(id==='rite'?6:1);
    for(i=0;i<total;i++){
      var dx=total===1?0:((i%7)-3)*size*.60,dy=total===1?0:Math.floor(i/7)*size*.32;
      var cy=yy-size*.34+dy;ctx.fillStyle='rgba(220,217,205,.8)';
      ctx.beginPath();ctx.arc(xx+dx,cy-size*.38,size*.13,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(220,217,205,.82)';ctx.lineWidth=Math.max(1,size*.07);ctx.beginPath();
      ctx.moveTo(xx+dx,cy-size*.23);ctx.lineTo(xx+dx,cy+size*.27);ctx.moveTo(xx+dx,cy-size*.08);
      ctx.lineTo(xx+dx+Math.sin(t*3+i)*size*.32,cy-size*.17);ctx.stroke();
    }
  }else if(id==='bells'||id==='bell13'||id==='broad'||id==='loop'){
    for(i=0;i<3;i++){var rad=size*((t*.35+i*.3)%1);
      ctx.strokeStyle='rgba(230,219,188,'+(1-i*.22)+')';ctx.lineWidth=Math.max(1,size*.025);
      ctx.beginPath();ctx.ellipse(xx,yy-size*.22,rad,rad*.63,0,0,TAU);ctx.stroke();}
  }else if(id==='leak'){
    for(i=0;i<AN.spots.length;i++){var sp=AN.spots[i],vp=fpAnPoint(sp[0],sp[1]);if(!vp)continue;
      var r=clamp(vp[2]*6,4,42)*DPR;ctx.fillStyle='rgba(22,31,37,.8)';ctx.beginPath();ctx.ellipse(vp[0],vp[1],r,r*.45,0,0,TAU);ctx.fill();}
  }else if(id==='shadow'){
    ctx.fillStyle='rgba(2,2,4,.7)';ctx.beginPath();ctx.ellipse(MW*.52+Math.sin(t)*size,yy,size*.27,size*.66,0,0,TAU);ctx.fill();
  }else if(id==='chalk'||id==='roster'||id==='shifting'||id==='cold'||id==='feast'||id==='hand'||id==='raindots'){
    var _cs=CHALK_SURF[AN.surf||'board']||CHALK_SURF.board;
    var text={chalk:_cs.pre+Math.floor(AN.chalkT/3600)+':'+String(Math.floor((AN.chalkT%3600)/60)).padStart(2,'0'),
      roster:'点名册',shifting:'窗外的楼在移动',cold:AN.stage>=3?'只是校服':'冷库',feast:'食堂',hand:'隔间',raindots:'明天的天气：阴'}[id];
    var fw=Math.min(240*DPR,Math.max(46*DPR,size*2.8)),fh=Math.min(70*DPR,Math.max(28*DPR,size*.85));
    ctx.fillStyle=(id==='chalk'&&_cs)?_cs.f:'rgba(39,40,40,.9)';
    ctx.fillRect(xx-fw/2,yy-fh*1.6,fw,fh);ctx.strokeStyle=(id==='chalk'&&_cs)?_cs.s:'#b9a98b';ctx.lineWidth=DPR;
    ctx.strokeRect(xx-fw/2,yy-fh*1.6,fw,fh);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e8dfcb';ctx.font=(Math.min(16,Math.max(9,size/DPR*.24))*DPR)+'px "Kaiti SC",serif';
    ctx.fillText(text,xx,yy-fh*1.1,fw-7*DPR);
  }
  ctx.restore();
}
function fpAnPoint(wx,wy){
  var fwd=(wx-S.x)*Math.cos(S.ang)+(wy-S.y)*Math.sin(S.ang);
  if(fwd<8||fwd>FP_MAXD)return null;
  var p=fpGroundPoint(wx,wy);if(!p||p[0]<-MW*.1||p[0]>MW*1.1)return null;
  var col=Math.max(0,Math.min(VIEW.d.length-1,Math.floor(p[0]/MW*VIEW.d.length)));
  if(VIEW.d.length && VIEW.d[col]+7<fwd)return null;

/* ---------- 地下车库（60×26）----------
   参考真实地下车库：南北两排车位、中间一条双向车道、车位之间立柱子、
   东侧是下坡道。柱子挡路，视野被切得七零八落 —— 在这里跑不快也看不清。 */
var GARAGE_CARS=[];
var GARAGE=(function(){
  var W=60,H=26,g=[],r,c,s,i;
  function blank(ch){ var a=[]; for(c=0;c<W;c++) a.push(ch); return a; }
  var bays=[]; for(c=4;c<=W-9;c+=6) bays.push(c);

  var northBay=[0,2,4], southBay=[1,3,5];
  for(r=0;r<H;r++){
    if (r===0||r===H-1){ g.push(blank('#').join('')); continue; }
    s=blank('.'); s[0]='#'; s[W-1]='#';
    var isN=(r>=1&&r<=7), isS=(r>=18&&r<=24);
    if (isN||isS){
      var top = isN?1:18;
      for(i=0;i<bays.length;i++){
        var bx=bays[i];
        s[bx]='y';                                   // 车位分隔线
        if (r===top+2||r===top+3){ s[bx+1]='y'; s[bx+2]='y'; }   // 车位底线
      }
      if (r===top||r===top+6){                       // 柱网
        for(i=0;i<bays.length;i++) s[bays[i]-1]='o';
      }
    }
    g.push(s.join(''));
  }
  /* 放车：每辆车占 2 格宽、2 格高 */
  var pick=[];
  for(i=0;i<northBay.length;i++) pick.push([bays[northBay[i]], 2]);
  for(i=0;i<southBay.length;i++) pick.push([bays[southBay[i]], 19]);
  GARAGE_CARS.length=0;
  /* 车长 4 格、宽 2 格 —— 原来 2×2 是个方块，看着不像车 */
  for(i=0;i<pick.length;i++){
    var cx0=pick[i][0], cy0=pick[i][1];
