function actStop(finished){
  if (!ACT.on) return;
  var kind=ACT.kind;
  ACT.on=false; ACT.kind=null; ACT.t=0;
  if (finished){
    S.actUsed=S.actUsed||{};
    S.actUsed[kind]=(S.actUsed[kind]||0)+1;
    var endLines={
      piano:'我：手停下来了。刚才那一段，是我自己按的。',
      computer:'我：关掉。屏幕上只剩下我自己的脸。',
      sleep:'我：醒的时候天还是暗的。我睡了多久？',
      eat:'我：吃完了。盘子底下压着一张饭票，日期是三年前。',
      wash:'我：水停了。镜子里的人比我慢了一拍才抬起来。',
      hoop:'我：球滚到角落里去了。我不想去捡。',
      jog:'我：跑完一圈，操场上只有我一个人的脚印。'
    };
    if (endLines[kind]) os(endLines[kind], 4.6);

}
function actTick(dt){
  if (!ACT.on) return;
  /* 一动就中断 */
  if (S.moving || S.dead || S.death || RT.end || PAUSE.on || MAPV.on){ actStop(false); return; }
  var A=ACTS[ACT.kind]; if(!A){ actStop(false); return; }
  ACT.t+=dt;
  var gain=A.rate*actDim(ACT.kind)*dt;
  S.san=Math.min(100, S.san+gain);
  ACT.spent+=gain;
  /* 放松警惕：异象来得快得多 */
  AN.next -= dt*3.2;
  /* 做久了会开始不对劲 */
  if (ACT.t>ACT.dur){ actStop(true); return; }
  if (ACT.t>ACT.dur*0.62 && !ACT.warned){
    ACT.warned=true;
    os('我：……好像有什么不太对。',3.4);
  }
}
function actBlocked(){
  if (!ACT.on) return;
  actStop(false);
}

/* 地图坐标说明：BOUND / RING / OBJ / MAPV.marks / S.x 全都是同一个世界坐标系（scaleAll 之后）。
   画地图时统一用这一套，任何地方都不要再去乘除 SC。 */
var MAPB={ x0:0,y0:0,x1:1,y1:1, ready:false };
var MAPX={ ox:0, oy:0, sc:1, px:0, py:0, ready:false };
function mapBounds(){
  if (MAPB.ready) return MAPB;
  var i, x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  function add(x,y){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; }
  for(i=0;i<BOUND.length;i++) add(BOUND[i][0],BOUND[i][1]);
  for(i=0;i<RING.length;i++) add(RING[i][0],RING[i][1]);
  for(i=0;i<OBJ.length;i++){ var o=OBJ[i];
    if (o.cx!==undefined){ add(o.cx-o.rx,o.cy-o.ry); add(o.cx+o.rx,o.cy+o.ry); }
    else if (o.x!==undefined) add(o.x+o.w,o.y+o.h); }
  MAPB.x0=x0; MAPB.y0=y0; MAPB.x1=x1; MAPB.y1=y1; MAPB.ready=true;
  return MAPB;
}
function drawFullMap(){
  var ctx=C, i;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(8,7,6,0.94)'; ctx.fillRect(0,0,MW,MH);
  var detail = sHas('map');
  var pad=Math.min(MW,MH)*0.06;
  var w=MW-pad*2, h=MH-pad*2-MH*0.10;
  var B=mapBounds();
  var cw=B.x1-B.x0, ch2=B.y1-B.y0;
  var sc=Math.min(w/cw, h/ch2)*0.92;
  var topY=pad+Math.max(0,(h-ch2*sc)/2);
  var ox=MW/2-cw*sc*0.5-B.x0*sc;
  var oy=topY-B.y0*sc;
  MAPX.ox=ox; MAPX.oy=oy; MAPX.sc=sc; MAPX.ready=true;
  var LW=1/sc;                       // 线宽按世界单位给，免得被 scale 压成一条丝
  ctx.save();
  ctx.translate(ox,oy); ctx.scale(sc,sc);
  ctx.lineCap='round'; ctx.lineJoin='round';
  // 校园轮廓
  ctx.beginPath();
  for(i=0;i<BOUND.length;i++){ if(i===0) ctx.moveTo(BOUND[i][0],BOUND[i][1]); else ctx.lineTo(BOUND[i][0],BOUND[i][1]); }
  ctx.closePath();
  ctx.fillStyle='rgba(38,34,27,0.85)'; ctx.fill();
  ctx.strokeStyle='#c9b489'; ctx.lineWidth=2.2*LW; ctx.stroke();
  // 校门外那圈路
  ctx.beginPath();
  for(i=0;i<RING.length;i++){ if(i===0) ctx.moveTo(RING[i][0],RING[i][1]); else ctx.lineTo(RING[i][0],RING[i][1]); }
  ctx.closePath();
  ctx.strokeStyle='rgba(140,130,110,0.55)'; ctx.lineWidth=6*LW; ctx.stroke();
  // 建筑
  for(i=0;i<OBJ.length;i++){ var o=OBJ[i];

    ctx.fillRect(o.x,o.y,o.w,o.h);

    if (detail){

    ctx.fillStyle=ACC;
    ctx.fillRect(dd[0]-6*LW, dd[1]-6*LW, 12*LW, 12*LW);
  }
  // 标记
  for(i=0;i<MAPV.marks.length;i++){
    ctx.strokeStyle='rgba(235,225,200,0.8)'; ctx.lineWidth=2.4*LW;
    var mk=MAPV.marks[i];
    ctx.beginPath(); ctx.moveTo(mk[0]-8*LW,mk[1]-8*LW); ctx.lineTo(mk[0]+8*LW,mk[1]+8*LW); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mk[0]+8*LW,mk[1]-8*LW); ctx.lineTo(mk[0]-8*LW,mk[1]+8*LW); ctx.stroke();
  }
  // 你
  /* 玩家：和建筑同一套世界坐标（之前这里多除了一个 SC，红点只画在一半的位置） */
  var bx=S.x, by=S.y;
  MAPX.px=bx; MAPX.py=by;
  ctx.fillStyle=ACC;
  ctx.beginPath(); ctx.arc(bx,by,10*LW,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2*LW;
  ctx.beginPath(); ctx.arc(bx,by,18*LW,0,TAU); ctx.stroke();
  if (S.mode==='out'){
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.lineTo(bx+Math.cos(S.ang)*70*LW, by+Math.sin(S.ang)*70*LW);

  ctx.fillStyle='#e8dcc0';
  ctx.font=(26*DPR)+'px "Kaiti SC","STKaiti",serif';
  ctx.fillText('校 园 平 面 图', MW/2, MH*0.045);

  ctx.fillStyle='rgba(190,180,158,0.95)';
  ctx.font=(14*DPR)+'px "Kaiti SC",serif';
  var where = S.mode==='in' && S.room ? INTERIORS[S.room].name : (isNight()?'校内 · 夜里':'校内');
  ctx.fillText('你在：'+where+'　　'+fmtTime(S.tsec), MW/2, MH-(MAPV.on?96:62)*DPR);
  ctx.fillStyle='rgba(130,122,104,0.95)';
  ctx.font=(12*DPR)+'px "Kaiti SC",serif';
  ctx.fillText('M 关闭地图　·　N 标记当前位置', MW/2, MH-58*DPR);

/* ============================ 第一人称模式 ============================ */
var VIEW={ fp:false, cols:0, d:[], a:[], buf:null, bufn:0, bob:0, tile:[], n:0 };
var FP_MAXD=420;
function fpAlloc(n){
  if (VIEW.bufn===n) return;
  VIEW.bufn=n; VIEW.d=new Float32Array(n); VIEW.a=new Float32Array(n); VIEW.c=new Int32Array(n);
  VIEW.mat=new Uint8Array(n); VIEW.tile=new Float32Array(n); VIEW.cols=n;
}
/* 室外用 OCC 占用格，室内用房间网格 */
/* ---------- 第一人称射线：一次 DDA 同时给出
   垂直距离 / 撞到哪一格 / 沿墙坐标（画砖缝用）/ 那格的字符 ---------- */
var FPH={ d:0, side:0, u:0, ch:'#', tx:0, ty:0, tileW:9 };
var FP_LIST=new Float32Array(300*5), FP_K=new Array(300);
function fpCellSolid(mx,my,gw,gh,useOCC,R){
  if (mx<0||my<0||mx>=gw||my>=gh) return true;
  if (useOCC) return !!OCC.data[my*gw+mx];
  var row=R.grid[my]; if (!row) return true;
  var ch=row.charAt(mx);
  return ch==='#' || !!SOLIDCH[ch];
}
function fpCast(x,y,ang,maxD){
  var R = (S.mode==='in') ? INTERIORS[S.room] : null;
  var gx, gy, cell, gw, gh, useOCC = !R;
  if (R){ gx=R.ox; gy=R.oy; cell=R.tw; gw=R.cols; gh=R.rows; }
  else { gx=OCC.x0; gy=OCC.y0; cell=OCC.cell; gw=OCC.gw; gh=OCC.gh; }
  FPH.ch='#'; FPH.u=0; FPH.side=0; FPH.tileW=cell;
  var rx=Math.cos(ang), ry=Math.sin(ang);
  var mx=Math.floor((x-gx)/cell), my=Math.floor((y-gy)/cell);
  FPH.tx=mx; FPH.ty=my;
  if (fpCellSolid(mx,my,gw,gh,useOCC,R)){ FPH.d=1; return 1; }
  var ddx=Math.abs(1/(rx||1e-9)), ddy=Math.abs(1/(ry||1e-9));
  var stepX, stepY, sdx, sdy;
  if (rx<0){ stepX=-1; sdx=((x-gx)-mx*cell)/cell*ddx; } else { stepX=1; sdx=(((mx+1)*cell)-(x-gx))/cell*ddx; }
  if (ry<0){ stepY=-1; sdy=((y-gy)-my*cell)/cell*ddy; } else { stepY=1; sdy=(((my+1)*cell)-(y-gy))/cell*ddy; }
  var side=0, guard=0, hit=false;
  while (guard++ < 400){
    if (sdx<sdy){ sdx+=ddx; mx+=stepX; side=0; } else { sdy+=ddy; my+=stepY; side=1; }
    if (fpCellSolid(mx,my,gw,gh,useOCC,R)){ hit=true; break; }
  }
  var perp = side===0 ? (sdx-ddx) : (sdy-ddy);
  if (!hit || perp<0) perp=0;
  var corr = perp*cell;                       // 已经是垂直距离，不用再做鱼眼校正
  if (corr>maxD) corr=maxD;
  FPH.d=corr; FPH.side=side; FPH.tx=mx; FPH.ty=my; FPH.tileW=cell;
  /* 沿墙坐标：射线实际走的长度换算成世界距离 */
  var rel=ang-S.ang, cs=Math.cos(rel); if (cs<0.15) cs=0.15;
  var rayLen=perp/cs*cell;
  FPH.u = (side===0) ? (y+ry*rayLen) : (x+rx*rayLen);
  if (useOCC) FPH.ch='b';
  else { var row2=R.grid[my]; FPH.ch = row2 ? row2.charAt(mx) : '#'; }
  return corr;
}
function drawFP(){
  var ctx=C, i, c, n=Q.fpCols;
  fpAlloc(n);
  var W2=MW, H2=MH;
  var halfF=FOV*0.5, pw=W2/n;        // FOV 是半角常量，第一人称总视场 = 2*halfF = 90°
  var cz=Math.cos(S.ang), sz=Math.sin(S.ang);
  // 天花板 / 地面（提亮：太黑会什么都看不见）
  var skyF = S.mode==='in' ? (BW?'#3a3840':'#4a4750') : (BW?'#2c2e36':'#525868');
  var gndF = S.mode==='in' ? (BW?'#2e2c30':'#5a5044') : (BW?'#26262a':'#5c584e');
  ctx.fillStyle=skyF; ctx.fillRect(0,0,W2,H2*0.5);
  ctx.fillStyle=gndF; ctx.fillRect(0,H2*0.5,W2,H2*0.5);
  /* ---- 投影常数 ----------------
     WALLH 是墙在「世界单位」里的高度：一格 9 单位，取 27 ≈ 3 格高（约 2.7 米）。
     屏幕上某距离 d 处的墙高 = WALLH * (MW/2) / (tan(halfF) * d)。
     之前用的是 proj=W2*0.86，等于墙只有 1.7 个单位高 —— 所以看起来像矮墙。 */
  /* 先铺室外地板：每块场地一个颜色，不然在校外全是一片灰，认不出在哪 */
  if (S.mode==='out'){
    for(i=0;i<OBJ.length;i++){
      var go=OBJ[i];
      if (go.t!=='walk') continue;
      if (go.cx!==undefined){
        /* 椭圆场地（小跑道等）：采样成多边形再投到地面 */
        var eN=22, e;
        for(e=0;e<eN;e++){
          var ea=e/eN*TAU;
          GQA[e*2]=go.cx+Math.cos(ea)*go.rx;
          GQA[e*2+1]=go.cy+Math.sin(ea)*go.ry;
        }
        fpGroundPolyN(GQA, eN, GCOL[go.k]||GCOL.track);
        continue;
      }
      if (go.x===undefined) continue;
      fpGroundQuad(go.x, go.y, go.x+go.w, go.y+go.h, GCOL[go.k]||GCOL.walk);
    }
    /* 校门外那一圈路 */
    fpGroundQuad(RING[0][0], RING[0][1], RING[1][0], RING[3][1], 'rgba(78,76,70,0.55)');
  }
  var WALLH = 27;
  var proj = (W2 * WALLH * 0.5) / Math.tan(FOV*0.5);
  // 天花板 / 地面透视网格
  ctx.strokeStyle = BW?'rgba(255,255,255,0.10)':'rgba(255,255,255,0.14)';
  ctx.lineWidth=1*DPR;
  ctx.beginPath();
  for(i=1;i<=9;i++){
    var yy=H2*0.5 + (H2*0.5)*Math.pow(i/9, 2.1);
    ctx.moveTo(0,yy); ctx.lineTo(W2,yy);
    var yc=H2*0.5 - (H2*0.5)*Math.pow(i/9, 2.1);
    ctx.moveTo(0,yc); ctx.lineTo(W2,yc);
  }
  ctx.stroke();
  // 逐列投墙
  var prevTile=-99999;
  var tanHalf=Math.tan(halfF);
  for(c=0;c<n;c++){
    /* 平面投影：每一列占等宽的屏幕列，而不是等角度。
       等角度会让边缘的墙被拉伸，而且和家具（用 tan 投影）对不上。 */
    var sxn = ((c+0.5)/n)*2 - 1;              // -1 .. 1
    var a = S.ang + Math.atan(sxn*tanHalf);
    var dd = fpCast(S.x, S.y, a, FP_MAXD);
    var corr = dd;                       // fpCast 给的就是垂直距离，不要再乘 cos（会二次校正）
    if (corr<1) corr=1;
    var hh = proj/corr;
    if (hh>H2*14) hh=H2*14;
    var top = H2*0.5 - hh*0.5 + VIEW.bob;
    /* 距离衰减 */
    var shade = 1/(1 + corr/380);
    var base = S.mode==='in' ? 152 : 124;
    var g2 = 44 + base*shade;
    /* 每一格给一点色差：相邻墙格亮度不同，一眼能数出走了几格 */
    var tv = hash2(FPH.tx*7 + FPH.ty*13, 3, 11);
    g2 *= (0.90 + tv*0.20);
    /* 砖缝：每半格一条暗带，让墙面有尺度感 */
    var tw = FPH.tileW || 9;
    var uu = FPH.u;
    var fu = uu - Math.floor(uu/tw)*tw;              // 0..tw
    var band = (fu < tw*0.5) ? 0.94 : 1.06;          // 半格一亮一暗
    g2 *= band;
    if (corr<26) g2 *= 1.12;                         // 贴脸提亮，制造压迫感
    var edgeOn = (fu < 1.1 || fu > tw-1.1);          // 格子接缝
    if (g2>238) g2=238; if (g2<0) g2=0;

function fpGroundPolyN(pts, m, col){

    var b0x=pts[j*2]-S.x, b0y=pts[j*2+1]-S.y;

    var a1=a0x*fx+a0y*fy, b1=b0x*fx+b0y*fy;

    var shade = 0.68 + 0.32*(1-Math.min(1,i*0.25));
    fpQuad(tintSide(baseCol, shade), camx,camy,eyeH, rx,ry,tanHalf,W2,H2);
  }
  /* 顶面：眼睛高过它才看得见 */
  if (H < eyeH){
    for(i=0;i<4;i++){
      var dx2=xs[i]-camx, dy2=ys[i]-camy;
      CF1[i]=dx2*rx+dy2*ry;
      CS1[i]=dx2*fx2+dy2*fy2;
      CU1[i]=H;
    }
    fpQuad(tintSide(baseCol, 1.26), camx,camy,eyeH, rx,ry,tanHalf,W2,H2);
  }

}
function tintSide(hex, k){
  if (hex.charAt(0)!=='#') return hex;
  var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  r=Math.min(255,Math.round(r*k)); g=Math.min(255,Math.round(g*k)); b=Math.min(255,Math.round(b*k));
  return 'rgb('+r+','+g+','+b+')';
}
function fpBillboards(cz,sz,proj){
  var ctx=C, i;
  var R = (S.mode==='in') ? INTERIORS[S.room] : null;
  var W2=MW, H2=MH;
  var pxPerUnit = proj/27;                 // 27 = WALLH，和墙同一套
  var eyeH = 12;                           // 眼睛高度（世界单位）
  var rx=Math.cos(S.ang), ry=Math.sin(S.ang);
  var fx=-ry, fy=rx;                       // 右手方向
  var tanH = Math.tan(FOV*0.5);
  /* 先把要画的东西收进一个固定数组：家具 + 课桌椅子（课桌原来漏了，教室里什么都看不见） */
  var list=FP_LIST, ln=0;
  if (R){
    var mi, mm;
    for(mi=0;mi<R.misc.length && ln<300;mi++){ mm=R.misc[mi];
      if (!mm.k || mm.k==='wall') continue;
      FP_K[ln]=mm.k; list[ln*5]=mm.x; list[ln*5+1]=mm.y; list[ln*5+2]=mm.w; list[ln*5+3]=mm.h; list[ln*5+4]=0; ln++; }
    var dk=R.desks||[];
    for(mi=0;mi<dk.length && ln<300;mi++){ mm=dk[mi];
      FP_K[ln]='desk'; list[ln*5]=mm.x; list[ln*5+1]=mm.y; list[ln*5+2]=mm.w; list[ln*5+3]=mm.h; list[ln*5+4]=0; ln++;
      if (mm.chair!==undefined && ln<300){
        FP_K[ln]='chair'; list[ln*5]=mm.x; list[ln*5+1]=mm.chair; list[ln*5+2]=mm.w; list[ln*5+3]=4; list[ln*5+4]=0; ln++; } }
  } else {
    for(i=0;i<OBJ.length && ln<300;i++){ var ob=OBJ[i];
      if (ob.t!=='solid'||ob.x===undefined) continue;
      FP_K[ln]='wall'; list[ln*5]=ob.x; list[ln*5+1]=ob.y; list[ln*5+2]=ob.w; list[ln*5+3]=ob.h; list[ln*5+4]=0; ln++; }
  }
  VIEW.n=0; VIEW.culled=0; VIEW.total=ln;
  for(i=0;i<ln;i++){
    var k = FP_K[i];
    var ox0=list[i*5], oy0=list[i*5+1], ow=list[i*5+2], oh=list[i*5+3];
    var wx=ox0+ow*0.5-S.x, wy=oy0+oh*0.5-S.y;
    var fwd = wx*rx + wy*ry;               // 沿视线的距离
    if (fwd < 6 || fwd > FP_MAXD*0.9) continue;
    var side = wx*fx + wy*fy;              // 横向偏移
    var rel = Math.atan2(side, fwd);
    if (Math.abs(rel) > FOV*0.62) continue;
    var scr = W2/2 + (Math.tan(rel)/tanH) * (W2/2);
    /* 遮挡测试：这一列上墙的距离，比东西还近就看不见它（之前没有这一步，
       家具会穿墙透出来） */
    if (VIEW.d && VIEW.d.length){
      var ci = Math.floor(scr/(W2/VIEW.cols));
      if (ci<0) ci=0; if (ci>=VIEW.cols) ci=VIEW.cols-1;
      var wallD = VIEW.d[ci];
      if (wallD > 0 && fwd > wallD + 2){ VIEW.culled++; continue; }
    }
    var pu = pxPerUnit/fwd;
    var wpx = Math.max(2, ow*pu);
    var hpx = Math.max(2, (BH[k]||8)*pu);
    var floorY = H2*0.5 + eyeH*pu + VIEW.bob;   // 该距离处的地面线
    var topY = floorY - hpx;
    var shade = 1/(1+fwd/380);
    var col = BC[k] || '#8a8a8a';
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.30 + 0.62*shade;
    /* 真正的三维盒子：按物体自己的朝向投影，不再永远正对镜头 */
    var HH = BH[k] || 8;
    fpBox(ox0, oy0, ox0+ow, oy0+oh, HH, BC[k]||'#8a8a8a',
          rx, ry, fx, fy, tanH, W2, H2, eyeH);
    VIEW.n++;
  }
}

var TITLE={ sel:-1, mode:'main', items:[['new','新 的 梦'],['load','继 续'],['set','选 项']], rects:[], items2:null, u:1, top:0 };
function titleItems(){
  if (TITLE.mode==='diff') return DIFF.items.concat([['back','返 回']]);
  if (TITLE.mode==='set'){
    var got=endUnlocked().length;
    return [
      ['vol',  '音　　量', OPT.vol<=0.02 ? '关' : Math.round(OPT.vol*100)+'%'],
      ['shake','屏幕震动', OPT.shake ? '开' : '关'],
      ['boil', '线条沸腾', OPT.boil ? '开' : '关'],
      ['qual', '画　　质', ['低','中','高'][OPT.quality] || '高'],
      ['sub',  '字幕停留', OPT.sub+' 秒'],
      ['gal',  '结局收集', got+' / 4'],
      ['back', '返　　回', '']
    ];
  }
  return TITLE.items;
}
function titleU(){ return Math.max(0.58, Math.min(MW/1400, MH/1000)); }
function titleLayout(){
  var u=titleU(), cx=MW/2;
  var list=titleItems();
  var bw=Math.min(360*u, MW*0.64), bh=56*u, gap=12*u;
  var n=list.length;
  // 标题块总高：大标题 + 副题 + 间距 + 按钮组
  var blockH = 64*u + 30*u + 52*u + n*bh + (n-1)*gap;
  var top = MH*0.56 - blockH*0.5;
  if (top < MH*0.42) top = MH*0.42;
  var y0 = top + 64*u + 30*u + 52*u;
  TITLE.rects=[];
  for(var i=0;i<n;i++) TITLE.rects.push([cx-bw/2, y0+i*(bh+gap), bw, bh]);
  TITLE.u=u; TITLE.top=top; TITLE.list=list; TITLE.bh=bh; TITLE.bw=bw;
  return u;
}
function titleHit(mx,my){
  titleLayout();
  for(var i=0;i<TITLE.rects.length;i++){
    var r=TITLE.rects[i];
    if (mx>=r[0]&&mx<=r[0]+r[2]&&my>=r[1]&&my<=r[1]+r[3]) return i;
  }
  return -1;
}
var TITLELOCK=0;
function titlePick(i){
  if (TITLELOCK) return;   // 同一帧里万一有两条路都收到了，只认第一次；下一帧自动解锁
  TITLELOCK=1;
  var list=titleItems();
  if (i<0||i>=list.length) return;
  var id=list[i][0];
  var _sfx=function(){ try{ SFX.ui(); }catch(e){} };
  if (TITLE.mode==='set'){
    titlePickSet(id, _sfx);
    return;
  }
  if (TITLE.mode!=='main'){
    if (id==='back'){ TITLE.mode='main'; TITLE.sel=0; _sfx(); return; }
    S.diff=id; TITLE.mode='main'; _sfx();
    try{ auInit(); auResume(); }catch(e){}
    newDream(); return;
  }
  if (id==='new'){ TITLE.mode='diff'; TITLE.sel=0; _sfx(); return; }
  if (id==='load'){ _sfx(); loadGame(); return; }
  if (id==='set'){ TITLE.mode='set'; TITLE.sel=0; TITLE.msg=''; _sfx(); return; }
  _sfx();
}
/* ---------- 设置页：点一下就切到下一个值 ---------- */
var OPT_KEY='wdfz_opt_v1';
function optSave(){
  try{ localStorage.setItem(OPT_KEY, JSON.stringify(OPT)); }catch(e){}
}
function optLoad(){
  try{
    var raw=localStorage.getItem(OPT_KEY); if(!raw) return;
    var d=JSON.parse(raw);
    if (typeof d.vol==='number') OPT.vol=clamp(d.vol,0,1);
    if (typeof d.shake==='boolean') OPT.shake=d.shake;
    if (typeof d.boil==='boolean') OPT.boil=d.boil;
    if (typeof d.quality==='number') OPT.quality=clamp(d.quality|0,0,2);
    if (typeof d.sub==='number') OPT.sub=clamp(d.sub,1,12);
  }catch(e){}
}
function titlePickSet(id, sfx){
  if (id==='back'){ TITLE.mode='main'; TITLE.sel=0; sfx(); return; }
  if (id==='vol')  OPT.vol = (OPT.vol>=0.99) ? 0 : Math.min(1, Math.round((OPT.vol+0.2)*10)/10);
  else if (id==='shake') OPT.shake = !OPT.shake;
  else if (id==='boil')  OPT.boil  = !OPT.boil;
  else if (id==='qual')  OPT.quality = (OPT.quality+1)%3;
  else if (id==='sub')   OPT.sub = (OPT.sub>=8) ? 2 : OPT.sub+2;
  else if (id==='gal'){
    var nm={car:'闸门',face:'白名单',trash:'第三个桶',beast:'先辈'};
    var all=['car','face','trash','beast'], g=endUnlocked(), out='';
    for(var i2=0;i2<all.length;i2++) out += (g.indexOf(all[i2])>=0 ? '【'+nm[all[i2]]+'】' : '［?］');
    TITLE.msg = out;
  }
  try{ applyOpt(); }catch(e){}
  optSave();
  sfx();
  TITLE.sig='';        // 数值变了，强制重排一次
}
/* ---------- 透明 DOM 命中层：和 canvas 画出来的按钮逐帧对齐 ---------- */
var MENU_EL=[];
function menuEnsure(n){
  while (MENU_EL.length < n){
    var i=MENU_EL.length;
    var b=document.createElement('button');
    try{ b.type='button'; b.setAttribute('aria-label','菜单项'); }catch(e){}
    /* 全部内联样式：不受任何 <style> 规则影响 */
    var CSS='position:fixed;left:0;top:0;width:0;height:0;padding:0;margin:0;'+
      'background:transparent;background-color:transparent;border:0;outline:none;'+
      'color:transparent;font-size:0;line-height:0;overflow:hidden;'+
      'cursor:pointer;z-index:95;pointer-events:auto;display:none;-webkit-tap-highlight-color:transparent;';
    try{ b.style.cssText=CSS; }catch(e){ b.style.position='fixed'; b.style.zIndex='95'; b.style.display='none'; }
    (function(idx){
      var fire=function(e){
        if (e){ if(e.stopPropagation) e.stopPropagation(); if(e.preventDefault) e.preventDefault(); }
        if (S.screen!=='title') return;
        titlePick(idx);
      };
      /* 关键：只绑一个。之前 pointerdown + click 都绑，一次点击跑两遍，
         第二遍时已经进了难度页，于是顺手把「预知梦」也选了。 */
      if (typeof window!=='undefined' && window.PointerEvent) b.addEventListener('pointerdown', fire, {passive:false});
      else b.addEventListener('click', fire);
      b.addEventListener('mouseenter', function(){ if (S.screen==='title') TITLE.sel=idx; });
      b.addEventListener('mouseover',  function(){ if (S.screen==='title') TITLE.sel=idx; });
    })(i);
    try{ document.body.appendChild(b); }catch(e){}
    MENU_EL.push(b);
  }
}
function menuHide(){
  for (var i=0;i<MENU_EL.length;i++) MENU_EL[i].style.display='none';
  TITLE.sig='';
}
function menuSync(){
  if (S.screen!=='title'){ if (TITLE.sig!=='hidden'){ menuHide(); TITLE.sig='hidden'; } return; }
  titleLayout();
  var n=TITLE.rects.length;
  var sig=TITLE.mode+'|'+n+'|'+Math.round(MW)+'x'+Math.round(MH)+'|'+Math.round(DPR*100);
  if (sig===TITLE.sig) return;
  TITLE.sig=sig;
  menuEnsure(n);
  for (var i=0;i<MENU_EL.length;i++){
    var el=MENU_EL[i];
    if (i>=n){ el.style.display='none'; continue; }
    var r=TITLE.rects[i];
    el.style.display='block';
    el.style.left=(r[0]/DPR)+'px';
    el.style.top=(r[1]/DPR)+'px';
    el.style.width=(r[2]/DPR)+'px';
    el.style.height=(r[3]/DPR)+'px';
  }
}

/* ---------- 地下车库（60×26）----------
   参考真实地下车库：南北两排车位、中间一条双向车道、车位之间立柱子、
   东侧是下坡道。柱子挡路，视野被切得七零八落 —— 在这里跑不快也看不清。 */
var GARAGE_CARS=[];
var GARAGE=(function(){
  var W=60,H=26,g=[],r,c,s,i;
  function blank(ch){ var a=[]; for(c=0;c<W;c++) a.push(ch); return a; }
  var bays=[]; for(c=4;c<=W-9;c+=6) bays.push(c);
  /* 六辆车：北排三个、南排三个，交错着停 */
  var northBay=[0,2,4], southBay=[1,3,5];
  for(r=0;r<H;r++){
    if (r===0||r===H-1){ g.push(blank('#').join('')); continue; }
    s=blank('.'); s[0]='#'; s[W-1]='#';
    var isN=(r>=1&&r<=7), isS=(r>=18&&r<=24);
    if (isN||isS){
      var top = isN?1:18;
      for(i=0;i<bays.length;i++){
        var bx=bays[i];
        s[bx]='y';                                   // 车位分隔线
        if (r===top+2||r===top+3){ s[bx+1]='y'; s[bx+2]='y'; }   // 车位底线
      }
      if (r===top||r===top+6){                       // 柱网
        for(i=0;i<bays.length;i++) s[bays[i]-1]='o';
      }
    }
    g.push(s.join(''));
  }
  /* 放车：每辆车占 2 格宽、2 格高 */
  var pick=[];
  for(i=0;i<northBay.length;i++) pick.push([bays[northBay[i]], 2]);
  for(i=0;i<southBay.length;i++) pick.push([bays[southBay[i]], 19]);
  GARAGE_CARS.length=0;
  for(i=0;i<pick.length;i++){
    var cx0=pick[i][0], cy0=pick[i][1];
    var a1=g[cy0].split(''); a1[cx0]='c'; a1[cx0+1]='c'; g[cy0]=a1.join('');
    var a2=g[cy0+1].split(''); a2[cx0]='c'; a2[cx0+1]='c'; g[cy0+1]=a2.join('');
    GARAGE_CARS.push([cx0, cy0]);
  }
  /* 东侧下坡道口 */
  var ae=g[H-2].split(''); ae[27]='O'; ae[28]='O'; ae[29]='O'; g[H-2]=ae.join('');
  return g;
})();

function drawDevDeath(id,t){
  var ctx=devScreen();

    for(var i=0;i<26;i++){ var a=hash2(i,1,5)*TAU, L=(60+hash2(i,2,5)*300)*DPR*k;
      ctx.beginPath(); ctx.moveTo(MW/2,MH/2); ctx.lineTo(MW/2+Math.cos(a)*L, MH/2+Math.sin(a)*L); ctx.stroke(); }
    devText('你成了课表的一部分。', MH/DPR*0.5, 24, 'rgba(232,224,206,'+k+')');
  } else if (id==='rain'){
    ctx.fillStyle='rgba(60,80,100,'+(0.4*Math.min(1,t))+')'; ctx.fillRect(0,0,MW,MH);
    ctx.strokeStyle='rgba(200,220,240,0.5)'; ctx.lineWidth=1.4*DPR; ctx.beginPath();
    for(var j=0;j<90;j++){ var x=(hash2(j,7,3)*MW+t*500*DPR)%MW, y=(hash2(j,9,5)*MH+t*900*DPR)%MH;
      ctx.moveTo(x,y); ctx.lineTo(x-6*DPR,y+22*DPR); } ctx.stroke();

    devText('你在雨里窒息了。', MH/DPR*0.5, 24, 'rgba(232,224,206,'+k2+')');
  } else if (id==='mirror'){
    var k3=Math.min(1,t/2.2);
    ctx.fillStyle='rgba(16,20,26,'+(0.55*k3)+')'; ctx.fillRect(0,0,MW,MH);
    ctx.save(); ctx.translate(MW/2, MH*0.5);
    ctx.strokeStyle='rgba(200,220,235,'+(0.5+0.3*Math.sin(t*8))+')'; ctx.lineWidth=2.4*DPR;

    ctx.restore();
    var pull=Math.min(1,t/1.8);
    ctx.fillStyle='rgba(210,208,200,'+(0.8*(1-pull*0.7))+')';
    ctx.beginPath(); ctx.ellipse(MW/2, MH*0.5, 16*DPR*(1-pull*0.8), 30*DPR*(1-pull*0.8), 0, 0, TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.6*DPR;
    for(var m=0;m<8;m++){ var aa=hash2(m,3,7)*TAU;

      ctx.lineTo(MW/2+Math.cos(aa)*MW*0.30*pull, MH*0.5+Math.sin(aa)*MH*0.44*pull); ctx.stroke(); }
    devText('镜子把你吸了进去。', MH/DPR*0.86, 22, 'rgba(220,232,245,'+pull+')');
  }
}

function render(){
  var ctx=C;
  ctx.setTransform(1,0,0,1,0,0);
  if (RT.end){ RT.endT+=1/60; drawEnd(); trDraw(); return; }
  if (VIEW.fp && S.screen==='play' && !S.dead && !S.death && !PAUSE.on){
    VIEW.bob = S.moving ? Math.sin(S.walkPhase)*2.2*DPR : 0;
    drawFP(); drawAnomaly(); drawMapOverlay(); drawActBar(); if (MAPV.on) drawFullMap();
    drawNightOverlay(); trDraw(); return; }
  if (S.screen==='title'){ S.titleT+=1/60; menuSync(); drawTitleArt(); trDraw(); return; }
  if (TITLE.sig!=='hidden') menuHide();
  if (S.screen==='pro'){ S.titleT+=1/60; drawTitleArt();
    ctx.fillStyle='rgba(6,5,4,0.72)'; ctx.fillRect(0,0,MW,MH); trDraw(); return; }

  var shx=(SHAKE.mag&&OPT.shake)? (hash2(Math.floor(SHAKE.t*60),1,7)-0.5)*SHAKE.mag*DPR : 0;
  var shy=SHAKE.mag? (hash2(Math.floor(SHAKE.t*60),2,7)-0.5)*SHAKE.mag*DPR : 0;
  ctx.setTransform(1,0,0,1,shx,shy);
  ctx.fillStyle=P('sky'); ctx.fillRect(-20,-20,MW+40,MH+40);

  var vw=W/cam.z, vh=H/cam.z;
  var minX=200*SC, maxX=770*SC, minY=50*SC, maxY=1330*SC;
  var tx=(maxX-minX<vw)?(minX+maxX)/2:clamp(S.x,minX+vw/2,maxX-vw/2);
  var ty=(maxY-minY<vh)?(minY+maxY)/2:clamp(S.y,minY+vh/2,maxY-vh/2);
  if (!camS.init){ camS.x=tx; camS.y=ty; camS.init=true; }
  var kk=Math.min(1,(1/60)*6.5);
  camS.x+=(tx-camS.x)*kk; camS.y+=(ty-camS.y)*kk;
  cam.x=camS.x; cam.y=camS.y;

  var Rr=(S.mode==='in'?108:190);
  if (S.san<50) Rr*=(0.86+0.14*S.san/50);
  var dim = DEV.raw ? 'rgba(0,0,0,0)' : (BW ? DIM_B : DIM_T);

  buildLevel();

  // ① 静态底图（暗、不实时）
  ctx.save();
  ctx.translate(MW/2+shx,MH/2+shy); ctx.scale(cam.z*DPR,cam.z*DPR); ctx.translate(-cam.x,-cam.y);
  ctx.globalAlpha=0.5;
  ctx.drawImage(BASE.cv, BASE.x, BASE.y, BASE.w, BASE.h);
  ctx.globalAlpha=1;
  ctx.restore();
  // ② 压暗
  ctx.fillStyle=dim; ctx.fillRect(-20,-20,MW+40,MH+40);

  // ③ 视线多边形（被墙挡住）→ 裁剪后画实时世界
  buildVis(S.x,S.y,S.ang,Rr);
  ctx.save();
  ctx.translate(MW/2+shx,MH/2+shy); ctx.scale(cam.z*DPR,cam.z*DPR); ctx.translate(-cam.x,-cam.y);
  ctx.beginPath();
  ctx.moveTo(S.x,S.y);
  for(var vi=0;vi<=VIS.n;vi++) ctx.lineTo(VIS.arr[2+vi*2], VIS.arr[3+vi*2]);
  ctx.closePath(); ctx.clip();
  ctx.lineCap='round'; ctx.lineJoin='round';
  if (S.mode==='out'){
    for(var pi=0;pi<G.polys.length;pi++) drawShape(ctx,G.polys[pi]);
    for(pi=0;pi<ACCENTS.length;pi++) drawAccentParts(ctx,ACCENTS[pi]);
  } else drawInteriorTo(ctx, INTERIORS[S.room]);
  drawPlayer();
  // 远端渐隐
  var gg=ctx.createRadialGradient(S.x,S.y,Rr*0.60,S.x,S.y,Rr);
  gg.addColorStop(0, BW?'rgba(26,26,26,0)':'rgba(44,41,38,0)');
  gg.addColorStop(1, dim);
  ctx.fillStyle=gg;
  ctx.beginPath(); ctx.moveTo(S.x,S.y);
  ctx.arc(S.x,S.y,Rr,S.ang-FOV,S.ang+FOV); ctx.closePath(); ctx.fill();
  ctx.restore();

  // ④ 视野两侧羽化（6° 内由不透明渐隐到压暗色）
  ctx.save();
  ctx.translate(MW/2+shx,MH/2+shy);
  var px=(S.x-cam.x)*cam.z*DPR, py=(S.y-cam.y)*cam.z*DPR;
  var Rpx=Rr*cam.z*DPR;
  var N=6;
  for(var si=0;(!DEV.noFeather)&&si<N;si++){
    var a0=FOV+FOV_FEATHER*(si/N), a1=FOV+FOV_FEATHER*((si+1)/N);
    var al=(si+1)/N;
    ctx.fillStyle = BW ? 'rgba(26,26,26,'+(al*0.28)+')' : 'rgba(44,41,38,'+(al*0.28)+')';
    ctx.beginPath(); ctx.moveTo(px,py);
    ctx.arc(px,py,Rpx*1.02, S.ang+a0, S.ang+a1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px,py);
    ctx.arc(px,py,Rpx*1.02, S.ang-a1, S.ang-a0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // ⑤ 重音物穿透黑暗
  if (BW && S.mode==='out'){
    ctx.save();
    ctx.translate(MW/2+shx,MH/2+shy); ctx.scale(cam.z*DPR,cam.z*DPR); ctx.translate(-cam.x,-cam.y);
    for(var ai=0;ai<ACCENTS.length;ai++) if (ACCENTS[ai].glow) drawAccentParts(ctx,ACCENTS[ai],0.30);
    ctx.restore();
  }
  drawAnomaly();
  drawMapOverlay(); drawActBar(); drawPhoneGame();
  if (MAPV.on) drawFullMap();
  drawNight();
  if (DEV.pv && DEV.pv.indexOf('D:')===0) drawDevDeath(DEV.pv.slice(2), DEV.pvT);
  else if (DEV.pv) drawDevPreview();
  if (DEV.showVis){
    ctx.save(); ctx.translate(MW/2+shx,MH/2+shy); ctx.scale(cam.z*DPR,cam.z*DPR); ctx.translate(-cam.x,-cam.y);
    ctx.strokeStyle='rgba(80,230,220,0.85)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(S.x,S.y);
    for(var dv=0;dv<=VIS.n;dv++) ctx.lineTo(VIS.arr[2+dv*2], VIS.arr[3+dv*2]);
    ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  if (DEV.showOcc && OCC.data){
    ctx.save(); ctx.translate(MW/2+shx,MH/2+shy); ctx.scale(cam.z*DPR,cam.z*DPR); ctx.translate(-cam.x,-cam.y);
    ctx.fillStyle='rgba(255,90,70,0.30)';
    for(var gy2=0;gy2<OCC.gh;gy2++) for(var gx2=0;gx2<OCC.gw;gx2++)
      if (OCC.data[gy2*OCC.gw+gx2]) ctx.fillRect(OCC.x0+gx2*OCC.cell+0.5, OCC.y0+gy2*OCC.cell+0.5, OCC.cell-1, OCC.cell-1);
    ctx.restore();
  }
  drawDeath();
  if (S.dead){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,MW,MH);
  }
  if (S.dead){ trDraw(); drawFall(); return; }
  ctx.setTransform(1,0,0,1,0,0);
  trDraw();
  drawFall();
  drawStick();
}

/* ============================ 更新 ============================ */
function update(dt){
  if (S.screen!=='play'){ flashForceEnd(); return; }
  if (PAUSE.on||RT.end||MAPV.on){ flashForceEnd(); return; }
  if (S.death){ deathUpdate(dt); return; }
  if (S.dead){ S.deadT+=dt; return; }
  var ax=0, ay=0;
  if (K['w']||K['arrowup']) ay-=1;
  if (K['s']||K['arrowdown']) ay+=1;
  if (K['a']||K['arrowleft']) ax-=1;
  if (K['d']||K['arrowright']) ax+=1;
  if (TOUCH.active){
    ax=TOUCH.dx; ay=TOUCH.dy;
    if (Math.abs(ax)<0.16) ax=0; if (Math.abs(ay)<0.16) ay=0;
    if (VIEW.fp && Math.abs(ax)<0.3) ax=0;
    K['shift'] = !!TOUCH.sprint;
  }
  if (AN.cur==='loop' && AN.loopInv && !(K[' ']||K['shift'])){ ax=-ax; ay=-ay; }
  if (S.unwell>0){ ax*=0.55; ay*=0.55; }
  if (USE.phone===2){ ax*=0.55; ay*=0.55; }
  if (S.seated){ ax=0; ay=0; K['shift']=false; }
  if (ACT.on){ ax=0; ay=0; }
  var wantRun=!!(K['shift']&&(ax||ay));
  if (wantRun && (S.stam<=6||(S.stam<=30&&S.stamCool>0))) wantRun=false;
  S.sprinting=wantRun;
  if (wantRun){ S.stam-=STAM_DRAIN*dt; S.stamCool=0.9; if(S.stam<0)S.stam=0; }
  else { S.stamCool-=dt; if(S.stamCool<=0) S.stam=Math.min(STAM_MAX,S.stam+STAM_REGEN*dt); }
  if (S.moving) S.idle=0; else S.idle=(S.idle||0)+dt;   // 站定多久，引导要看这个
  var m=Math.sqrt(ax*ax+ay*ay), tvx=0, tvy=0;
  /* 第一人称：W/S 前进后退、A/D 平移，方向都以「我面朝哪」为准；
     左右转由鼠标横移 / ←→ 负责（俯视模式保持原样）。 */
  if (VIEW.fp){
    var turn = (K['arrowleft']?-1:0) + (K['arrowright']?1:0);
    if (TOUCH.active) turn += TOUCH.dx*0.9;
    if (turn) S.ang += turn*2.4*dt;
  }
  if (VIEW.fp && !S.seated && (ax||ay)){
    var ca=Math.cos(S.ang), sa=Math.sin(S.ang);
    var fw=-ay, st=ax;
    ax = fw*ca - st*sa;
    ay = fw*sa + st*ca;
    S.faceHold=1.2;
  } else if (VIEW.fp && (K['arrowleft']||K['arrowright'])){
    /* 纯转视角时不算移动 */
  }
  m=Math.sqrt(ax*ax+ay*ay);
  if (m>0){ ax/=m; ay/=m;
    if (!VIEW.fp){ S.ang=angLerp(S.ang,Math.atan2(ay,ax),Math.min(1,dt*16)); }
    var spd=S.sprinting?SPD_WALK+(SPD_RUN-SPD_WALK)*(0.35+0.65*S.stam/STAM_MAX):SPD_WALK;
    tvx=ax*spd; tvy=ay*spd; }
  var kk=Math.min(1,dt*13);
  S.vx+=(tvx-S.vx)*kk; S.vy+=(tvy-S.vy)*kk;
  var nx=S.x+S.vx*dt, ny=S.y+S.vy*dt;
  if (S.mode==='out'){
    if (!solidOutdoor(nx,S.y,PROOM)) S.x=nx; else S.vx*=0.2;
    if (!solidOutdoor(S.x,ny,PROOM)) S.y=ny; else S.vy*=0.2;
  } else {
    var Rb=INTERIORS[S.room];
    if (!solidIndoor(Rb,nx,S.y,PROOM)) S.x=nx; else S.vx*=0.2;
    if (!solidIndoor(Rb,S.x,ny,PROOM)) S.y=ny; else S.vy*=0.2;
  }
  if (S.enterCool>0) S.enterCool-=dt;
  if (SCENECOOL>0) SCENECOOL-=dt;
  if (S.unwell>0) S.unwell-=dt; spotTick(); actTick(dt);
  dangerTick(dt); roamTick(dt); guideTick(dt);
  if (USE.phone===2 && S.screen==='play' && !S.dead){
    S.batt = Math.max(0, S.batt - dt*4.2);
    S.san = Math.min(100, S.san + dt*1.5);
    S.gameT += dt;
    AN.next -= dt*2.6;                       // 打游戏会让异象来得更快
    if (S.batt<=0){ USE.phone=0; SFX.blink();
      os('我：屏幕黑了。彻底没电了。',4.0); }
    else if (S.gameT>5 && !AN.cur && Math.random()<dt*0.16) anStart();
  } if (USE.coat && S.san<100 && !S.dead) S.san=Math.min(100,S.san+dt*0.55); noteTick(); roofTick();
  nightUpdate(dt);
  eggTick();
  tryAutoEnter();
  var sp=Math.sqrt(S.vx*S.vx+S.vy*S.vy);
  S.moving=sp>2;
  if (S.moving){ S.walkPhase+=dt*(S.sprinting?15:10); S.stepAcc+=sp*dt;
    var gap=S.sprinting?13:17;
    if (S.stepAcc>gap){ S.stepAcc=0; SFX.step(S.mode==='in'); } }
  else S.walkPhase+=dt*1.6;

  S.tsec += dt*rateAt(S.tsec);
  if (S.tsec>=24*3600) S.tsec-=24*3600;
  if ((S.day||1)===1 && S.tsec>=22.5*3600){ S.day=2; SFX.bell();
    os('我：天彻底黑了。今晚……不一样了。',5.0); }
  var pi=periodAt(S.tsec/60);
  if (pi!==S.period){ S.period=pi; if (pi>=0){ SFX.bell(); toast('铃响了 —— '+SCHED[pi][2]); } }

  var need=needWhere(S.tsec), mul;
  if (need==='教室'){
    var okSeat=(S.mode==='in'&&S.room&&S.room.indexOf('teach')===0&&tileAt(INTERIORS[S.room],S.x,S.y)==='P'&&S.seated);
    if (okSeat) mul=-1.6; else if (inClassroom()>=0) mul=0.9; else mul=2.4;
  } else if (need==='宿舍'){ mul=(S.mode==='in'&&S.room&&S.room.indexOf('dorm')===0)?-1.4:1.2; }
  else if (need==='大操场'){ mul=(S.mode==='out')?-1.2:0.5; }
  else mul=-0.8;
  if (mul>0 && sHas('card') && S.mode==='out' && isNight()) mul*=0.5;   // 学生证：夜里在外被当成值日生
  S.viol=clamp(S.viol+mul*dt,0,100);
  if (S.viol>=100){
    if (isDay1()){
      RULEWARN++; S.viol=52; S.san=Math.max(0,S.san-16); S.unwell=3.4;
      if (RULEWARN===1) os('我：头突然很沉……胸口发闷。是不是我不该站在这儿？',5.4);
      else if (RULEWARN===2) os('我：又来了。这次更晕，耳朵里嗡嗡的。',4.6);
      else if (RULEWARN===3) os('我：我明白了 —— 在这里，规矩不是规矩，是命。',5.4);
      else os('我：不能再乱来了。',3.0);
    } else killViol();
  }

  var drain=0.018;
  if (S.tsec/3600>19) drain+=0.05;
  if (BW) drain*=1.25;
  drain*=(1+S.viol/70);
  S.san=clamp(S.san-drain*dt,0,100);
  if (S.san<=0) kill('你成了课表的一部分。');

  if (S.san<55){ S.heartT-=dt; if (S.heartT<=0){ SFX.heart(); S.heartT=0.55+S.san/100; } }
  anUpdate(dt);
  if (S.toastT>0){ S.toastT-=dt; if(S.toastT<=0) elToast.classList.remove('show'); }
}

/* ============================ HUD ============================ */
var elSan=document.getElementById('sanbar'), elClock=document.getElementById('clock'),
    elSched=document.getElementById('sched'), elLoc=document.getElementById('locname'),
    elToast=document.getElementById('toast'), elPrompt=document.getElementById('prompt'),
    elChoices=document.getElementById('choices'), elVign=document.getElementById('vign');
var CH=[];
/* ---- 主角对话框 + 底部内心字幕 ---- */
var elDlg=document.getElementById('dlg'), elDlgB=document.getElementById('dlgb'),
    elDlgC=document.getElementById('dlgc'), elSub=document.getElementById('sub');
var DLG={ open:false, t:0, dur:0, cb:null };
/* 统一走底部字幕：主角说话/场景说明用「我：」，纯内心不带前缀。不再是聊天气泡。 */
function subShow(text,dur){ elSub.textContent=text; elSub.classList.add('on'); SUB.t=0; SUB.dur=dur||OPT.sub||4.2; }
function say(text,dur){
  var t=String(text);
  if (t.indexOf('我：')!==0) t='我：'+t;
  subShow(t,dur);
}
function ask(text,opts,cb){
  var t=String(text); if (t.indexOf('我：')!==0) t='我：'+t;
  subShow(t,0); SUB.dur=0;
  elDlgC.innerHTML='';
  for(var i=0;i<opts.length;i++){
    var b=document.createElement('button');
    b.innerHTML='<i>'+(i+1)+'</i>'+opts[i];
    (function(k){ b.onclick=function(){ SFX.ui(); elDlgC.innerHTML=''; dlgClose(); cb(k); }; })(i);
    elDlgC.appendChild(b);
  }
  DLG.open=true; DLG.t=0; DLG.dur=0;
}
function dlgClose(){ elDlgC.innerHTML=''; DLG.open=false; }
var SUB={ t:0, dur:0 };
function os(text,dur){ subShow(text,dur||4.2); }
function dlgUpdate(dt){
  if (DLG.open && DLG.dur>0){ DLG.t+=dt; if (DLG.t>DLG.dur) dlgClose(); }
  if (SUB.dur>0){ SUB.t+=dt; if (SUB.t>SUB.dur){ SUB.dur=0; elSub.classList.remove('on'); } }
  if (DLG.open && S.screen==='play' && !S.dead){
    var sx=(S.x-cam.x)*cam.z+W/2, sy=(S.y-cam.y)*cam.z+H/2;
    var bw=elDlg.offsetWidth||300;
    elDlg.style.left = clamp(sx-bw*0.16, 12, Math.max(12,W-bw-12))+'px';
    elDlg.style.top  = clamp(sy+56, 56, Math.max(56,H-200))+'px';
  }
}
function toast(msg){ elToast.textContent=msg; elToast.classList.add('show'); S.toastT=2.6; }
function pickChoice(i){ if(i<CH.length){ SFX.ui(); toast('（选项系统 P6 接入）'+CH[i]); } }
function roomLabel(){
  if (S.mode==='out') return '武大附中 · 校园';
  var R=INTERIORS[S.room]; if(!R) return '';
  var t=tileAt(R,S.x,S.y);
  if (t==='B') return R.name+' · 男厕';
  if (t==='G') return R.name+' · 女厕';
  if (t==='L') return R.name+' · 北连廊口';
  if (t==='M') return R.name+' · 南连廊口';
  var tx=Math.floor((S.x-R.ox)/R.tw);
  if (S.room.indexOf('teach')===0) for(var k=0;k<ROOMS.length;k++) if (tx>=ROOMS[k][0]&&tx<=ROOMS[k][1]) return R.name+' · '+RNAME[k];
  if (R.rooms) for(var j=0;j<R.rooms.length;j++) if (tx>=R.rooms[j][0]&&tx<=R.rooms[j][1]) return R.name+' · 第 '+(j+1)+' 间';
  return R.name;
}
function hud(){
  if (S.screen!=='play'){ elPrompt.style.display='none'; return; }
  elSan.style.transform='scaleX('+(S.san/100)+')';
  elClock.textContent=fmtTime(S.tsec);
  elSched.textContent=scheduleLabel(S.tsec);
  elSched.className = S.viol>50 ? 'warn' : '';
  elLoc.textContent=roomLabel();
  elVign.style.opacity = (S.san<45&&!S.dead&&!S.death) ? String(clamp((45-S.san)/45,0,0.9)) : '0';
  var p=null;
  if (S.dead||S.death) p=null;
  else if (S.mode==='out'){ var n=nearestEnterable();
    if (n) p=n.gate?'走到校门':('走近「'+n.obj.n+'」的门'); }
  else { var R=INTERIORS[S.room], t=tileAt(R,S.x,S.y);
    if (t==='S') p='按 E 上楼 · Shift+E 下楼';
    else if (t==='O') p='按 E 出去';
    else if (t==='L') p='按 E 走北连廊（通行政楼）';
    else if (t==='M') p='按 E 走南连廊';
    else if (t==='P') p=S.seated?'按 E 站起来':'按 E 坐下（你的座位）';
    else if (t==='B') p='按 E 看看'; }
  if (p){ elPrompt.textContent=p; elPrompt.style.display='block'; } else elPrompt.style.display='none';
}

/* ============================ 主循环 ============================ */
var last=0, acc=0, frames=0;
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last=now;
  var dt=(now-last)/1000; last=now;
  if (dt>DTMAX) dt=DTMAX;
  trUpdate(dt);
  acc+=dt;
  var guard=0;
  while (acc>=STEP && guard<6){ update(STEP); acc-=STEP; guard++; }
  if (guard>=6) acc=0;
  frames++;
  if (FLASHBLOOM.t>0) FLASHBLOOM.t-=dt;
  flashUpdate(dt);            // 必须放在 update 之外 —— update 在开地图/暂停/死亡时会提前 return，
                              // 放在里面会让闪回卡住，BW 停在 false，再也切不回里世界
  if (S.dead) deadSeqTick(dt);
  TITLELOCK=0; ENDLOCK=0;
  fadeUpdate(dt);
  qSample(dt);
  if (OPT.boil && (frames%BOIL)===0) boil=(boil+1)&3;
  /* 死亡演出：暗角收拢 + 整体压黑 + 一点残留的呼吸感 */
  if (S.dead && !DEADSEQ.done){
    var da = clamp(DEADSEQ.t/DEADSEQ.dur, 0, 1);
    var dq = da*da;
    var ctx=C;                 // 帧循环里没有局部 ctx，用画布上下文
    var dg = ctx.createRadialGradient(MW*0.5, MH*0.5, Math.min(MW,MH)*(0.62-dq*0.62),
                                      MW*0.5, MH*0.5, Math.max(MW,MH)*(0.75-dq*0.30));
    dg.addColorStop(0, 'rgba(0,0,0,'+(dq*0.72)+')');
    dg.addColorStop(1, 'rgba(0,0,0,'+(0.25+dq*0.75)+')');
    ctx.fillStyle=dg; ctx.fillRect(0,0,MW,MH);
    ctx.fillStyle='rgba(0,0,0,'+(dq*0.45)+')'; ctx.fillRect(0,0,MW,MH);
    /* 最后 0.6 秒补上一层纯黑，保证 UI 出来时背景是全黑的 */
    if (DEADSEQ.t > DEADSEQ.dur-0.6){
      var kb=(DEADSEQ.t-(DEADSEQ.dur-0.6))/0.6;
      ctx.fillStyle='rgba(0,0,0,'+clamp(kb,0,1)+')'; ctx.fillRect(0,0,MW,MH);
    }
  }
  devUpdate(dt);
  dlgUpdate(dt);
  fallUpdate(dt);
  if (S.screen==='play' && !S.started){ S.screen='title'; elTitle.classList.add('on'); elHud.classList.remove('on'); }
  render(); hud();
}

/* ============================ 启动 ============================ */
function boot(){
  C=document.getElementById('cv').getContext('2d',{alpha:false});
  resize();
  qApply();
  buildAll(); scaleAll(); buildOutdoor(); buildInterior('teach1');
  S.x=561*SC; S.y=1040*SC;
  renderBag();
  try { if (typeof location!=='undefined' && location.search.indexOf('dev')>=0) devToggle(); } catch(e){}
  bindTouch(); bindOpt(); optLoad(); applyOpt();
  S.screen='title';
  try{ menuSync(); }catch(e){}
  elTitle.classList.add('on');
  requestAnimationFrame(frame);
}
boot();

               PAUSE:PAUSE, saveGame:saveGame, loadGame:loadGame, pauseOpen:pauseOpen, pauseClose:pauseClose, toggleBag:toggleBag,
               useTerminal:useTerminal, playPiano:playPiano, addItem:addItem, sHas:sHas,

               GARAGE:GARAGE, GARAGE_CARS:GARAGE_CARS, carAt:carAt,
               ACT:ACT, ACTS:ACTS, actStart:actStart, actStop:actStop, actTick:actTick, actDim:actDim,
               G:G, rebuildAll:rebuildAll, DEADSEQ:DEADSEQ, deadSeqTick:deadSeqTick, showDead:showDead, kill:kill,
               solidOutdoor:solidOutdoor, anPick:pickAnomaly, anEnd:anEnd, dif:dif, HINT:HINT, SPOTS:SPOTS, IDEAS:IDEAS, thinkOpen:thinkOpen, thinkList:thinkList, spotTick:spotTick,
               fpBox:fpBox, fpQuad:fpQuad, onField:onField, inCorridor:inCorridor, nearXY:nearXY, fpGroundPoint:fpGroundPoint, fpGroundQuad:fpGroundQuad, fpDoorPlates:fpDoorPlates, fpAccents:fpAccents,
               DRAW:{ get n(){ return VIEW.n; }, get culled(){ return VIEW.culled; }, get total(){ return VIEW.total; }, get cols(){ return VIEW.cols; } },
               isDay1:isDay1, anKill:anKill, dif:dif, get RULEWARN(){ return RULEWARN; } };
